<html lang="ja">

<title>介護福祉士 パート合格 | Kaigo Part</title>

<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#2E8B76">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --ink:#2B2926;
    --cream:#EFEAE0;
    --cream-deep:#E4DECE;
    --stone:#C9C2B4;
    --stone-line:#DDD6C6;
  }
  .theme-exam{
    --accent-fill:#2E8B76;
    --accent-text:#1F6355;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:24px;
  }
  .mincho{ font-family:'Shippori Mincho', serif; }

  /* ---------- Header ---------- */
  .app-header{
    padding:22px 20px 14px;
    border-bottom:1px solid var(--stone-line);
  }
  .brand-eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    color:var(--accent-text);
    font-weight:700;
    margin-bottom:4px;
  }
  .brand-title{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:22px;
    line-height:1.4;
  }
  .brand-sub{
    font-size:12.5px;
    color:#6b6459;
    margin-top:4px;
  }
  .brand-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:10px;
  }

  /* ---------- Ruby (furigana) ---------- */
  ruby{ ruby-position: over; }
  rt{
    font-size:0.55em;
    color:var(--accent-text);
    font-weight:500;
    user-select:none;
  }
  .hide-ruby rt{ display:none; }

  .ruby-toggle{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:6px 10px;
    border-radius:20px;
    border:1.5px solid var(--stone-line);
    background:var(--cream);
    color:#6b6459;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .ruby-toggle.on{
    border-color:var(--accent-fill);
    color:var(--accent-text);
    background:var(--cream-deep);
  }
  .ruby-toggle:active{ transform:scale(.97); }

  /* ---------- Screens ---------- */
  .screen{ display:none; flex:1; flex-direction:column; }
  .screen.active{ display:flex; }

  /* ---------- Top screen: part cards ---------- */
  .part-list{ padding:18px 20px 8px; display:flex; flex-direction:column; gap:14px; }
  .part-card{
    background:var(--cream);
    border:1.5px solid var(--stone-line);
    border-radius:14px;
    padding:16px 16px 14px;
    transition:border-color .15s ease, background .15s ease;
  }
  .part-card.selected-start{
    border-color:var(--accent-fill);
    background:var(--cream-deep);
  }
  .part-card.exempt{
    opacity:.55;
  }
  .part-card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .part-tag{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:26px;
    color:var(--accent-text);
    width:38px;
    line-height:1;
  }
  .part-info{ flex:1; }
  .part-name{
    font-family:'Shippori Mincho', serif;
    font-weight:600;
    font-size:15px;
  }
  .part-fields{
    font-size:11.5px;
    color:#6b6459;
    margin-top:3px;
    line-height:1.5;
  }
  .part-count{
    font-size:11px;
    color:var(--accent-text);
    margin-top:6px;
    font-weight:700;
  }

  .exempt-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11.5px;
    color:#6b6459;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  .checkbox{
    width:18px;height:18px;
    border:1.5px solid var(--stone);
    border-radius:5px;
    flex-shrink:0;
    position:relative;
    background:var(--cream);
  }
  .checkbox.checked{
    background:var(--accent-fill);
    border-color:var(--accent-fill);
  }
  .checkbox.checked::after{
    content:"";
    position:absolute;
    left:5px; top:1px;
    width:5px; height:9px;
    border:solid var(--cream);
    border-width:0 2px 2px 0;
    transform:rotate(40deg);
  }

  .start-btn{
    margin-top:12px;
    width:100%;
    padding:11px 0;
    border-radius:10px;
    border:1.5px solid var(--stone-line);
    background:transparent;
    color:var(--accent-text);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
  }
  .start-btn:not(:disabled):active{ transform:scale(.98); }
  .start-btn:not(:disabled){ border-color:var(--accent-fill); }
  .start-btn:disabled{
    color:var(--stone);
    border-color:var(--stone-line);
    cursor:default;
  }

  .top-note{
    padding:6px 20px 18px;
    font-size:11.5px;
    color:#8a8377;
    line-height:1.6;
  }

  /* ---------- Quiz screen ---------- */
  .quiz-topbar{
    padding:14px 20px 0;
  }
  .quiz-meta{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .quiz-part-label{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:14px;
    color:var(--accent-text);
  }
  .quiz-progress-text{
    font-size:11.5px;
    color:#6b6459;
  }
  .progress-track{
    width:100%;
    height:6px;
    background:var(--stone);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent-fill);
    border-radius:4px;
    transition:width .3s ease;
    width:0%;
  }

  .quiz-body{
    flex:1;
    padding:18px 20px 10px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .question-card{
    background:var(--cream);
    border:1.5px solid var(--stone-line);
    border-radius:14px;
    padding:18px 16px;
  }
  .question-level{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    color:var(--accent-text);
    background:var(--cream-deep);
    padding:3px 9px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .question-text{
    font-size:15px;
    line-height:1.75;
  }
  .tts-btn{
    margin-top:12px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 12px;
    border-radius:20px;
    border:1.5px solid var(--accent-fill);
    background:transparent;
    color:var(--accent-text);
    font-size:12px;
    font-weight:700;
    font-family:'Zen Kaku Gothic New', sans-serif;
    cursor:pointer;
  }
  .tts-btn:active{ transform:scale(.97); }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{
    text-align:left;
    padding:13px 14px;
    border-radius:12px;
    border:1.5px solid var(--stone-line);
    background:var(--cream);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13.5px;
    line-height:1.6;
    cursor:pointer;
  }
  .option:active{ transform:scale(.99); }
  .option.picked{
    border-color:var(--accent-fill);
    background:var(--cream-deep);
  }
  .option.correct{
    border-color:var(--accent-fill);
    background:var(--cream-deep);
    color:var(--accent-text);
    font-weight:700;
  }
  .option.wrong{
    border-color:#B45252;
    background:#F3E6E4;
    color:#8B3A3A;
  }
  .option[disabled]{ cursor:default; }

  .answer-btn{
    margin-top:2px;
    width:100%;
    padding:13px 0;
    border-radius:12px;
    border:none;
    background:var(--stone);
    color:var(--cream);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
  }
  .answer-btn.ready{ background:var(--accent-fill); }
  .answer-btn.done{ background:var(--stone); color:#8a8377; }
  .answer-btn:disabled{ cursor:default; }

  .tip-card{
    display:none;
    background:var(--cream-deep);
    border-radius:12px;
    padding:14px 15px;
    font-size:12.5px;
    line-height:1.75;
    color:var(--ink);
  }
  .tip-card.show{ display:block; }
  .tip-label{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:11.5px;
    color:var(--accent-text);
    margin-bottom:6px;
    letter-spacing:.05em;
  }

  .next-btn{
    display:none;
    width:100%;
    padding:13px 0;
    border-radius:12px;
    border:1.5px solid var(--accent-fill);
    background:var(--accent-fill);
    color:var(--cream);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .next-btn.show{ display:block; }
  .next-btn:active{ transform:scale(.99); }

  .back-link{
    padding:10px 20px 0;
    font-size:12px;
    color:#8a8377;
    cursor:pointer;
    width:fit-content;
  }

  /* ---------- Result screen ---------- */
  .result-body{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 24px;
    text-align:center;
    gap:14px;
  }
  .result-part{
    font-family:'Shippori Mincho', serif;
    font-size:38px;
    font-weight:800;
    color:var(--accent-text);
  }
  .result-title{
    font-family:'Shippori Mincho', serif;
    font-size:18px;
    font-weight:700;
  }
  .result-score{
    font-size:14px;
    color:#6b6459;
  }
  .result-score b{ color:var(--accent-text); font-size:20px; }
  .result-actions{
    margin-top:18px;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
</style>
</head>
<body>
<div class="app theme-exam">

  <div class="app-header">
    <div class="brand-row">
      <div>
        <div class="brand-eyebrow">YOSHIDA EDTECH WORKS ／ EXAM</div>
        <div class="brand-title">介護福祉士 パート合格<br>Kaigo-Part</div>
      </div>
      <button class="ruby-toggle on" id="rubyToggle">ふ ふりがな</button>
    </div>
    <div class="brand-sub">A・B・Cの3パートに分けて、少しずつ合格を目指します。</div>
  </div>

  <!-- ============ TOP SCREEN ============ -->
  <section id="screen-top" class="screen active">
    <div class="part-list" id="partList"></div>
    <div class="top-note">
      すでに合格したパートは「免除する」にチェックを入れます。チェックした内容は端末に保存され、次に開いたときも引き継がれます。各パートは389問の全データベースから毎回ランダムに出題されるため、繰り返し演習しても飽きずに学習できます。
    </div>
  </section>

  <!-- ============ QUIZ SCREEN ============ -->
  <section id="screen-quiz" class="screen">
    <div class="back-link" id="backToTop">← パート選択にもどる</div>
    <div class="quiz-topbar">
      <div class="quiz-meta">
        <div class="quiz-part-label" id="quizPartLabel">Aパート</div>
        <div class="quiz-progress-text" id="quizProgressText">1 / 5問</div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="quiz-body">
      <div class="question-card">
        <div class="question-level" id="questionLevel">medium</div>
        <div class="question-text" id="questionText"></div>
        <button class="tts-btn" id="ttsBtn">🔊 問題文を読み上げる</button>
      </div>

      <div class="options" id="optionsList"></div>

      <button class="answer-btn" id="answerBtn" disabled>解答する</button>

      <div class="tip-card" id="tipCard">
        <div class="tip-label">TAGALOG TIP</div>
        <div id="tipText"></div>
      </div>

      <button class="next-btn" id="nextBtn">次の問題へ</button>
    </div>
  </section>

  <!-- ============ RESULT SCREEN ============ -->
  <section id="screen-result" class="screen">
    <div class="result-body">
      <div class="result-part" id="resultPart">A</div>
      <div class="result-title">パートの演習が終わります</div>
      <div class="result-score"><b id="resultScore">0 / 0</b> 問正解します</div>
      <div class="result-actions">
        <button class="start-btn" id="resultRetry" style="border-color:var(--accent-fill);">同じパートをもう一度解く</button>
        <button class="answer-btn ready" id="resultBackTop">パート選択にもどる</button>
      </div>
    </div>
  </section>

</div>

<script>
/* ================= DATA ================= */
const QUESTIONS = [
{"id": "care-001", "part": "A", "category": "人間の尊厳と自立", "level": "easy", "question": "利用者の尊厳（そんげん）を守るための行動として、最も適切なものを1つ選びなさい。", "options": ["利用者の意見（いけん）を無視して決める", "利用者の話（はなし）をよく聞く", "利用者を子ども扱い（こどもあつかい）する"], "answer": 1, "tip_tl": "Ang tema dito ay ang paggalang sa dignidad ng resident at ang kanyang karapatang magpasya para sa sarili. Ang dignidad ng resident ang dapat unahin sa bawat desisyon. Ang active listening ay ang tunay na pakikinig bago mag-alok ng solusyon. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-002", "part": "A", "category": "社会の理解", "level": "medium", "question": "介護保険制度（かいごほけんせいど）において、保険者（ほけんじゃ）となるのは次のうちどれか。", "options": ["市町村（しちょうそん）および特別区（とくべつく）", "国（くに）", "都道府県（とどうふけん）"], "answer": 0, "tip_tl": "Kailangang maintindihan dito kung paano gumagana ang sistema ng lipunan at seguro na sumusuklob sa mga matatanda at PWD. Ang long-term care insurance ay ang public na seguro na sumasagot sa gastos ng pangangalaga sa Japan. Ang munisipalidad (shichouson) ang karaniwang insurer sa long-term care insurance system. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-003", "part": "A", "category": "生活支援技術", "level": "hard", "question": "ベッドから車椅子（くるまいす）へ移乗（いじょ）する際、片麻痺（かたまひ）のある利用者への介助で、最も安全な方法はどれか。", "options": ["車椅子のブレーキを外した状態で移乗させる", "利用者の両脇（りょうわき）を抱えて力任せに引き上げる", "健側（けんそく）に車椅子を45度（ど）の角度で配置する"], "answer": 2, "tip_tl": "Ito ay tungkol sa aktwal na kilos-kamay sa pag-aalaga — ligtas, tama, at magalang sa bawat hakbang. Sa pag-transfer o paglipat ng resident, laging unahin ang kaligtasan at tamang postura. Kapag may hemiplegia (paralisis sa isang bahagi), simulan ang paggalaw mula sa malakas na bahagi ng katawan. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-004", "part": "A", "category": "人間の尊厳と自立", "level": "easy", "question": "介護（かいご）の現場（げんば）で、利用者（りようしゃ）のプライバシーを守るために最も適切な行動はどれですか。", "options": ["利用者（りようしゃ）の秘密（ひみつ）を他の人に話す", "利用者（りようしゃ）の荷物（にもつ）を勝手に片付ける", "部屋（へや）に入るときは必ずノックをする"], "answer": 2, "tip_tl": "Ang tema dito ay ang paggalang sa dignidad ng resident at ang kanyang karapatang magpasya para sa sarili. Iginagalang ang privacy ng resident sa lahat ng oras. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-005", "part": "A", "category": "人間の尊厳と自立", "level": "easy", "question": "利用者の自己決定（じこけってい）を助けるための介護職（かいごしょく）の行動として、正しいものはどれですか。", "options": ["何も決めさせない", "介護職（かいごしょく）がすべてを決める", "利用者に自分で服（ふく）を選んでもらう"], "answer": 2, "tip_tl": "Dito, ang pinakamahalaga ay tratuhin ang resident bilang tao na may sariling boses at karapatan, hindi bilang isang gawain lamang. Igalang ang karapatan ng resident na magpasya para sa sarili niya. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-006", "part": "A", "category": "人間の尊厳と自立", "level": "easy", "question": "ノーマライゼーション（のーまらいぜーしょん）の考え方（かんがえかた）について、正しいものはどれですか。", "options": ["特別な人だけを大切にする", "高齢者（こうれいしゃ）の外出を禁止する", "障害（しょうがい）があっても地域（ちいき）で普通の生活を送る"], "answer": 2, "tip_tl": "Ang pangunahing prinsipyo rito ay 'jiritsu shien' — suportahan ang kalayaan at pagpapasya ng resident sa kanyang sariling buhay. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-007", "part": "A", "category": "人間の尊厳と自立", "level": "easy", "question": "アドボカシー（あどぼかしー・権利擁護）の正しい説明はどれですか。", "options": ["利用者（りようしゃ）の権利（けんり）や意思（いし）を守り代弁すること", "お年寄り（おとしより）を子ども扱いすること", "施設（しせつ）のルールを絶対に守らせること"], "answer": 0, "tip_tl": "Ang tema dito ay ang paggalang sa dignidad ng resident at ang kanyang karapatang magpasya para sa sarili. Ito'y konektado sa pangunahing karapatang pantao ng bawat resident. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-008", "part": "A", "category": "人間の尊厳と自立", "level": "easy", "question": "虐待（ぎゃくたい）を発見（はっけん）したときの介護職（かいごしょく）の対応として、最も適切なものはどれですか。", "options": ["市町村（しちょうそん）の窓口（まどぐち）などに通報する", "利用者を部屋（へや）に閉じ込める", "見なかったことにする"], "answer": 0, "tip_tl": "Dito, ang pinakamahalaga ay tratuhin ang resident bilang tao na may sariling boses at karapatan, hindi bilang isang gawain lamang. Mahigpit na ipinagbabawal ang anumang uri ng abuso sa pag-aalaga. Ang pag-uulat sa ibang propesyonal ay dapat malinaw, maikli, at tumpak. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-010", "part": "A", "category": "社会の理解", "level": "easy", "question": "介護保険制度（かいごほけんせいど）の財源（ざいげん・お金）について、正しいものはどれですか。", "options": ["半分（はんぶん）は公費（税金）で、半分は保険料（ほけんりょう）で集める", "すべて国（くに）の借金（しゃっきん）でまかなう", "すべて利用者の寄付（きふ）で集める"], "answer": 0, "tip_tl": "Ito ay tungkol sa mga institusyon at batas na bumubuo sa social safety net ng Japan para sa mga nangangailangan ng pangangalaga. Ang long-term care insurance ay ang public na seguro na sumasagot sa gastos ng pangangalaga sa Japan. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-011", "part": "A", "category": "社会の理解", "level": "easy", "question": "介護保険（かいごほけん）のサービスを受けるために、最初に申請（しんせい）する場所はどこですか。", "options": ["近くの病院（びょういん）", "警察署（けいさつしょ）", "市町村（しちょうそん）の窓口"], "answer": 2, "tip_tl": "Ang paksang ito ay tungkol sa mga batas at sistema ng lipunan (long-term care insurance, welfare programs) na sumusuporta sa pangangalaga sa Japan. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-012", "part": "A", "category": "社会の理解", "level": "easy", "question": "介護保険制度（かいごほけんせいど）で、第1号被保険者（だい1ごうひほけんじゃ）となるのは何歳以上の人ですか。", "options": ["75歳以上（さいいじょう）", "65歳以上（さいいじょう）", "70歳以上（さいいじょう）"], "answer": 1, "tip_tl": "Kailangang maintindihan dito kung paano gumagana ang sistema ng lipunan at seguro na sumusuklob sa mga matatanda at PWD. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-013", "part": "A", "category": "社会の理解", "level": "easy", "question": "要介護認定（ようかいごにんてい）の調査（ちょうさ）を行うのは誰ですか。", "options": ["利用者の孫（まご）", "学校（がっこう）の先生", "市町村（しちょうそん）の調査員など"], "answer": 2, "tip_tl": "Ito ay tungkol sa mga institusyon at batas na bumubuo sa social safety net ng Japan para sa mga nangangailangan ng pangangalaga. Ang assessment ay ang unang hakbang — kalapin ang tamang impormasyon bago magplano. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-014", "part": "A", "category": "社会の理解", "level": "easy", "question": "利用者が自宅（じたく）で生活を続けるために、ケアプラン（けあぷらん）を作る専門職（せんもんしょく）は誰ですか。", "options": ["介護支援専門員（かいごしえんせんもんいん・ケアマネジャー）", "調理師（ちょうりし）", "会計士（かいけいし）"], "answer": 0, "tip_tl": "Ang paksang ito ay tungkol sa mga batas at sistema ng lipunan (long-term care insurance, welfare programs) na sumusuporta sa pangangalaga sa Japan. Ang care manager ang tumutulong ayusin ang buong care plan ng resident. Ang care plan ay dapat base sa aktwal na pangangailangan ng resident, hindi sa kaginhawaan ng staff. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-015", "part": "A", "category": "社会の理解", "level": "easy", "question": "介護保険（かいごほけん）のサービスにかかる費用（ひよう）のうち、利用者が窓口（まどぐち）で払うお金（自己負担）の基本（きほん）は何割（なんわり）ですか。", "options": ["7割（わり）", "1割（わり）", "10割（わり）"], "answer": 1, "tip_tl": "Kailangang maintindihan dito kung paano gumagana ang sistema ng lipunan at seguro na sumusuklob sa mga matatanda at PWD. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-016", "part": "A", "category": "社会の理解", "level": "easy", "question": "日本の社会保障（しゃかいほしょう）の4つの柱（はしら）に含まれないものはどれですか。", "options": ["公的扶助（こうてきふじょ）", "社会保険（しゃかいほけん）", "個人的な貯金（ちょきん）"], "answer": 2, "tip_tl": "Ito ay tungkol sa mga institusyon at batas na bumubuo sa social safety net ng Japan para sa mga nangangailangan ng pangangalaga. Ang public assistance ay tumitiyak ng pinakamababang antas ng pamumuhay para sa mga nangangailangan. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-017", "part": "A", "category": "介護の基本", "level": "easy", "question": "介護職（かいごしょく）が仕事（しごと）をするときに守るべき、利用者の秘密（ひみつ）を外に漏らさない義務（ぎむ）を何といいますか。", "options": ["守秘義務（しゅひぎむ）", "職務専念義務（しょくむせんねんぎむ）", "生存権（せいぞんけん）"], "answer": 0, "tip_tl": "Isa itong pangunahing prinsipyo ng propesyonal na caregiving — ang batayan bago pa man matutunan ang teknikal na kasanayan. Ang confidentiality o pagiging kompidensyal ng impormasyon ay tungkulin ng bawat propesyonal. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-018", "part": "A", "category": "介護の基本", "level": "easy", "question": "高齢者（こうれいしゃ）や障害（しょうがい）がある人が、他の人と区別（くべつ）されることなく普通の生活を送るという考え方を何といいますか。", "options": ["バリアフリー（ばりあふりー）", "ノーマライゼーション（のーまらいぜーしょん）", "プライバシ（ぷらいばしー）"], "answer": 1, "tip_tl": "Ito ay tungkol sa saligang tuntunin ng trabaho ng isang care worker, mula sa etika hanggang sa saklaw ng gawain. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-019", "part": "A", "category": "介護の基本", "level": "easy", "question": "介護（かいご）の仕事（しごと）で、最初にチームで目標（もくひょう）や方針（ほうしん）を話し合う会議（かいぎ）を何といいますか。", "options": ["サービス担当者会議（さーびすたんとうしゃかいぎ）", "反省会（はんせいかい）", "採用面接（さいようめんせつ）"], "answer": 0, "tip_tl": "Dito nakabatay ang pundasyon ng propesyon — kung paano dapat kumilos ang isang responsableng care worker. Ang case conference ay pagkakataon para pag-usapan ng buong team ang plano ng pangangalaga. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-020", "part": "A", "category": "介護の基本", "level": "easy", "question": "利用者が自分の意思（いし）で生活（せいかつ）の方法（ほうほう）を決めることを何といいますか。", "options": ["自己決定（じこけってい）", "管理（かんり）", "依存（いぞん）"], "answer": 0, "tip_tl": "Isa itong pangunahing prinsipyo ng propesyonal na caregiving — ang batayan bago pa man matutunan ang teknikal na kasanayan. Igalang ang karapatan ng resident na magpasya para sa sarili niya. Bigyang-diin ang kalayaan (autonomy) ng resident sa sarili niyang pagpapasya. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-021", "part": "A", "category": "介護の基本", "level": "easy", "question": "介護が必要（ひつよう）になっても、住み慣れた地域（ちいき）で自分らしい生活を続けるための仕組みを何といいますか。", "options": ["地域包括ケアシステム（ちいきほうかつけあしすてむ）", "生活保護制度（せいかつほごせいど）", "年金制度（ねんきんせいど）"], "answer": 0, "tip_tl": "Ito ay tungkol sa saligang tuntunin ng trabaho ng isang care worker, mula sa etika hanggang sa saklaw ng gawain. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-022", "part": "A", "category": "介護の基本", "level": "easy", "question": "利用者の健康（けんこう）や安全（あんぜん）を守るために、介護職（かいごしょく）が他の医療職（いりょうしょく）などと協力することを何といいますか。", "options": ["秘密保持（ひみつほじ）", "業務委託（ぎょうむいたく）", "多職種連携（たしょくしゅれんけい）"], "answer": 2, "tip_tl": "Dito nakabatay ang pundasyon ng propesyon — kung paano dapat kumilos ang isang responsableng care worker. Ang team work sa pagitan ng iba't ibang propesyonal ay mahalaga para sa kabuuang kalidad ng pangangalaga. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-023", "part": "A", "category": "介護の基本", "level": "easy", "question": "国際生活機能分類（こくさいせいかつきのうぶんるい）の略称（りゃくしょう）として、正しいものはどれですか。", "options": ["WHO", "ICD", "ICF"], "answer": 2, "tip_tl": "Isa itong pangunahing prinsipyo ng propesyonal na caregiving — ang batayan bago pa man matutunan ang teknikal na kasanayan. Ang ICF ay isang paraan ng pagtingin sa buhay ng tao nang holistiko — hindi lamang ang sakit, kundi buong buhay. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-024", "part": "A", "category": "コミュニケーション技術", "level": "easy", "question": "利用者の話をしっかりと聴（き）き、相手（あいて）の気持ちを理解しようとする態度（たいど）を何といいますか。", "options": ["傾聴（けいちょう）", "批判（ひはん）", "指示（しじ）"], "answer": 0, "tip_tl": "Ito ay tungkol sa 'keicho' o active listening — kung paano makinig at tumugon nang may empatiya sa resident. Ang active listening ay ang tunay na pakikinig bago mag-alok ng solusyon. Ang empatiya ay ang pagsubok unawain ang nararamdaman ng kabilang tao. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-025", "part": "A", "category": "コミュニケーション技術", "level": "easy", "question": "言葉（ことば）を使わないコミュニケーション（非言語コミュニケーション）に当てはまるものはどれですか。", "options": ["笑顔（えがお）や身振り（みぶり）", "挨拶の言葉（あいさつのことば）", "電話での会話（でんわでのかいわ）"], "answer": 0, "tip_tl": "Dito tinuturo kung paano magpahayag ng suporta sa pamamagitan ng salita, ekspresyon, at galaw ng katawan. Mahalaga ang malinaw at magalang na komunikasyon sa bawat interaksyon. Ang di-berbal na senyales — ekspresyon ng mukha, galaw — ay kadalasang mas nagsasabi kaysa salita. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-026", "part": "A", "category": "コミュニケーション技術", "level": "easy", "question": "耳（みみ）が聞こえにくい利用者（難聴）と話すときの対応（たいおう）として、最も適切なものはどれですか。", "options": ["小さな声（こえ）で耳元（みみもと）でささやく", "相手の目を見て、口（くち）をはっきりと動かして話す", "早口（はやくち）でたくさん話す"], "answer": 1, "tip_tl": "Mahalaga rito ang paraan ng pakikipag-usap sa resident, lalo na sa pagpapakita ng tunay na pagmamalasakit at pang-unawa. Sa pakikipag-usap sa taong may hearing loss, magsalita nang malinaw at harapin sila. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-027", "part": "A", "category": "コミュニケーション技術", "level": "easy", "question": "認知症（にんちしょう）の利用者が「財布（さいふ）を盗まれた」と言ったときの最初の対応として、最も適切なものはどれですか。", "options": ["何も言わずに無視（むし）する", "「心配（しんぱい）ですね、一緒に探しましょう」と共感（きょうかん）する", "「そんなはずはありません」と否定（ひてい）する"], "answer": 1, "tip_tl": "Ito ay tungkol sa 'keicho' o active listening — kung paano makinig at tumugon nang may empatiya sa resident. Ang empatiya ay ang pagsubok unawain ang nararamdaman ng kabilang tao. Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-028", "part": "A", "category": "コミュニケーション技術", "level": "easy", "question": "自分の意見（いけん）を一方的（いっぽうてき）に伝えるのではなく、相手が話しやすいように質問することを何といいますか。", "options": ["報告技術（ほうこくぎじゅつ）", "質問技術（しつもんぎじゅつ）", "説得技術（せっとくぎじゅつ）"], "answer": 1, "tip_tl": "Dito tinuturo kung paano magpahayag ng suporta sa pamamagitan ng salita, ekspresyon, at galaw ng katawan. Mahalaga ang malinaw at magalang na komunikasyon sa bawat interaksyon. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-029", "part": "A", "category": "コミュニケーション技術", "level": "easy", "question": "相手の言った言葉をそのまま繰り返して、聴いていることを示すコミュニケーションの方法を何といいますか。", "options": ["換言（かんげん）", "要約（ようやく）", "オウム返し（おうむがえし・反復）"], "answer": 2, "tip_tl": "Mahalaga rito ang paraan ng pakikipag-usap sa resident, lalo na sa pagpapakita ng tunay na pagmamalasakit at pang-unawa. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-030", "part": "A", "category": "コミュニケーション技術", "level": "easy", "question": "視覚障害（しかくしょうがい・目が不自由）のある利用者に部屋の様子を説明するときの基準として、時計の針（はり）の位置（いち）を使う方法を何といいますか。", "options": ["オープンクエスチョン（おーぷんくえすちょん）", "サイン言語（さいんげんご）", "クロックポジション（くろっくぽじしょん）"], "answer": 2, "tip_tl": "Ito ay tungkol sa 'keicho' o active listening — kung paano makinig at tumugon nang may empatiya sa resident. Sa paggabay sa taong may visual impairment, gamitin ang malinaw na verbal cues at 'clock position'. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-031", "part": "A", "category": "生活支援技術", "level": "easy", "question": "車椅子（くるまいす）で段差（だんさ）を上がるとき、キャスター（前輪・ぜんりん）を上げるために介護職（かいごしょく）が足で踏む部分（ぶぶん）を何といいますか。", "options": ["フットサポート（ふっとさぽーと）", "アームサポート（あーむさぽーと）", "ティッピングレバー（てぃっぴんぐればー）"], "answer": 2, "tip_tl": "Ito ay tungkol sa aktwal na kilos-kamay sa pag-aalaga — ligtas, tama, at magalang sa bawat hakbang. Laging suriin ang brake at posisyon ng wheelchair bago at pagkatapos gamitin. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-032", "part": "A", "category": "生活支援技術", "level": "easy", "question": "ベッドの上の利用者を横向き（よこむき・側臥位）にするとき、介護職（かいごしょく）の体を痛めないための正しい姿勢（しせい）はどれですか。", "options": ["ベッドの高さ（たかさ）を一番低くする", "足を閉じて膝（ひざ）をまっすぐ伸ばす", "足を肩幅（かたはば）に広げて重心（じゅうしん）を低くする"], "answer": 2, "tip_tl": "Ito ay tungkol sa praktikal na kasanayan sa pag-aalaga sa araw-araw na pangangailangan ng resident — mula sa paglilinis hanggang sa paglipat (transfer). Gamitin ang tamang body mechanics para maiwasan ang sakit ng likod habang tumutulong. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-033", "part": "A", "category": "生活支援技術", "level": "easy", "question": "視覚障害（しかくしょうがい）のある人と一緒に歩く（歩行介助・ほこうかいじょ）とき、介護職（かいごしょく）の正しい立ち位置（いち）はどこですか。", "options": ["利用者の斜め後ろ（ななめうしろ）", "利用者の半歩前（はんぽまえ）", "利用者の真後ろ（まうしろ）"], "answer": 1, "tip_tl": "Dito, ang diin ay sa tamang paraan ng pagtulong sa resident habang pinapanatili ang kanilang natitirang kakayahan (remaining ability). Sa paggabay sa taong may visual impairment, gamitin ang malinaw na verbal cues at 'clock position'. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-034", "part": "A", "category": "生活支援技術", "level": "easy", "question": "杖（つえ）を使って歩く利用者（片麻痺）の歩行介助（ほこうかいじょ）で、介護職（かいごしょく）が立つ位置として最も適切なのはどこですか。", "options": ["利用者の健側（けんそく）の斜め前", "利用者の麻痺側（まひがわ）の斜め後ろ", "利用者の正面（しょうめん）"], "answer": 1, "tip_tl": "Ito ay tungkol sa aktwal na kilos-kamay sa pag-aalaga — ligtas, tama, at magalang sa bawat hakbang. Kapag may hemiplegia (paralisis sa isang bahagi), simulan ang paggalaw mula sa malakas na bahagi ng katawan. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
