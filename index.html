{"id": "care-038", "part": "A", "category": "生活支援技術", "level": "easy", "question": "入浴介助（にゅうよくかいじょ）で、お風呂（ふろ）の湯船（ゆぶね）に最初（さいしょ）に浸かる（つかる）時間はどれくらいが目安（めやす）ですか。", "options": ["3〜5分程度（ふんていど）", "1時間（じかん）", "30分程度（ふんていど）"], "answer": 0, "tip_tl": "Ito ay tungkol sa praktikal na kasanayan sa pag-aalaga sa araw-araw na pangangailangan ng resident — mula sa paglilinis hanggang sa paglipat (transfer). Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Sa pagpapaligo, laging suriin muna ang temperatura ng tubig bago hipuin ang resident. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-039", "part": "A", "category": "介護課程", "level": "easy", "question": "介護課程（かいごかてい）の4つのステップ（展開・てんかい）の正しい順番（じゅんばん）はどれですか。", "options": ["実施 → 評価 → アセスメント → 計画立案", "アセスメント → 計画立案 → 実施 → 評価", "計画立案 → 実施 → アセスメント → 評価"], "answer": 1, "tip_tl": "Dito tinuturo kung paano suriin, magplano, at i-evaluate ang pangangalaga para sa bawat indibidwal na resident. Ang assessment ay ang unang hakbang — kalapin ang tamang impormasyon bago magplano. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-040", "part": "A", "category": "介護課程", "level": "easy", "question": "利用者がどのような生活（せいかつ）を望んでいるか（ニーズ）を調べるための最初の情報収集（じょうほうしゅうしゅう）を何といいますか。", "options": ["アセスメント（あせすめんと・課題分析）", "評価（ひょうか）", "実施（じっし）"], "answer": 0, "tip_tl": "Ang paksang ito ay tungkol sa buong siklo ng care planning — mula assessment hanggang review. Ang assessment ay ang unang hakbang — kalapin ang tamang impormasyon bago magplano. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-041", "part": "A", "category": "介護課程", "level": "easy", "question": "アセスメント（あせすめんと）で集める「客観的情報（きゃっかんてきじょうほう）」にあてはまるものはどれですか。", "options": ["家族が話した「昔は優しかった」という思い出", "介護職が測定（そくてい）した「体温が38度ある」という事実", "利用者が話した「お腹が痛い」という言葉"], "answer": 1, "tip_tl": "Ito ay bahagi ng 'care process' — ang sistematikong paraan ng pagpaplano ng pangangalaga base sa aktwal na pangangailangan ng resident. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-042", "part": "A", "category": "介護課程", "level": "easy", "question": "ケアプラン（けあぷらん・介護計画）に書かれる、これから達成（たっせい）したい目標（もくひょう）を何といいますか。", "options": ["生活課題（せいかつかだい）", "実施内容（じっしないよう）", "介護目標（かいごもくひょう・生活目標）"], "answer": 2, "tip_tl": "Dito tinuturo kung paano suriin, magplano, at i-evaluate ang pangangalaga para sa bawat indibidwal na resident. Ang care plan ay dapat base sa aktwal na pangangailangan ng resident, hindi sa kaginhawaan ng staff. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-043", "part": "A", "category": "介護課程", "level": "easy", "question": "介護計画（かいごけいかく）に基づいて、実際にサービス（介助）を行うステップを何といいますか。", "options": ["実施（じっし）", "計画（けいかく）", "アセスメント"], "answer": 0, "tip_tl": "Ang paksang ito ay tungkol sa buong siklo ng care planning — mula assessment hanggang review. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-044", "part": "A", "category": "介護課程", "level": "easy", "question": "行った介護サービスが、目標（もくひょう）に対して効果（こうか）があったかどうかを確認するステップを何といいますか。", "options": ["評価（ひょうか）", "実施（じっし）", "観察（かんさつ）"], "answer": 0, "tip_tl": "Ito ay bahagi ng 'care process' — ang sistematikong paraan ng pagpaplano ng pangangalaga base sa aktwal na pangangailangan ng resident. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-045", "part": "A", "category": "介護課程", "level": "easy", "question": "介護記録（かいごきろく）を書くときの注意点（ちゅういてん）として、最も適切なものはどれですか。", "options": ["事実（じじつ）を正確（せいかく）に、わかりやすく書く", "鉛筆（えんぴつ）で書いていつでも消せるようにする", "時間が経ってからまとめて思い出しながら書く"], "answer": 0, "tip_tl": "Dito tinuturo kung paano suriin, magplano, at i-evaluate ang pangangalaga para sa bawat indibidwal na resident. Ang record o dokumentasyon ay dapat batay sa aktwal na katotohanan, hindi opinyon. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-046", "part": "B", "category": "発達と老化の理解", "level": "easy", "question": "高齢者（こうれいしゃ）の睡眠（すいみん・ねむること）の特徴（とくちょう）として、正しいものはどれですか。", "options": ["深い睡眠（すいみん）の時間が増える", "夜（よる）何度も目が覚める", "若いときよりも長く眠れる"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa physical at mental na pagbabago na dulot ng edad. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-047", "part": "B", "category": "発達と老化の理解", "level": "easy", "question": "骨粗鬆症（こつそしょうしょう・骨がもろくなる病気）の予防（よぼう）に大切な栄養素（えいようそ）はどれですか。", "options": ["カルシウム（かるしうむ）", "脂質（ししつ）", "ビタミンC（びたみんC）"], "answer": 0, "tip_tl": "Ito ay tungkol sa normal na pagbabago sa katawan at isip habang tumatanda ang isang tao. Ang osteoporosis ay nagpapadali sa pagkabali ng buto kaya't dapat maingat sa paggalaw ng matanda. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-048", "part": "B", "category": "発達と老化の理解", "level": "easy", "question": "高齢（こうれい）になると低下（ていか・低くなる）しやすい、体の水分（すいぶん）の割合（わりあい）について正しいものはどれですか。", "options": ["高齢になると体の水分の割合が増える", "高齢になると体の水分の割合が減る", "子どもの方が水分が少ない"], "answer": 1, "tip_tl": "Dito ipinapaliwanag kung anong mga pagbabago sa aging process ang dapat asahan at unawain ng care worker. Ang matatanda ay mas madaling ma-dehydrate kaya dapat regular na alalahanin na uminom ng tubig. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-049", "part": "B", "category": "発達と老化の理解", "level": "easy", "question": "高齢者（こうれいしゃ）が転倒（てんとう・ころぶこと）しやすくなる原因（げんいん）として、最も適切なものはどれですか。", "options": ["骨（ほね）が太くなること", "バランス感覚（かんかく）の向上", "筋力（きんりょく・筋肉の力）の低下"], "answer": 2, "tip_tl": "Ang paksang ito ay tumatalakay sa physical at mental na pagbabago na dulot ng edad. Ang pag-iwas sa pagkahulog (fall prevention) ay isa sa pangunahing priyoridad sa ligtas na kapaligiran. Ang paghina ng kalamnan (sarcopenia) sa katandaan ay nagpapataas ng panganib ng pagkahulog. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-050", "part": "B", "category": "発達と老化の理解", "level": "easy", "question": "人間の発達（はたつ）において、生まれてから最も急激（きゅうげき）に脳（のう）や神経（しんけい）が発達する時期はどれですか。", "options": ["老年期（ろうねんき）", "青年期（せいねんき）", "乳幼児期（にゅうようじき）"], "answer": 2, "tip_tl": "Ito ay tungkol sa normal na pagbabago sa katawan at isip habang tumatanda ang isang tao. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-051", "part": "B", "category": "発達と老化の理解", "level": "easy", "question": "高齢者（こうれいしゃ）がなりやすい、脱水症（だっすいしょう・体の水分が足りなくなること）のサインはどれですか。", "options": ["皮膚（ひふ）が汗でベタベタする", "口（くち）の中が激しく渇く", "尿（にょう・おしっこ）の量が増える"], "answer": 1, "tip_tl": "Dito ipinapaliwanag kung anong mga pagbabago sa aging process ang dapat asahan at unawain ng care worker. Ang matatanda ay mas madaling ma-dehydrate kaya dapat regular na alalahanin na uminom ng tubig. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-052", "part": "B", "category": "発達と老化の理解", "level": "easy", "question": "高齢（こうれい）に伴う（ともなう）耳（みみ）の聞こえの変化（老年性難聴）の特徴はどれですか。", "options": ["低い音（こえ）が聞こえにくくなる", "高い音（こえ）が聞こえにくくなる", "右の耳だけが聞こえなくなる"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa physical at mental na pagbabago na dulot ng edad. Sa pakikipag-usap sa taong may hearing loss, magsalita nang malinaw at harapin sila. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-053", "part": "B", "category": "認知症の理解", "level": "easy", "question": "認知症（にんちしょう）の三大認知症に含まれないものはどれですか。", "options": ["インフルエンザ（いんふるえんざ）", "レビー小体型認知症（れびーしょうたいがたにんちしょう）", "アルツハイマー型認知症（あるつはいまーがたにんちしょう）"], "answer": 0, "tip_tl": "Ito ay tungkol sa dementia — kung paano ito nagbabago sa isip at asal ng resident, at kung paano dapat tumugon ang care worker. Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-054", "part": "B", "category": "認知症の理解", "level": "easy", "question": "アルツハイマー型認知症（あるつはいまーがたにんちしょう）の初期（しょき）に最も多く見られる症状（しょうじょう）はどれですか。", "options": ["意識（いしき）がなくなること", "言葉（ことば）が出なくなること", "物忘れ（ものわすれ・記憶障害）"], "answer": 2, "tip_tl": "Dito, mahalagang maunawaan ang sintomas ng dementia at ang tamang paraan ng pakikitungo dito nang may pasensya at empatiya. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-055", "part": "B", "category": "認知症の理解", "level": "easy", "question": "認知症（にんちしょう）の症状（しょうじょう）のうち、脳の破壊によって直接起こる「中核症状（ちゅうかくしょうじょう）」はどれですか。", "options": ["徘徊（はいかい・歩き回ること）", "記憶障害（きおくしょうがい・忘れること）", "抑うつ（よくうつ・落ち込むこと）"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa iba't ibang uri ng dementia at ang epekto nito sa pang-araw-araw na buhay ng resident. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-056", "part": "B", "category": "認知症の理解", "level": "easy", "question": "レビー小体型認知症（れびーしょうたいがたにんちしょう）に特徴的（とくちょうてき）な症状はどれですか。", "options": ["実際（じっさい）にはいない人や虫が見える（幻視）", "手足の麻痺が左右交互に起こる", "計算（けいさん）だけができなくなる"], "answer": 0, "tip_tl": "Ito ay tungkol sa dementia — kung paano ito nagbabago sa isip at asal ng resident, at kung paano dapat tumugon ang care worker. Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-057", "part": "B", "category": "認知症の理解", "level": "easy", "question": "認知症（にんちしょう）の人が、夕方（ゆうがた）になると不安（ふあん）になって落ち着かなくなる現象を何といいますか。", "options": ["徘徊（はいかい）", "幻覚（げんかく）", "夕暮れ症候群（ゆうぐれしょうこうぐん・サンダウニング）"], "answer": 2, "tip_tl": "Dito, mahalagang maunawaan ang sintomas ng dementia at ang tamang paraan ng pakikitungo dito nang may pasensya at empatiya. Ang sundowning ay ang pagiging balisa ng resident na may dementia sa gabi o dapithapon. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-058", "part": "B", "category": "認知症の理解", "level": "easy", "question": "脳血管性認知症（のうけっかんせいにんちしょう）の原因（げんいん）となる主な病気はどれですか。", "options": ["肺炎（はいえん）", "脳梗塞（のうこうそく）や脳出血（のうしゅっけつ）", "アトピー性皮膚炎（あとぴーせいひふえん）"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa iba't ibang uri ng dementia at ang epekto nito sa pang-araw-araw na buhay ng resident. Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-059", "part": "B", "category": "認知症の理解", "level": "easy", "question": "認知症（にんちしょう）の利用者への関わり方（ケア）として、最も適切なものはどれですか。", "options": ["危険（きけん）なので一日中ベッドに縛っておく", "子どもに対するような言葉遣いで話しかける", "本人のプライド（自尊心）を傷つけないよう否定せず話を聴く"], "answer": 2, "tip_tl": "Ito ay tungkol sa dementia — kung paano ito nagbabago sa isip at asal ng resident, at kung paano dapat tumugon ang care worker. Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Mahalaga ang malinaw at magalang na komunikasyon sa bawat interaksyon. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-060", "part": "B", "category": "障害の理解", "level": "easy", "question": "障害者基本法（しょうがいしゃきほんほう）における「障害者」の定義（ていぎ）に含まれないものはどれですか。", "options": ["精神障害（せいしんしょうがい）", "身体障害（しんたいしょうがい）", "一時的（いちじてき）な風邪（かぜ）"], "answer": 2, "tip_tl": "Dito, ang diin ay unawain ang pangangailangan ng bawat tao ayon sa kanyang partikular na kapansanan — pisikal, sensory, o developmental. Ang pagtingin sa kapansanan ay dapat nakabatay sa kakayahan ng tao, hindi sa limitasyon lamang. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-061", "part": "B", "category": "障害の理解", "level": "easy", "question": "障害者（しょうがいしゃ）の自立（じりつ）や地域（ちいき）での生活（せいかつ）を支（ささ）えるための基本（きほん）となる法律（ほうりつ）はどれですか。", "options": ["労働基準法（ろうどうきじゅんほう）", "障害者総合支援法（しょうがいしゃそうごうしえんほう）", "少年法（しょうねんほう）"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa disability support — hindi puro limitasyon, kundi pagpapalawak ng kakayahan ng tao. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-062", "part": "B", "category": "障害の理解", "level": "easy", "question": "法律（ほうりつ）で決（き）められている、障害（しょうがい）がある人が仕事（しごと）をする権利（けんり）や働く割合（わりあい）を何といいますか。", "options": ["定年退職（ていねんたいしょく）", "失業率（しつぎょうりつ）", "法定雇用率（ほうていこようりつ）"], "answer": 2, "tip_tl": "Ito ay tungkol sa iba't ibang uri ng kapansanan at kung paano suportahan ang kalayaan ng taong may kapansanan. May mga batas na sumusuporta sa employment ng mga taong may kapansanan sa Japan. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-063", "part": "B", "category": "障害の理解", "level": "easy", "question": "障害（しょうがい）について、体（からだ）の仕組み（しくみ）だけでなく、周（まわ）りの環境（かんきょう・バリア）も関係（かんけい）しているという考（かんがえ）え方を何といいますか。", "options": ["障害（しょうがい）の医学モデル（いがくもでる）", "自己管理（じこかんり）", "障害（しょうがい）の社会モデル（しゃかいもでる）"], "answer": 2, "tip_tl": "Dito, ang diin ay unawain ang pangangailangan ng bawat tao ayon sa kanyang partikular na kapansanan — pisikal, sensory, o developmental. Ang pagtingin sa kapansanan ay dapat nakabatay sa kakayahan ng tao, hindi sa limitasyon lamang. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-064", "part": "B", "category": "障害の理解", "level": "easy", "question": "車椅子（くるまいす）を使（つか）う人が、階段（かいだん）ではなくスロープ（すろーぷ）を使って建物（たてもの）に入れるように、物（もの）のバリアをなくすことを何といいますか。", "options": ["バリアフリー（ばりあふりー）", "インフォームドコンセント（いんふぉーむどこんせんと）", "ノーマライゼーション（のーまらいぜーしょん）"], "answer": 0, "tip_tl": "Ang paksang ito ay tumatalakay sa disability support — hindi puro limitasyon, kundi pagpapalawak ng kakayahan ng tao. Ang barrier-free na kapaligiran ay tumutulong sa taong may kapansanan na kumilos nang mag-isa. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-065", "part": "B", "category": "障害の理解", "level": "easy", "question": "知的障害（ちてきしょうがい）がある人の特徴（とくちょう）として、最も適切なものはどれですか。", "options": ["目が不自由（ふじゆう）になること", "子どものときから、言葉（ことば）や計算（けいさん）の理解（りかい）がゆっくりであること", "耳（みみ）が全く聞こえなくなること"], "answer": 1, "tip_tl": "Ito ay tungkol sa iba't ibang uri ng kapansanan at kung paano suportahan ang kalayaan ng taong may kapansanan. Ang pagtingin sa kapansanan ay dapat nakabatay sa kakayahan ng tao, hindi sa limitasyon lamang. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-066", "part": "B", "category": "障害の理解", "level": "easy", "question": "精神障害（せいしんしょうがい）の一種（いっしゅ）で、気分（きぶん）が激（はげ）しく沈（しず）んだり、何もしたくなくなったりする病気（びょうき）を何といいますか。", "options": ["胃潰瘍（いかいよう）", "高血圧（こうけつあつ）", "うつ病（うつびょう）"], "answer": 2, "tip_tl": "Dito, ang diin ay unawain ang pangangailangan ng bawat tao ayon sa kanyang partikular na kapansanan — pisikal, sensory, o developmental. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-067", "part": "B", "category": "こころとからだのしくみ", "level": "easy", "question": "人間の体（からだ）において、体を動（うご）かすための骨（ほね）や筋肉（きんにく）の仕組み（しくみ）を何といいますか。", "options": ["消化器官（しょうかきかん）", "運動器官（うんどうきかん・運動器系）", "循環器官（じゅんかんきかん）"], "answer": 1, "tip_tl": "Ang paksang ito ay batayan ng medikal na kaalaman sa likod ng bawat desisyon sa pangangalaga. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-068", "part": "B", "category": "こころとからだのしくみ", "level": "easy", "question": "食べ物を口（くち）から入れて、胃（い）や腸（ちょう）で栄養（えいよう）を吸収（きゅうしゅう）する仕組み（しくみ）を何といいますか。", "options": ["循環（じゅんかん）", "消化（しょうか・消化器系）", "呼吸（こきゅう）"], "answer": 1, "tip_tl": "Ito ay tungkol sa siyentipikong pag-unawa sa katawan at isip ng tao — mahalaga ito para malaman kung bakit nangyayari ang isang kondisyon. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-069", "part": "B", "category": "こころとからだのしくみ", "level": "easy", "question": "肺（はい）を使って空気（くうき）を吸（す）い、酸素（さんそ）を取り入れて二酸化炭素（にさんかたんそ）を出す仕組み（しくみ）を何といいますか。", "options": ["循環（じゅんかん）", "呼吸（こきゅう・呼吸器系）", "代謝（たいしゃ）"], "answer": 1, "tip_tl": "Dito ipinapaliwanag ang mekanismo ng katawan (anatomy, physiology) na dapat maintindihan ng bawat care worker. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-070", "part": "B", "category": "こころとからだのしくみ", "level": "easy", "question": "心臓（しんぞう）がポンプ（ぽんぷ）のように動（うご）いて、体全体（からだぜんたい）に血液（けつえき）を送（おく）る仕組み（しくみ）を何といいますか。", "options": ["吸収（きゅうしゅう）", "呼吸（こきゅう）", "循環（じゅんかん・循環器系）"], "answer": 2, "tip_tl": "Ang paksang ito ay batayan ng medikal na kaalaman sa likod ng bawat desisyon sa pangangalaga. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-071", "part": "B", "category": "こころとからだのしくみ", "level": "easy", "question": "人間の体（からだ）の熱（ねつ）を示す「体温（たいおん）」の一般的な正常値（せいじょうち・平熱）の範囲（はんい）はどれですか。", "options": ["34度（ど）以下（いか）", "38度（ど）以上（いじょう）", "36度（ど）〜37度（ど）くらい"], "answer": 2, "tip_tl": "Ito ay tungkol sa siyentipikong pag-unawa sa katawan at isip ng tao — mahalaga ito para malaman kung bakit nangyayari ang isang kondisyon. Ang vital signs (temperatura, pulso, presyon) ay unang senyales ng pagbabago sa kalusugan. Ang katawan ng matatanda ay mas mahirap magregulate ng temperatura, kaya dapat maingat. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-072", "part": "B", "category": "こころとからだのしくみ", "level": "easy", "question": "心臓（しんぞう）が1分間（ふんかん）にドクドクと動（うご）く回数（かいすう）を何といいますか。", "options": ["呼吸数（こきゅうすう）", "体温（たいおん）", "脈拍（みゃくはく・心拍数）"], "answer": 2, "tip_tl": "Dito ipinapaliwanag ang mekanismo ng katawan (anatomy, physiology) na dapat maintindihan ng bawat care worker. Ang vital signs (temperatura, pulso, presyon) ay unang senyales ng pagbabago sa kalusugan. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-073", "part": "B", "category": "こころとからだのしくみ", "level": "easy", "question": "血液（けつえき）が血管（けっかん）の壁（かべ）を押（お）す力のことを何といいますか。", "options": ["体脂肪（たいしぼう）", "脈拍（みゃくはく）", "血圧（けつあつ）"], "answer": 2, "tip_tl": "Ang paksang ito ay batayan ng medikal na kaalaman sa likod ng bawat desisyon sa pangangalaga. Ang pagsukat ng blood pressure ay bahagi ng regular na pagsubaybay sa kalusugan ng resident. Ang vital signs (temperatura, pulso, presyon) ay unang senyales ng pagbabago sa kalusugan. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-074", "part": "B", "category": "医療的ケア", "level": "easy", "question": "介護職（かいごしょく）が法律（ほうりつ）に基づいて研修（けんしゅう）を受（う）けた後（あと）、医師（いし）の指示（しじ）で行（おこな）うことができる医療的（いりょうてき）な行為（こうい）はどれですか。", "options": ["たんの吸引（きゅういん）と経管栄養（けいかんえいよう）", "手術（しゅじゅつ）", "注射（ちゅうしゃ）"], "answer": 0, "tip_tl": "Ito ay tungkol sa medikal na pangangalagang maaaring gawin ng care worker, kasama ang mahigpit na patakaran sa kaligtasan. Ang pagsuction ng plema ay dapat gawin nang mahinahon, walang labis na presyon. Sa tube feeding, laging suriin ang posisyon ng tubo bago magbigay ng gatas o pagkain. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-075", "part": "B", "category": "医療的ケア", "level": "easy", "question": "口（くち）から食べ物を食べられない人のために、お腹（なか）に小さな穴（あな）を開けてチューブで栄養（えいよう）を送る方法を何といいますか。", "options": ["人工呼吸器（じんこうこきゅうき）", "胃ろう（いろう・経管栄養）", "車椅子（くるまいす）"], "answer": 1, "tip_tl": "Dito, mahalaga ang tamang pamamaraan at kaligtasan dahil direktang nakaka-apekto ito sa buhay ng resident. Sa tube feeding, laging suriin ang posisyon ng tubo bago magbigay ng gatas o pagkain. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-076", "part": "B", "category": "医療的ケア", "level": "easy", "question": "「たんの吸引（きゅういん）」を行（おこな）うとき、1回（かい）の吸引（きゅういん）時間（じかん）の目安（めやす）として正しいものはどれですか。", "options": ["10分（ふん）", "10秒（びょう）〜15秒（びょう）程度（てんど）", "30分（ふん）"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa mga limitasyon at responsibilidad ng care worker sa medikal na gawain. Ang pagsuction ng plema ay dapat gawin nang mahinahon, walang labis na presyon. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-077", "part": "B", "category": "医療的ケア", "level": "easy", "question": "胃（い）ろうの管理（かんり）において、栄養剤（えいようざい）を注入（ちゅうにゅう）する前の確認（かくにん）として最も重要なものはどれですか。", "options": ["利用者が起きているか", "チューブが正しい位置（いち）に固定（こてい）されているか", "外（そと）が晴（は）れているか"], "answer": 1, "tip_tl": "Ito ay tungkol sa medikal na pangangalagang maaaring gawin ng care worker, kasama ang mahigpit na patakaran sa kaligtasan. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-078", "part": "B", "category": "医療的ケア", "level": "easy", "question": "医療的（いりょうてき）ケアを実施（じっし）する際（さい）、感染症（かんせんしょう）を防ぐ（ふせぐ）ために最初（さいしょ）に行（おこな）うべき行動はどれですか。", "options": ["丁寧（ていねい）な手洗い（てあらい）", "利用者の入浴（にゅうよく）", "部屋の換気（かんき）"], "answer": 0, "tip_tl": "Dito, mahalaga ang tamang pamamaraan at kaligtasan dahil direktang nakaka-apekto ito sa buhay ng resident. Ang infection control (paghuhugas ng kamay, disinfection) ay pangunahing depensa laban sa sakit. Ang paghuhugas ng kamay ay simple pero pinakamabisang paraan para maiwasan ang impeksyon. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-079", "part": "B", "category": "医療的ケア", "level": "easy", "question": "経管栄養（けいかんえいよう）の栄養剤（えいようざい）を注入（ちゅうにゅう）するときの利用者の姿勢（しせい）として、最も適切なものはどれですか。", "options": ["頭（あたま）を低（ひく）くした姿勢", "上半身（じょうはんしん）を起こした姿勢（半座位・ファウラー位）", "うつ伏せ（うつぶせ）の姿勢"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa mga limitasyon at responsibilidad ng care worker sa medikal na gawain. Sa tube feeding, laging suriin ang posisyon ng tubo bago magbigay ng gatas o pagkain. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-080", "part": "B", "category": "医療的ケア", "level": "easy", "question": "医療的（いりょうてき）ケアの実施（じっし）中に、利用者の顔色（かおいろ）が悪（わる）くなったり、苦（くる）しそうにしたりしたときの対応として、正しいものはどれですか。", "options": ["少し様子（ようす）を見てから考える", "利用者に「大丈夫ですか」と何度も聞くだけにする", "すぐに中止（ちゅうし）して、医師（いし）や看護師（かんごし）に報告（ほうこく）する"], "answer": 2, "tip_tl": "Ito ay tungkol sa medikal na pangangalagang maaaring gawin ng care worker, kasama ang mahigpit na patakaran sa kaligtasan. Ang team work sa pagitan ng iba't ibang propesyonal ay mahalaga para sa kabuuang kalidad ng pangangalaga. Sa emergency na sitwasyon, kailangan ng mabilis pero mahinahong pagkilos. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-081", "part": "C", "category": "総合問題", "level": "easy", "question": "事例（じれい）を読んで、介護（かいご）の方向性（ほうこうせい）を考える問題を何といいますか。", "options": ["一問一答（いちもんいっとう）", "総合問題（そうごうもんだい）", "実技試験（じつぎしけん）"], "answer": 1, "tip_tl": "Dito, kailangan mong isipin ang buong larawan ng buhay ng resident, hindi lamang isang bahagi ng problema. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-082", "part": "C", "category": "総合問題", "level": "easy", "question": "介護の現場（げんば）で、利用者の尊厳（そんげん）を守り、自立（じりつ）を支援（しえん）するために最も大切なアプローチはどれですか。", "options": ["家族（かぞく）の命令（めいれい）に従うこと", "個別ケア（こべつけあ・一人ひとりに合わせる）", "施設の都合（つごう）の優先（ゆうせん）"], "answer": 1, "tip_tl": "Ang tanong na ito ay sumusubok kung paano mo pagsasama-samahin ang iyong kaalaman sa aktwal na sitwasyon. Ang layunin ay laging suportahan ang kalayaan (independence) ng resident, hindi gawin lahat para sa kanya. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-083", "part": "C", "category": "総合問題", "level": "easy", "question": "車椅子（くるまいす）での移動（いどう）の際、砂利道（じゃりみち）や凸凹（でこぼこ）した道を安全（あんぜん）に進むための方法はどれですか。", "options": ["後ろ向き（うしろむき）で全力（ぜんりょく）で引っ張る", "前輪（ぜんりん）を地面（じめん）に強く押し当てて進む", "キャスター（前輪）を少し上げて、後輪（こうりん）で進む"], "answer": 2, "tip_tl": "Ito ay isang case study na pinagsasama ang iba't ibang kaalaman — dapat basahin nang mabuti ang buong sitwasyon bago sumagot. Laging suriin ang brake at posisyon ng wheelchair bago at pagkatapos gamitin. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-084", "part": "C", "category": "総合問題", "level": "easy", "question": "言葉（ことば）がうまく話せない（失語症・しつごしょう）の利用者とのコミュニケーションで、最も適切な方法はどれですか。", "options": ["介護職が代わりにすべてを決めて話さない", "聞こえないと思って大きな声で話す", "絵（え）や写真（しゃしん）、身振り（みぶり）などを使う"], "answer": 2, "tip_tl": "Dito, kailangan mong isipin ang buong larawan ng buhay ng resident, hindi lamang isang bahagi ng problema. Mahalaga ang malinaw at magalang na komunikasyon sa bawat interaksyon. Ang di-berbal na senyales — ekspresyon ng mukha, galaw — ay kadalasang mas nagsasabi kaysa salita. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-085", "part": "C", "category": "総合問題", "level": "easy", "question": "認知症（にんちしょう）の利用者が、夜間（やかん）に「家に帰る」と言って歩き回ろうとするときの対応として、最も適切なものはどれですか。", "options": ["そのまま一人で外（そと）に出す", "「夜だから出られません」と部屋（へや）に鍵（かぎ）をかける", "「ここが今の家ですよ」と優しく声をかけ、お茶（ちゃ）などを勧（すす）めて落ち着いてもらう"], "answer": 2, "tip_tl": "Ang tanong na ito ay sumusubok kung paano mo pagsasama-samahin ang iyong kaalaman sa aktwal na sitwasyon. Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Ang sundowning ay ang pagiging balisa ng resident na may dementia sa gabi o dapithapon. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-086", "part": "C", "category": "総合問題", "level": "easy", "question": "片麻痺（かたまひ・右側が麻痺）のある利用者が、衣服（いふく）を着替える（きがえる）ときの手順（てじゅん）の原則（げんそく）はどれですか。", "options": ["両方（りょうほう）同時に脱いで着る", "服（ふく）をハサミで切り離して着替える", "左側（健側）から脱（ぬ）ぎ、右側（麻痺側）から着（き）る"], "answer": 2, "tip_tl": "Ito ay isang case study na pinagsasama ang iba't ibang kaalaman — dapat basahin nang mabuti ang buong sitwasyon bago sumagot. Kapag may hemiplegia (paralisis sa isang bahagi), simulan ang paggalaw mula sa malakas na bahagi ng katawan. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-087", "part": "C", "category": "総合問題", "level": "easy", "question": "介護職（かいごしょく）が自分自身の健康（けんこう）を守り、腰痛（ようつう）を予防（よぼう）するために使う身体（からだ）の仕組みを何といいますか。", "options": ["ボディメカニクス（ぼでぃめかにくす）", "ノーマライゼーション（のーまらいぜーしょん）", "ケアプラン（けあぷらん）"], "answer": 0, "tip_tl": "Dito, kailangan mong isipin ang buong larawan ng buhay ng resident, hindi lamang isang bahagi ng problema. Gamitin ang tamang body mechanics para maiwasan ang sakit ng likod habang tumutulong. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-088", "part": "C", "category": "総合問題", "level": "easy", "question": "利用者の自宅（じたく）を訪問（ほうもん）して行う介護サービス（訪問介護・ほうもんかいご）において、介護職がやってはいけない行為はどれですか。", "options": ["利用者の買い物（かいもの）の代行（だいこう）", "利用者の洗濯（せんたく）", "家族（かぞく）の分の食事（しょくじ）を作ること"], "answer": 2, "tip_tl": "Ang tanong na ito ay sumusubok kung paano mo pagsasama-samahin ang iyong kaalaman sa aktwal na sitwasyon. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-089", "part": "A", "category": "人間の尊厳と自立", "level": "easy", "question": "利用者が自分（じぶん）らしく生きる権利（けんり）や、幸福（こうふく）を追求（ついきゅう）する権利の基本（きほん）となる、日本国憲法（にほんこくけんぽう）第13条（じょう）の考え方はどれですか。", "options": ["法（ほう）の廃止（はいし）", "義務の優先（ぎむのゆうせん）", "個人の尊重（こじんのそんちょう）"], "answer": 2, "tip_tl": "Ang tema dito ay ang paggalang sa dignidad ng resident at ang kanyang karapatang magpasya para sa sarili. Ito'y konektado sa pangunahing karapatang pantao ng bawat resident. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-090", "part": "A", "category": "社会の理解", "level": "easy", "question": "高齢者（こうれいしゃ）の権利（けんり）を守り、財産（ざいさん）の管理（かんり）や契約（けいやく）をサポートするための仕組みを何といいますか。", "options": ["成年後見制度（せいねんこうけんせいど）", "医療保険制度（いりょうほけんせいど）", "生活保護制度（せいかつほごせいど）"], "answer": 0, "tip_tl": "Kailangang maintindihan dito kung paano gumagana ang sistema ng lipunan at seguro na sumusuklob sa mga matatanda at PWD. Ang sistemang ito ay tumutulong sa matatandang nahihirapan mag-desisyon tungkol sa pera at kontrata. Ang rights protection ay ang proteksyon ng karapatan ng mahihinang miyembro ng lipunan. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-091", "part": "A", "category": "介護の基本", "level": "easy", "question": "介護職（かいごしょく）が仕事（しごと）をする上で、専門家（せんもんか）としての高い知識（ちしき）や技術（ぎじゅつ）、そして正しい倫理（りんり・マナー）を持つことを何といいますか。", "options": ["趣味（しゅみ）の延長（えんちょう）", "自己中心的（じこちゅうしんてき）", "専門職性（せんもんしょくせい・プロフェッショナリズム）"], "answer": 2, "tip_tl": "Dito nakabatay ang pundasyon ng propesyon — kung paano dapat kumilos ang isang responsableng care worker. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-092", "part": "A", "category": "コミュニケーション技術", "level": "easy", "question": "言葉（ことば）以外の方法（ほうほう）で、相手（あいて）の話（はなし）にうなずいたり、相槌（あいづち）を打ったりする態度（たいど）を何といいますか。", "options": ["受容（じゅよう・受け入れること）", "拒絶（きょぜつ）", "説得（せっとく）"], "answer": 0, "tip_tl": "Mahalaga rito ang paraan ng pakikipag-usap sa resident, lalo na sa pagpapakita ng tunay na pagmamalasakit at pang-unawa. Ang di-berbal na senyales — ekspresyon ng mukha, galaw — ay kadalasang mas nagsasabi kaysa salita. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-093", "part": "A", "category": "生活支援技術", "level": "easy", "question": "利用者がベッドから起き上がるとき、体に余計（よけい）な負担（ふたん）をかけないために利用する、ベッドの背もたれを上げる機能を何といいますか。", "options": ["マットレス（敷布団）", "リクライニング（背上げ機能・ギャッジアップ）", "サイドレール（手すり）"], "answer": 1, "tip_tl": "Dito, ang diin ay sa tamang paraan ng pagtulong sa resident habang pinapanatili ang kanilang natitirang kakayahan (remaining ability). Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-094", "part": "A", "category": "介護課程", "level": "easy", "question": "介護計画（かいごけいかく）を実行（じっし）した結果（けっか）、目標（もくひょう）が達成（たっせい）できたかどうかを定期的に確認（かくにん）し、必要（ひつよう）に応じて計画を見直す（みなおす）ステップを何といいますか。", "options": ["情報収集（じょうほうしゅうしゅう）", "アセスメント（課題分析）", "モニタリング（もにとりんぐ・評価）"], "answer": 2, "tip_tl": "Ang paksang ito ay tungkol sa buong siklo ng care planning — mula assessment hanggang review. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-095", "part": "B", "category": "発達と老化の理解", "level": "easy", "question": "高齢（こうれい）になると、のどの渇き（かわき）を感じにくくなるため、本人が気づかないうちに起こりやすい水分不足（すいぶんぶそく）の病気を何といいますか。", "options": ["脱水症（だっすいしょう）", "糖尿病（とうにょうびょう）", "骨折（こっせつ）"], "answer": 0, "tip_tl": "Ito ay tungkol sa normal na pagbabago sa katawan at isip habang tumatanda ang isang tao. Ang matatanda ay mas madaling ma-dehydrate kaya dapat regular na alalahanin na uminom ng tubig. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-096", "part": "B", "category": "認知症の理解", "level": "easy", "question": "認知症（にんちしょう）の症状（しょうじょう）の中で、本人の性格（せいかく）や周（まわ）りの環境（かんきょう）、人間関係（にんげんかんけい）などが原因（げんいん）で起こる不安（ふあん）や不眠（ふみん）、うつ状態（じょうたい）などの症状を何といいますか。", "options": ["中核症状（ちゅうかくしょうじょう）", "行動・心理症状（BPSD・周辺症状）", "初期症状（しょきしょうじょう）"], "answer": 1, "tip_tl": "Dito, mahalagang maunawaan ang sintomas ng dementia at ang tamang paraan ng pakikitungo dito nang may pasensya at empatiya. Ang BPSD (behavioral at psychological symptoms) ng dementia ay dapat unawain bago husgahan. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-097", "part": "B", "category": "障害の理解", "level": "easy", "question": "視覚障害（しかくしょうがい）のある人が、道路（どうろ）を安全（あんぜん）に歩く（あるく）ために足元（あしもと）の感覚（かんかく）で確認（かくにん）する、黄色い（きいろい）凸凹（でこぼこ）したブロックを何といいますか。", "options": ["ガードレール（がーどれーる）", "横断歩道（おうだんほどう）", "視覚障害者誘導用ブロック（点字ブロック）"], "answer": 2, "tip_tl": "Ang paksang ito ay tumatalakay sa disability support — hindi puro limitasyon, kundi pagpapalawak ng kakayahan ng tao. Sa paggabay sa taong may visual impairment, gamitin ang malinaw na verbal cues at 'clock position'. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-098", "part": "B", "category": "こころとからだのしくみ", "level": "easy", "question": "人間の睡眠（すいみん・ねむり）のサイクル（さいくる）の中で、体（からだ）は休んで（やすんで）いるが、脳（のう）が活発（かっぱつ）に動いて（うごいて）夢（ゆめ）を見ている状態を何といいますか。", "options": ["レム睡眠（れむすいみん）", "仮眠（かみん）", "深い睡眠（ふかいすいみん）"], "answer": 0, "tip_tl": "Ito ay tungkol sa siyentipikong pag-unawa sa katawan at isip ng tao — mahalaga ito para malaman kung bakit nangyayari ang isang kondisyon. Madali itong maiintindihan kapag alam mo na ang batayang konsepto."},
{"id": "care-099", "part": "B", "category": "医療的ケア", "level": "easy", "question": "たんの吸引（きゅういん）の機械（きかい）や器具（きぐ）を衛生的に保つために、使用（しよう）した後の吸引（きゅういん）チューブはどのように処理（しょり）しますか。", "options": ["ティッシュで拭くだけにする", "指定（してい）された消毒液（しょうどくえき）で洗浄（せんじょう）・保管（ほかん）する", "そのまま部屋（へや）に置いておく"], "answer": 1, "tip_tl": "Dito, mahalaga ang tamang pamamaraan at kaligtasan dahil direktang nakaka-apekto ito sa buhay ng resident. Ang tamang paglilinis at disinfection ng kagamitan ay proteksyon laban sa impeksyon. Simpleng tanong ito — sulit na tandaan ang pangunahing ideya."},
{"id": "care-100", "part": "C", "category": "総合問題", "level": "easy", "question": "介護福祉士（かいごふくしし）が法律（ほうりつ）で義務（ぎむ）づけられている、仕事（しごと）を辞めた（やめた）後でも、利用者の秘密（ひみつ）を絶対に外に漏らしてはならない義務を何といいますか。", "options": ["秘密保持義務（ひみつほじぎむ・守秘義務）", "連携の義務（れんけいのぎむ）", "信用失墜行為の禁止（しんようしっついこういのきんし）"], "answer": 0, "tip_tl": "Ang tanong na ito ay sumusubok kung paano mo pagsasama-samahin ang iyong kaalaman sa aktwal na sitwasyon. Ang confidentiality o pagiging kompidensyal ng impormasyon ay tungkulin ng bawat propesyonal. Kapag malinaw ang paksa sa isip mo, madali mong masasagot ito."},
{"id": "care-101", "part": "A", "category": "人間の尊厳と自立", "level": "medium", "question": "利用者の意思（いし）を尊重（そんちょう）した生活を支えるため、施設（しせつ）の規則（きそく）に合わせるのではなく、利用者の生活リズムに合わせる介護の考え方を何といいますか。", "options": ["ユニットケア（ゆにっとけあ）", "家族中心主義（かぞくちゅうしんしゅぎ）", "効率最優先（こうりつさいゆうせん）"], "answer": 0, "tip_tl": "Ang tema dito ay ang paggalang sa dignidad ng resident at ang kanyang karapatang magpasya para sa sarili. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-102", "part": "A", "category": "人間の尊厳と自立", "level": "medium", "question": "利用者が自分の人生（じんせい）を自分でコントロールし、社会の中で自立して生きるための自己決定（じこけってい）を支える権利（けんり）を何といいますか。", "options": ["自己決定権（じこけっていけん）", "管理権（かんりけん）", "労働権（ろうどうけん）"], "answer": 0, "tip_tl": "Dito, ang pinakamahalaga ay tratuhin ang resident bilang tao na may sariling boses at karapatan, hindi bilang isang gawain lamang. Igalang ang karapatan ng resident na magpasya para sa sarili niya. Bigyang-diin ang kalayaan (autonomy) ng resident sa sarili niyang pagpapasya. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-103", "part": "A", "category": "人間の尊厳と自立", "level": "medium", "question": "高齢者（こうれいしゃ）や障害（しょうがい）がある人が、社会の普通の構成員（こうせいいん）として共に生きる社会を作るという理念（りねん）はどれですか。", "options": ["個人主義（こじんしゅぎ）", "隔離主義（かくりしゅぎ）", "ノーマライゼーション（のーまらいぜーしょん）"], "answer": 2, "tip_tl": "Ang pangunahing prinsipyo rito ay 'jiritsu shien' — suportahan ang kalayaan at pagpapasya ng resident sa kanyang sariling buhay. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-104", "part": "A", "category": "人間の尊厳と自立", "level": "medium", "question": "利用者の人権（じんけん）を守るため、自分で意思を伝えることが難しい人に代わり、その権利（けんり）や意思（いし）を代弁（だいべん）して守る活動を何といいますか。", "options": ["コンプライアンス", "インフォームドコンセント", "アドボカシー（あどぼかしー）"], "answer": 2, "tip_tl": "Ang tema dito ay ang paggalang sa dignidad ng resident at ang kanyang karapatang magpasya para sa sarili. Ito'y konektado sa pangunahing karapatang pantao ng bawat resident. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-105", "part": "A", "category": "人間の尊厳と自立", "level": "medium", "question": "高齢者虐待防止法（こうれいしゃぎゃくたいぼうしほう）において、介護職員（かいごしょくいん）が虐待（ぎゃくたい）を発見（はっけん）した場合に義務（ぎむ）づけられている行動はどれですか。", "options": ["市町村（しちょうそん）への速やかな通報（つうほう）", "同僚（どうりょう）への相談のみ", "警察（けいさつ）への被害届の提出"], "answer": 0, "tip_tl": "Dito, ang pinakamahalaga ay tratuhin ang resident bilang tao na may sariling boses at karapatan, hindi bilang isang gawain lamang. Mahigpit na ipinagbabawal ang anumang uri ng abuso sa pag-aalaga. Ang pag-uulat sa ibang propesyonal ay dapat malinaw, maikli, at tumpak. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-106", "part": "A", "category": "人間の尊厳と自立", "level": "medium", "question": "利用者の尊厳（そんげん）を守るために、身体をベッドに縛（しば）り付けたり、部屋に閉じ込めたりする「身体拘束（しんたいこうそく）」の原則（げんそく）はどうなっていますか。", "options": ["介護職の都合（つごう）でいつでも行ってよい", "夜間（やかん）の安全（あんぜん）のためなら義務（ぎむ）である", "原則（げんそく）として禁止（きんし）されている"], "answer": 2, "tip_tl": "Ang pangunahing prinsipyo rito ay 'jiritsu shien' — suportahan ang kalayaan at pagpapasya ng resident sa kanyang sariling buhay. Ito'y konektado sa pangunahing karapatang pantao ng bawat resident. Ang physical restraint ay bawal maliban sa napaka-espesyal at emergency na sitwasyon lamang. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-107", "part": "A", "category": "人間の尊厳と自立", "level": "medium", "question": "身体拘束（しんたいこうそく）が例外（れいがい）として認められる「緊急やむを得ない場合（きんきゅうやむをえないばあい）」の3つの要件（ようけん）に含まれないものはどれですか。", "options": ["一時性（いちじせい・短い時間であること）", "経済性（けいざいせい・お金がかからないこと）", "非代替性（ひだいたいせい・他に方法がないこと）"], "answer": 1, "tip_tl": "Ang tema dito ay ang paggalang sa dignidad ng resident at ang kanyang karapatang magpasya para sa sarili. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-108", "part": "A", "category": "人間の尊厳と自立", "level": "medium", "question": "利用者のプライバシーを保護（ほご）するため、排泄（はいせつ）の介助（かいじょ）を行う際（さい）に介護職が最も注意すべき行動はどれですか。", "options": ["他のスタッフ（すたっふ）に大声で指示（しじ）を出す", "ドアやカーテンをしっかりと閉めて、他の人に見えないようにする", "利用者の衣服（いふく）を一度にすべて脱がせる"], "answer": 1, "tip_tl": "Dito, ang pinakamahalaga ay tratuhin ang resident bilang tao na may sariling boses at karapatan, hindi bilang isang gawain lamang. Ang dignidad ng resident ang dapat unahin sa bawat desisyon. Iginagalang ang privacy ng resident sa lahat ng oras. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-109", "part": "A", "category": "人間の尊厳と自立", "level": "medium", "question": "利用者がどのような最期（さいご）を迎えたいかをあらかじめ話し合い、本人の意思（いし）を尊重（そんちょう）する看取り（みとり・終末期）のケアを何といいますか。", "options": ["リハビリテーション（りはびりてーしょん）", "急性期医療（きゅうせいきいりょう）", "ターミナルケア（たーみなるけあ・終末期介護）"], "answer": 2, "tip_tl": "Ang pangunahing prinsipyo rito ay 'jiritsu shien' — suportahan ang kalayaan at pagpapasya ng resident sa kanyang sariling buhay. Ang terminal care ay tumutuon sa kaginhawaan at dignidad ng resident sa huling bahagi ng buhay. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-110", "part": "A", "category": "人間の尊厳と自立", "level": "medium", "question": "障害（しょうがい）や年齢（ねんれい）に関わらず、すべての人が差別（さべつ）されることなく、同じ地域（ちいき）で暮らす権利（けんり）を保証（ほしょう）する国際的な宣言（せんげん）はどれですか。", "options": ["世界人権宣言（せかいじんけんせんげん）", "児童権利宣言", "京都議定書"], "answer": 0, "tip_tl": "Ang tema dito ay ang paggalang sa dignidad ng resident at ang kanyang karapatang magpasya para sa sarili. Ito'y konektado sa pangunahing karapatang pantao ng bawat resident. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-111", "part": "A", "category": "人間の尊厳と自立", "level": "medium", "question": "介護（かいご）の提供（ていきょう）において、介護職が自分の価値観（かちかん）を押し付けず、利用者のこれまでの人生や価値観を認（みと）める態度を何といいますか。", "options": ["一律の対応（いちりつのたいおう）", "個別の尊重（こべつのそんちょう）", "主観の押し付け（しゅかんのおしつけ）"], "answer": 1, "tip_tl": "Dito, ang pinakamahalaga ay tratuhin ang resident bilang tao na may sariling boses at karapatan, hindi bilang isang gawain lamang. Ang empatiya ay ang pagsubok unawain ang nararamdaman ng kabilang tao. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-112", "part": "A", "category": "人間の尊厳と自立", "level": "medium", "question": "利用者のQOL（生活の質・せいかつのしつ）を高めるために、単（たん）に生きるだけでなく、その人にとっての「生きがい」や「満足感（まんぞくかん）」を大切にするケアを何といいますか。", "options": ["QOL向上（生活の質を高めるケア）", "医療優先（いりょうゆうせんのケア）", "ADL維持（身体の動きだけを保つケア）"], "answer": 0, "tip_tl": "Ang pangunahing prinsipyo rito ay 'jiritsu shien' — suportahan ang kalayaan at pagpapasya ng resident sa kanyang sariling buhay. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-113", "part": "A", "category": "人間の尊厳と自立", "level": "medium", "question": "利用者の尊厳（そんげん）を守るために、意思決定（いしけってい）が困難（こんなん）な認知症の人の小さなサイン（表情や視線）を読み取るアプローチを何といいますか。", "options": ["効率的（こうりつてき）ケア", "パーソン・センタード・ケア（ぱーそん・せんたーど・けあ）", "集団行動（しゅうだんこうどう）ケア"], "answer": 1, "tip_tl": "Ang tema dito ay ang paggalang sa dignidad ng resident at ang kanyang karapatang magpasya para sa sarili. Ang dignidad ng resident ang dapat unahin sa bawat desisyon. Ang person-centered care ay laging naka-focus sa indibidwal na pangangailangan ng resident, hindi sa gawain lamang. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-114", "part": "A", "category": "社会の理解", "level": "medium", "question": "日本の介護保険制度（かいごほけんせいど）において、40歳（さい）から64歳（さい）までの人が加入（かにゅう）する被保険者（ひほけんじゃ）の区分（くぶん）は何ですか。", "options": ["第2号被保険者（だい2ごうひほけんじゃ）", "任意加入被保険者（にんにかにゅうひほけんじゃ）", "第1号被保険者（だい1ごうひほけんじゃ）"], "answer": 0, "tip_tl": "Kailangang maintindihan dito kung paano gumagana ang sistema ng lipunan at seguro na sumusuklob sa mga matatanda at PWD. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-115", "part": "A", "category": "社会の理解", "level": "medium", "question": "介護保険制度（かいごほけんせいど）における「要介護認定（ようかいごにんてい）」の審査（しんさ）と判定（はんてい）を行う専門（せんもん）の組織（そしき）はどれですか。", "options": ["近くの保健所（ほけんじょ）", "介護認定審査会（かいごにんていしんさかい）", "厚生労働省（こうせいろうどうしょう）"], "answer": 1, "tip_tl": "Ito ay tungkol sa mga institusyon at batas na bumubuo sa social safety net ng Japan para sa mga nangangailangan ng pangangalaga. Ang assessment ay ang unang hakbang — kalapin ang tamang impormasyon bago magplano. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-116", "part": "A", "category": "社会の理解", "level": "medium", "question": "介護保険（かいごほけん）のサービスを利用（りよう）したとき、利（り）用者（しゃ）が支払（しはら）う自己負担（じこふたん）の割合（わりあい）は、個人の所得（しょとく・収入）によって最大（さいだい）何割（なんわり）まで上がりますか。", "options": ["1割（わり）", "7割（わり）", "3割（わり）"], "answer": 2, "tip_tl": "Ang paksang ito ay tungkol sa mga batas at sistema ng lipunan (long-term care insurance, welfare programs) na sumusuporta sa pangangalaga sa Japan. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-117", "part": "A", "category": "社会の理解", "level": "medium", "question": "介護保険制度（かいごほけんせいど）において、第1号被保険者（だい1ごうひほけんじゃ）の保険料（ほけんりょう）の徴収（ちょうしゅう・集め方）の原則（げんそく）はどうなっていますか。", "options": ["全額免除（ぜんがくめんじょ）", "手渡し（てわたし）", "年金（ねんきん）からの天引き（てんびき・特別徴収）"], "answer": 2, "tip_tl": "Kailangang maintindihan dito kung paano gumagana ang sistema ng lipunan at seguro na sumusuklob sa mga matatanda at PWD. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-118", "part": "A", "category": "社会の理解", "level": "medium", "question": "高齢者（こうれいしゃ）の孤立（こりつ）を防ぎ、地域（ちいき）全体で支えるために、医療・介護・予防・生活支援・住まいを一体（いったい）で提供する仕組みは何ですか。", "options": ["国民皆保険（こくみんかいほけん）", "地域包括ケアシステム（ちいきほうかつけあしすてむ）", "措置制度（そちせいど）"], "answer": 1, "tip_tl": "Ito ay tungkol sa mga institusyon at batas na bumubuo sa social safety net ng Japan para sa mga nangangailangan ng pangangalaga. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-119", "part": "A", "category": "社会の理解", "level": "medium", "question": "地域包括ケアシステムにおいて、中心（ちゅうしん）となって高齢者の相談（そうだん）を受け、ケアマネジメントを行う機関（きかん）はどれですか。", "options": ["病院（びょういん）の受付", "警察署（けいさつしょ）", "地域包括支援センター（ちいきほうかつしえんせんたー）"], "answer": 2, "tip_tl": "Ang paksang ito ay tungkol sa mga batas at sistema ng lipunan (long-term care insurance, welfare programs) na sumusuporta sa pangangalaga sa Japan. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-120", "part": "A", "category": "社会の理解", "level": "medium", "question": "介護保険のサービスで、利用者が施設（しせつ）に短期間（たんきかん）だけお泊まり（とまり）して、入浴（にゅうよく）や食事の介助を受けるサービスは何ですか。", "options": ["ケアハウス", "デイサービス（通所介護）", "ショートステイ（短期入所生活介護・しょーとすてい）"], "answer": 2, "tip_tl": "Kailangang maintindihan dito kung paano gumagana ang sistema ng lipunan at seguro na sumusuklob sa mga matatanda at PWD. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-121", "part": "A", "category": "社会の理解", "level": "medium", "question": "介護保険のサービスで、利用者が昼間（ひるま）だけ施設（しせつ）に通い（かよい）、食事や入浴、機能訓練（リハビリ）を受けるサービスは何ですか。", "options": ["訪問看護（ほうもんかんご）", "福祉用具貸与（ふくしようぐたいよ）", "デイサービス（通所介護・でいさーびす）"], "answer": 2, "tip_tl": "Ito ay tungkol sa mga institusyon at batas na bumubuo sa social safety net ng Japan para sa mga nangangailangan ng pangangalaga. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-122", "part": "A", "category": "社会の理解", "level": "medium", "question": "要介護（ようかいご）の状態（じょうたい）になることを防ぐため、または状態が悪化（あっか）しないように行う介護保険のサービスを何といいますか。", "options": ["介護予防サービス（かいごよぼうさーびす）", "終末期ケア（しゅうまつきけあ）", "救急医療（きゅうきゅういりょう）"], "answer": 0, "tip_tl": "Ang paksang ito ay tungkol sa mga batas at sistema ng lipunan (long-term care insurance, welfare programs) na sumusuporta sa pangangalaga sa Japan. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-123", "part": "A", "category": "社会の理解", "level": "medium", "question": "日本の社会保障制度（しゃかいほしょうせいど）の4つの柱（はしら）の中で、医療や年金、介護など、みんなでお金を出し合ってリスクに備（そな）える仕組みは何ですか。", "options": ["社会保険（しゃかいほけん）", "公的扶助（公生活保護）", "公衆衛生（こうしゅうえいせい）"], "answer": 0, "tip_tl": "Kailangang maintindihan dito kung paano gumagana ang sistema ng lipunan at seguro na sumusuklob sa mga matatanda at PWD. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-124", "part": "A", "category": "社会の理解", "level": "medium", "question": "生活に困（こま）っているすべての人に対して、国が最低限（さいていげん）の生活を保証（ほしょう）し、自立（じりつ）を助ける法律（ほうりつ）は何ですか。", "options": ["労働基準法（ろうどうきじゅんほう）", "生活保護法（せいかつほごほう）", "老人福祉法（ろうじんふくしほう）"], "answer": 1, "tip_tl": "Ito ay tungkol sa mga institusyon at batas na bumubuo sa social safety net ng Japan para sa mga nangangailangan ng pangangalaga. Ang public assistance ay tumitiyak ng pinakamababang antas ng pamumuhay para sa mga nangangailangan. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-125", "part": "A", "category": "社会の理解", "level": "medium", "question": "高齢者（こうれいしゃ）の福祉（ふくし）に関（かん）する基本（きほん）を定め、特別養護老人ホーム（とくべつようごろうじんほーむ）の設置（せっち）などを決めている法律は何ですか。", "options": ["老人福祉法（ろうじんふくしほう）", "社会福祉法", "児童福祉法"], "answer": 0, "tip_tl": "Ang paksang ito ay tungkol sa mga batas at sistema ng lipunan (long-term care insurance, welfare programs) na sumusuporta sa pangangalaga sa Japan. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-126", "part": "A", "category": "社会の理解", "level": "medium", "question": "成年後見制度（せいねんこうけんせいど）において、本人の判断能力（はんだんのうりょく）が不十分（ふじゅうぶん）になる前に、あらかじめ自分で後見人を選んで契約しておく制度は何ですか。", "options": ["権利擁護制度（けんりようごせいど）", "法定後見制度（ほうていこうけんせいど）", "任意後見制度（にんにこうけんせいど）"], "answer": 2, "tip_tl": "Kailangang maintindihan dito kung paano gumagana ang sistema ng lipunan at seguro na sumusuklob sa mga matatanda at PWD. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-127", "part": "A", "category": "介護の基本", "level": "medium", "question": "介護福祉士（かいごふくしし）の国家資格（こっかしかく）について定（さだ）め、その仕事（しごと）や義務（ぎむ）をルール化している法律（ほうりつ）は何ですか。", "options": ["老人福祉法", "社会福祉士及び介護福祉士法（しゃかいふくししおよびかいごふくししほう）", "労働基準法"], "answer": 1, "tip_tl": "Dito nakabatay ang pundasyon ng propesyon — kung paano dapat kumilos ang isang responsableng care worker. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-128", "part": "A", "category": "介護の基本", "level": "medium", "question": "介護福祉士及び介護福祉士法において、資格（しかく）を持っていない人が「介護福祉士」という名前（なまえ）を勝手に使ってはいけないというルールを何といいますか。", "options": ["名称独占（めいしょうどくせん）", "守秘義務（しゅひぎむ）", "業務独占（ぎょうむどくせん）"], "answer": 0, "tip_tl": "Isa itong pangunahing prinsipyo ng propesyonal na caregiving — ang batayan bago pa man matutunan ang teknikal na kasanayan. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-129", "part": "A", "category": "介護の基本", "level": "medium", "question": "介護福祉士が、仕事（しごと）の信用（しんよう）を失う（うしなう）ような悪い行動をしてはならないという法律（ほうりつ）の義務を何といいますか。", "options": ["信用失墜行為の禁止（しんようしっついこういのきんし）", "資質向上の責務（ししつこうじょうのせきむ）", "連携の義務（れんけいのぎむ）"], "answer": 0, "tip_tl": "Ito ay tungkol sa saligang tuntunin ng trabaho ng isang care worker, mula sa etika hanggang sa saklaw ng gawain. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-130", "part": "A", "category": "介護の基本", "level": "medium", "question": "介護福祉士は、資格（しかく）を取った後（あと）も、新しい知識（ちしき）や技術（ぎじゅつ）を勉強（べんきょう）し続けなければならないという法律のルールは何ですか。", "options": ["誠実義務", "資質向上の責務（ししつこうじょうのせきむ）", "守秘義務"], "answer": 1, "tip_tl": "Dito nakabatay ang pundasyon ng propesyon — kung paano dapat kumilos ang isang responsableng care worker. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-131", "part": "A", "category": "介護の基本", "level": "medium", "question": "介護職（かいごしょく）が仕事（しごと）で知り得た利用者の個人情報（こじんじょうほう）を、本人の同意（どうい）なく他人に話してはならないという職業倫理（しょくぎょうりんり）の原則を何といいますか。", "options": ["守秘義務の遵守（しゅひぎむのじゅんし）", "専門職の孤立（せんもんしょくのこりつ）", "情報の自由な共有（じょうほうのじゆうなきょうゆう）"], "answer": 0, "tip_tl": "Isa itong pangunahing prinsipyo ng propesyonal na caregiving — ang batayan bago pa man matutunan ang teknikal na kasanayan. Iginagalang ang privacy ng resident sa lahat ng oras. Ang confidentiality o pagiging kompidensyal ng impormasyon ay tungkulin ng bawat propesyonal. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-132", "part": "A", "category": "介護の基本", "level": "medium", "question": "福祉用具（ふくしようぐ）や住宅改修（じゅうたくかいしゅう）を使い、段差（だんさ）をなくして高齢者の安全な移動を支えるリハビリテーションの視点を何といいますか。", "options": ["管理的アプローチ（かんりてきあぷろーち）", "精神的アプローチ（せいしんてきあぷろーち）", "環境アプローチ（かんきょうあぷろーち）"], "answer": 2, "tip_tl": "Ito ay tungkol sa saligang tuntunin ng trabaho ng isang care worker, mula sa etika hanggang sa saklaw ng gawain. Ang rehabilitation ay naglalayong pahusayin at panatilihin ang natitirang kakayahan ng resident. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-133", "part": "A", "category": "介護の基本", "level": "medium", "question": "利用者ができる限り住み慣れた自宅（じたく）で自立（じりつ）した生活を送れるよう、本人の残された能力（可能性）を活かす介護の原則は何ですか。", "options": ["自立支援（じりつしえん・残存能力の活用）", "全面介助（ぜんめんかいじょ・すべてを代行する）", "施設入所の勧誘（しせつにゅうしょのかんゆう）"], "answer": 0, "tip_tl": "Dito nakabatay ang pundasyon ng propesyon — kung paano dapat kumilos ang isang responsableng care worker. Ang layunin ay laging suportahan ang kalayaan (independence) ng resident, hindi gawin lahat para sa kanya. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-134", "part": "A", "category": "介護の基本", "level": "medium", "question": "介護の現場（げんば）において、特定の利用者に対して介護職が個人的（こじんてき）な感情（かんじょう）に流されず、客観的な態度を保つ倫理のルールを何といいますか。", "options": ["専門的関係の確立（せんもんてきかんけいのかくりつ）", "私的感情の優先（してきかんじょうのゆうせん）", "家族同様の付き合い（かぞくどうようのつきあい）"], "answer": 0, "tip_tl": "Isa itong pangunahing prinsipyo ng propesyonal na caregiving — ang batayan bago pa man matutunan ang teknikal na kasanayan. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-135", "part": "A", "category": "介護の基本", "level": "medium", "question": "福祉（ふくし）のサービスを、行政（ぎょうせい）が決めて命令（めいれい）する昔の「措置（そち）」から、利用者が自分で選んで「契約（けいやく）」する今の仕組みに変えた大きな変化を何といいますか。", "options": ["ボランティア中心の社会（ぼらんてぃあちゅうしんのしゃかい）", "国による管理の徹底（くにによるかんりのてってい）", "利用者の権利意識の向上（契約への移行）"], "answer": 2, "tip_tl": "Ito ay tungkol sa saligang tuntunin ng trabaho ng isang care worker, mula sa etika hanggang sa saklaw ng gawain. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-136", "part": "A", "category": "介護の基本", "level": "medium", "question": "利用者の健康や生活を支えるため、介護職だけでなく、医師・看護師・ケアマネジャーなどが情報を共有（きょうゆう）してチームで動くことを何といいますか。", "options": ["単独業務（たんどくぎょうむ）", "秘密主義（ひみつしゅぎ）", "多職種連携（たしょくしゅれんけい・チームアプローチ）"], "answer": 2, "tip_tl": "Dito nakabatay ang pundasyon ng propesyon — kung paano dapat kumilos ang isang responsableng care worker. Ang team work sa pagitan ng iba't ibang propesyonal ay mahalaga para sa kabuuang kalidad ng pangangalaga. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-137", "part": "A", "category": "介護の基本", "level": "medium", "question": "介護が必要な状態になっても、自分の意志でどのような生活を送るかを選び、その人らしく尊厳（そんげん）を持って生きるという概念を何といいますか。", "options": ["自立の質の重視（じりつのしつのじゅうし）", "他者への完全な依存（たしゃへのかんぜんないぞん）", "管理下の自由（かんりかのじゆう）"], "answer": 0, "tip_tl": "Isa itong pangunahing prinsipyo ng propesyonal na caregiving — ang batayan bago pa man matutunan ang teknikal na kasanayan. Ang dignidad ng resident ang dapat unahin sa bawat desisyon. Bigyang-diin ang kalayaan (autonomy) ng resident sa sarili niyang pagpapasya. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-138", "part": "A", "category": "介護の基本", "level": "medium", "question": "世界保健機関（WHO）が発表した、人間の健康（けんこう）や障害（しょうがい）を、体だけでなく、環境や活動を含めて総合的にみる分類（ぶんるい）は何ですか。", "options": ["ISO（国際標準化機構）", "ICF（国際生活機能分類・あいしーえふ）", "WHO宣言（だぶりゅーえいちおーせんげん）"], "answer": 1, "tip_tl": "Ito ay tungkol sa saligang tuntunin ng trabaho ng isang care worker, mula sa etika hanggang sa saklaw ng gawain. Ang ICF ay isang paraan ng pagtingin sa buhay ng tao nang holistiko — hindi lamang ang sakit, kundi buong buhay. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-139", "part": "A", "category": "介護の基本", "level": "medium", "question": "ICF（国際生活機能分類）において、道路（どうろ）の段差や、周囲の人の理解（りかい）、福祉の法律など、利用者の生活に影響（えいきょう）を与える外側の要素（ようそ）を何といいますか。", "options": ["環境因子（かんきょういんし）", "活動（かつどう）", "心身機能（しんしんきのう）"], "answer": 0, "tip_tl": "Dito nakabatay ang pundasyon ng propesyon — kung paano dapat kumilos ang isang responsableng care worker. Ang environmental factors ay ang mga bagay sa paligid — daan, batas, saloobin ng ibang tao — na nakakaapekto sa buhay ng resident. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-140", "part": "A", "category": "コミュニケーション技術", "level": "medium", "question": "利用者と信頼関係（しんらいかんけい・ラポール）を築（きず）くために、相手の話を批判（ひはん）せず、その時の感情（かんじょう）に寄り添って深く聴く技術を何といいますか。", "options": ["傾聴（けいちょう・アクティブリスニング）", "要約（ようやく）", "説得（せっとく）"], "answer": 0, "tip_tl": "Mahalaga rito ang paraan ng pakikipag-usap sa resident, lalo na sa pagpapakita ng tunay na pagmamalasakit at pang-unawa. Ang active listening ay ang tunay na pakikinig bago mag-alok ng solusyon. Mahalagang magtayo ng tiwala (rapport) bago pa man magbigay ng payo. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-141", "part": "A", "category": "コミュニケーション技術", "level": "medium", "question": "コミュニケーションにおいて、言葉（ことば）の内容（ないよう）そのもの（言語コミュニケーション）に含まれないものは次のうちどれですか。", "options": ["視線や身振り（しせんやみぶり・非言語）", "手紙の文章（てがみのぶんしょう）", "点字（てんじ）"], "answer": 0, "tip_tl": "Ito ay tungkol sa 'keicho' o active listening — kung paano makinig at tumugon nang may empatiya sa resident. Mahalaga ang malinaw at magalang na komunikasyon sa bawat interaksyon. Ang di-berbal na senyales — ekspresyon ng mukha, galaw — ay kadalasang mas nagsasabi kaysa salita. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-142", "part": "A", "category": "コミュニケーション技術", "level": "medium", "question": "耳が聞こえにくい高齢者（老年性難聴・ろうねんせいなんちょう）と話すとき、介護職の対応（たいおう）として最も適切なものはどれですか。", "options": ["早口（はやくち）でたくさんの情報を一度に伝える", "耳元（みみもと）で甲高い大きな声を出す", "正面（しょうめん）に向き合い、口元（くちもと）を見せながら、少し低い声ではっきりと話す"], "answer": 2, "tip_tl": "Dito tinuturo kung paano magpahayag ng suporta sa pamamagitan ng salita, ekspresyon, at galaw ng katawan. Mahalaga ang malinaw at magalang na komunikasyon sa bawat interaksyon. Sa pakikipag-usap sa taong may hearing loss, magsalita nang malinaw at harapin sila. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-143", "part": "A", "category": "コミュニケーション技術", "level": "medium", "question": "脳の病気が原因で、言葉（ことば）を聴いて理解することや、自分が話したい言葉を言うことが難しくなる状態（じょうたい）を何といいますか。", "options": ["認知症（にんちしょう）", "難聴（なんちょう）", "失語症（しつごしょう）"], "answer": 2, "tip_tl": "Mahalaga rito ang paraan ng pakikipag-usap sa resident, lalo na sa pagpapakita ng tunay na pagmamalasakit at pang-unawa. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-144", "part": "A", "category": "コミュニケーション技術", "level": "medium", "question": "脳卒中（のうそっちゅう）などで舌（した）や口の筋肉が麻痺（まひ）し、頭（あたま）では言葉が分かっているのに、正しく発音（はつおん）できなくなる状態を何といいますか。", "options": ["聴覚障害（ちょうかくしょうがい）", "健忘症（けんぼうしょう）", "構音障害（こうおんしょうがい）"], "answer": 2, "tip_tl": "Ito ay tungkol sa 'keicho' o active listening — kung paano makinig at tumugon nang may empatiya sa resident. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-145", "part": "A", "category": "コミュニケーション技術", "level": "medium", "question": "失語症（しつごしょう）の利用者と言葉を使わずにコミュニケーションをとる際（さい）、最も有効（ゆうこう）な福祉用具（道具）はどれですか。", "options": ["絵カードやコミュニケーションボード（えかーど）", "点字器（てんじき）", "拡声器（かくせいき）"], "answer": 0, "tip_tl": "Dito tinuturo kung paano magpahayag ng suporta sa pamamagitan ng salita, ekspresyon, at galaw ng katawan. Mahalaga ang malinaw at magalang na komunikasyon sa bawat interaksyon. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-146", "part": "A", "category": "コミュニケーション技術", "level": "medium", "question": "利用者（りようしゃ）に質問（しつもん）するとき、「はい」か「いいえ」で答（こた）えられる質問の方法を何といいますか。", "options": ["誘導質問（ゆうどうしつもん）", "オープンクエスチョン（開かれた質問）", "クローズドクエスチョン（閉ざされた質問・くろーずどくえすちょん）"], "answer": 2, "tip_tl": "Mahalaga rito ang paraan ng pakikipag-usap sa resident, lalo na sa pagpapakita ng tunay na pagmamalasakit at pang-unawa. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-147", "part": "A", "category": "コミュニケーション技術", "level": "medium", "question": "利用者が「自分の気持ち（きもち）なんて誰（だれ）にも分からない」と言（い）ったとき、介護職の応答（おうとう）として最も適切なものはどれですか。", "options": ["「誰も分からないと感じて、とてもお辛（つら）いのですね」と気持ちを受け止める", "何も言わずにその場（ば）から離（はな）れる", "「そんな後ろ向き（うしろむき）なことを言ってはダメですよ」と励ます"], "answer": 0, "tip_tl": "Ito ay tungkol sa 'keicho' o active listening — kung paano makinig at tumugon nang may empatiya sa resident. Ang active listening ay ang tunay na pakikinig bago mag-alok ng solusyon. Ang empatiya ay ang pagsubok unawain ang nararamdaman ng kabilang tao. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-148", "part": "A", "category": "コミュニケーション技術", "level": "medium", "question": "視覚障害（しかくしょうがい）のある利用者に食事（しょくじ）のメニューや位置（いち）を説明するとき、お皿（さら）の配置（はいち）を時計（とけい）の文字盤（もじばん）に見立てて伝える方法は何ですか。", "options": ["アイコントラクト（あいこんたくと）", "オープンクエスチョン", "クロックポジション（くろっくぽじしょん）"], "answer": 2, "tip_tl": "Dito tinuturo kung paano magpahayag ng suporta sa pamamagitan ng salita, ekspresyon, at galaw ng katawan. Sa paggabay sa taong may visual impairment, gamitin ang malinaw na verbal cues at 'clock position'. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-149", "part": "A", "category": "コミュニケーション技術", "level": "medium", "question": "利用者の話を聴（き）くとき、言葉（ことば）だけでなく、相手の表情（ひじょう）や視線（しせん）、姿勢（しせい）などのシグナルから感情（かんじょう）を読み取る技術を何といいますか。", "options": ["非言語（ひげんご）コミュニケーションの観察（かんさつ）", "報告（ほうこく）の技術", "説得（せっとく）技術"], "answer": 0, "tip_tl": "Mahalaga rito ang paraan ng pakikipag-usap sa resident, lalo na sa pagpapakita ng tunay na pagmamalasakit at pang-unawa. Mahalaga ang malinaw at magalang na komunikasyon sa bawat interaksyon. Ang di-berbal na senyales — ekspresyon ng mukha, galaw — ay kadalasang mas nagsasabi kaysa salita. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-150", "part": "A", "category": "コミュニケーション技術", "level": "medium", "question": "チーム内（ない）で利用者の状態（じょうたい）を正確（せいかく）に共有（きょうゆう）するため、介護職が報告（ほうこく）を行う際の原則（げんそく）として最も適切なものはどれですか。", "options": ["自分の感想（かんそう）を中心に話す", "事実（じじつ）と自分の意見（いけん・主観）を明確（めいかく）に分けて報告する", "重要（じゅうよう）なことだけを濁して伝える"], "answer": 1, "tip_tl": "Ito ay tungkol sa 'keicho' o active listening — kung paano makinig at tumugon nang may empatiya sa resident. Mahalaga ang malinaw at magalang na komunikasyon sa bawat interaksyon. Ang pag-uulat sa ibang propesyonal ay dapat malinaw, maikli, at tumpak. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-151", "part": "A", "category": "コミュニケーション技術", "level": "medium", "question": "認知症（にんちしょう）の利用者が、過去（かこ）の出来事（できごと）を昨日のことのように話すとき、それを否定（ひてい）せずに耳を傾け（かたむけ）、自尊心（じそんしん）を高める心理的ケアの技術を何といいますか。", "options": ["認知行動療法（にんちこうどうりょうほう）", "回想法（かいそうほう）", "現実見当識訓練（リアリティオリエンテーション）"], "answer": 1, "tip_tl": "Dito tinuturo kung paano magpahayag ng suporta sa pamamagitan ng salita, ekspresyon, at galaw ng katawan. Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Ang reminiscence therapy ay paggamit ng alaala ng nakaraan para pasiglahin ang isip ng resident. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-152", "part": "A", "category": "コミュニケーション技術", "level": "medium", "question": "耳の不自由（ふじゆう）な利用者（聴覚障害・ちょうかくしょうがい）とのコミュニケーション方法で、手（て）や指（ゆび）の動き、顔の表情を使って言葉を表現（ひょうげん）するものを何といいますか。", "options": ["身振り（みぶり）", "手話（しゅわ）", "筆談（ひつだん）"], "answer": 1, "tip_tl": "Mahalaga rito ang paraan ng pakikipag-usap sa resident, lalo na sa pagpapakita ng tunay na pagmamalasakit at pang-unawa. Sa pakikipag-usap sa taong may hearing loss, magsalita nang malinaw at harapin sila. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-153", "part": "A", "category": "生活支援技術", "level": "medium", "question": "車椅子（くるまいす）の利用者を坂道（さかみち）の下り（くだり）で介助（かいじょ）するときの、安全（あんぜん）な進み方として正しいものはどれですか。", "options": ["前輪（ぜんりん）だけを浮かせて（うかせて）急いで下りる", "利用者にブレーキを操作（そうさ）してもらいながら前向きに下りる", "介護職が後ろ向き（うしろむき）になり、車椅子を後ろに引きながらゆっくり下りる"], "answer": 2, "tip_tl": "Dito, ang diin ay sa tamang paraan ng pagtulong sa resident habang pinapanatili ang kanilang natitirang kakayahan (remaining ability). Laging suriin ang brake at posisyon ng wheelchair bago at pagkatapos gamitin. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-154", "part": "A", "category": "生活支援技術", "level": "medium", "question": "ボディメカニクス（ぼでぃめかにくす）の原則（げんそく）において、介護職が自分の腰（こし）の負担（ふたん）を減らす（へらす）ための姿勢として正しいものはどれですか。", "options": ["自分の大きな筋肉（きんにく）を使わずに、指先（ゆびさき）の力だけで支える", "足を完全に閉じて、膝（ひざ）をまっすぐ伸ばしたまま前かがみになる", "足を肩幅（かたはば）に広げて支持基底面（しじきていめん）を広くし、重心を低くする"], "answer": 2, "tip_tl": "Ito ay tungkol sa aktwal na kilos-kamay sa pag-aalaga — ligtas, tama, at magalang sa bawat hakbang. Gamitin ang tamang body mechanics para maiwasan ang sakit ng likod habang tumutulong. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-155", "part": "A", "category": "生活支援技術", "level": "medium", "question": "ベッドの上で利用者を横向き（よこむき・側臥位）にする際、ボディメカニクスを活かして（いかして）摩擦（まさつ）を減らすための最初の準備はどれですか。", "options": ["利用者の腰（こし）を力任せに上に引き上げる", "ベッドの柵（さく）をすべて外した状態にする", "利用者の両腕（りょううで）を胸の前で組んで（くんで）もらう"], "answer": 2, "tip_tl": "Ito ay tungkol sa praktikal na kasanayan sa pag-aalaga sa araw-araw na pangangailangan ng resident — mula sa paglilinis hanggang sa paglipat (transfer). Gamitin ang tamang body mechanics para maiwasan ang sakit ng likod habang tumutulong. Ang regular na pagpapalit ng posisyon (positioning) ay pumipigil sa bedsore. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},

{"id": "care-168", "part": "A", "category": "生活支援技術", "level": "medium", "question": "車椅子（くるまいす）からベッドへ移乗（いじょ）する際、片麻痺（かたまひ・右側が麻痺）のある利用者の場合、車椅子はベッドに対してどのように配置（はいち）するのが最も安全ですか。", "options": ["麻痺側（まひがわ・右側）がベッドにぴったりとくっつくように配置する", "ベッドから2メートル以上離れた場所に配置する", "健側（けんそく・左側）がベッドに近づくよう、斜め20度〜45度の角度で配置する"], "answer": 2, "tip_tl": "Dito, ang diin ay sa tamang paraan ng pagtulong sa resident habang pinapanatili ang kanilang natitirang kakayahan (remaining ability). Sa pag-transfer o paglipat ng resident, laging unahin ang kaligtasan at tamang postura. Laging suriin ang brake at posisyon ng wheelchair bago at pagkatapos gamitin. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-169", "part": "A", "category": "生活支援技術", "level": "medium", "question": "床ずれ（とこづれ・褥瘡）を予防（よぼう）するために、ベッドの上で寝返り（ねがえり）がうてない利用者に対して行う介助（かいじょ）を何といいますか。", "options": ["衣服着脱（いふくちゃくだつ）", "体位変換（たいいへんかん・ポジショニング）", "歩行介助（ほこうかいじょ）"], "answer": 1, "tip_tl": "Ito ay tungkol sa aktwal na kilos-kamay sa pag-aalaga — ligtas, tama, at magalang sa bawat hakbang. Ang regular na pagpapalit ng posisyon (positioning) ay pumipigil sa bedsore. Ang bedsore (褥瘡) ay maiiwasan sa pamamagitan ng regular na pagbabago ng posisyon. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-170", "part": "A", "category": "生活支援技術", "level": "medium", "question": "高齢者の皮膚（ひふ・肌）の特徴（とくちょう）として正しいものを1つ選びなさい。", "options": ["皮膚が乾燥（かんそう）しやすく、傷（きず）つきやすい", "水分（すいぶん）が多くてベタベタしている", "どんなにこすっても絶対に剥がれない"], "answer": 0, "tip_tl": "Ito ay tungkol sa praktikal na kasanayan sa pag-aalaga sa araw-araw na pangangailangan ng resident — mula sa paglilinis hanggang sa paglipat (transfer). Ang balat ng matanda ay manipis at tuyo, kaya't dapat maingat sa paghawak at paglilinis. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},

{"id": "care-177", "part": "A", "category": "生活支援技術", "level": "medium", "question": "高齢者がベッドから急に立ち上がったとき、頭（あたま）の血（ち）が下がって目眩（めまい）や立ちくらみを起こす現象を何といいますか。", "options": ["認知症（にんちしょう）", "高血圧症（こうけつあつしょう）", "起立性低血圧（きりつせいていけつあつ）"], "answer": 2, "tip_tl": "Dito, ang diin ay sa tamang paraan ng pagtulong sa resident habang pinapanatili ang kanilang natitirang kakayahan (remaining ability). Ang orthostatic hypotension ay ang biglaang pagbaba ng presyon kapag tumayo, kaya't dahan-dahan ang paggalaw. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},

{"id": "care-179", "part": "A", "category": "生活支援技術", "level": "medium", "question": "衣服（いふく）を着替える（きがえる）とき、利用者がお気に入りの服を選ぶことができるように支援（しえん）する目的として、最も適切なものはどれですか。", "options": ["利用者の自己決定（じこけってい）を尊重（そんちょう）し、生活に潤いを持たせる", "家族の好みの服を無理やり着せるため", "介護職が服を選ぶ時間を引き算して楽をするため"], "answer": 0, "tip_tl": "Ito ay tungkol sa praktikal na kasanayan sa pag-aalaga sa araw-araw na pangangailangan ng resident — mula sa paglilinis hanggang sa paglipat (transfer). Igalang ang karapatan ng resident na magpasya para sa sarili niya. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-180", "part": "A", "category": "生活支援技術", "level": "medium", "question": "認知症（にんちしょう）の利用者が、季節（きせつ）に合わない厚着（あつぎ・夏に冬のコートを着る）をしようとするときの対応として、最も適切なものはどれですか。", "options": ["「今日は暖かい（あたたかい）ので、こちらの薄い（うすい）上着（うわぎ）にしませんか」と提案する", "「おかしな服は脱ぎなさい」と言って無理やり奪い取る", "家族に電話して本人の文句（もんく）を言う"], "answer": 0, "tip_tl": "Dito, ang diin ay sa tamang paraan ng pagtulong sa resident habang pinapanatili ang kanilang natitirang kakayahan (remaining ability). Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},

{"id": "care-182", "part": "A", "category": "生活支援技術", "level": "medium", "question": "飲み込む（のむ）力が弱くなった高齢者が、スープやお茶などの水分（すいぶん）で喉（のど）を詰まらせたり（つまらせたり）むせたりするのを防ぐために、液体（えきたい）に混ぜる福祉用具（食品）を何といいますか。", "options": ["ビタミン剤（びたみんざい）", "消化剤（しょうかざい）", "とろみ剤（とろみざい・増粘剤）"], "answer": 2, "tip_tl": "Ito ay tungkol sa praktikal na kasanayan sa pag-aalaga sa araw-araw na pangangailangan ng resident — mula sa paglilinis hanggang sa paglipat (transfer). Ang dysphagia (hirap sa paglunok) ay nangangailangan ng espesyal na pag-iingat habang nagpapakain. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-183", "part": "A", "category": "生活支援技術", "level": "medium", "question": "嚥下障害（えんげしょうがい・飲み込みが難しい）のある利用者の食事（しょくじ）が安全（あんぜん）に進んでいるかを確認する、介護職の観察（かんさつ）ポイントとして最も適切なものはどれですか。", "options": ["食事中に隣（となり）の人と楽しそうに話しているかを見る", "食べ物を飲み込んだ後（あと）に、しっかりと「ゴクン」という音がして喉が動いたかを確認する", "利用者がお皿（さら）をスプーンで叩いている（たたいている）かを見る"], "answer": 1, "tip_tl": "Dito, ang diin ay sa tamang paraan ng pagtulong sa resident habang pinapanatili ang kanilang natitirang kakayahan (remaining ability). Bantayan ang paglunok ng resident lalo na sa mga taong may panganib ng pagkabulunan. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
