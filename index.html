{"id": "care-188", "part": "A", "category": "生活支援技術", "level": "medium", "question": "食事（しょくじ）を終えた（おえた）後、利用者の口の中に食べかす（残りかす）が残っていないかを確認（かくにん）する最も重要な目的（もくてき）はどれですか。", "options": ["残った食べかすが寝ている（ねている）間に喉（のど）に入り、誤嚥性肺炎（ごえんせいはいえん）を起こすのを防ぐため", "お皿（さら）を洗う（あらう）時間を引き算して短くするため", "利用者の体重（たいじゅう）が急激に減るのを防ぐため"], "answer": 0, "tip_tl": "Ito ay tungkol sa praktikal na kasanayan sa pag-aalaga sa araw-araw na pangangailangan ng resident — mula sa paglilinis hanggang sa paglipat (transfer). Ang aspiration pneumonia ay maiiwasan sa pamamagitan ng tamang postura habang kumakain. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-189", "part": "A", "category": "生活支援技術", "level": "medium", "question": "排泄（はいせつ・トイレ）の介助（かいじょ）において、利用者が自分でズボン（ずぼん）や下着（したぎ）を上げ下げ（あげさげ）できるように見守る（みまもる）介護職の基本（きほん）の態度はどれですか。", "options": ["本人ができる部分は時間がかかっても自分でやってもらい、できない部分だけを手伝う", "手早く終わらせる（おわらせる）ために、介護職がすべて代わりに上げ下げする", "面倒（めんどう）なので最初からズボンを履かせない（はかせない）ようにする"], "answer": 0, "tip_tl": "Dito, ang diin ay sa tamang paraan ng pagtulong sa resident habang pinapanatili ang kanilang natitirang kakayahan (remaining ability). Ang layunin ay laging suportahan ang kalayaan (independence) ng resident, hindi gawin lahat para sa kanya. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-190", "part": "A", "category": "生活支援技術", "level": "medium", "question": "排泄（はいせつ）の後（あと）に、お尻（おしり）や陰部（いんぶ・大切な部分）を後ろから前（まえ）に向かって拭いて（ふいて）はならない理由（りゆう）として、最も適切なものはどれですか。", "options": ["衣服（いふく）が濡れて（ぬれて）洗濯（せんたく）が大変になるため", "利用者がくすぐったがって怒り出す（おくりだす）ため", "肛門（こうもん・うんちの出口）の細菌（さいきん）が尿道（にょうどう・おしっこの出口）に入り、尿路感染症（にょうろかんせんしょう）を起こすのを防ぐため"], "answer": 2, "tip_tl": "Ito ay tungkol sa aktwal na kilos-kamay sa pag-aalaga — ligtas, tama, at magalang sa bawat hakbang. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-191", "part": "A", "category": "生活支援技術", "level": "medium", "question": "ポータブルトイレ（簡易型の移動式トイレ・ぽーたぶるといれ）をベッドの横に配置（はいち）するとき、片麻痺（かたまひ・右側が麻痺）のある利用者の場合、どのように置くのが最も安全（あんぜん）ですか。", "options": ["利用者の頭（あたま）の後ろの壁（かべ）に立てかけて（たてかけて）配置する", "利用者の麻痺側（まひがわ・右側）の横にぴったりとくっつけて配置する", "利用者の健側（けんそく・左側）の手（て）が届く（とどく）側に、斜め15度〜30度の角度（かくど）で配置する"], "answer": 2, "tip_tl": "Ito ay tungkol sa praktikal na kasanayan sa pag-aalaga sa araw-araw na pangangailangan ng resident — mula sa paglilinis hanggang sa paglipat (transfer). Kapag may hemiplegia (paralisis sa isang bahagi), simulan ang paggalaw mula sa malakas na bahagi ng katawan. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-192", "part": "A", "category": "生活支援技術", "level": "medium", "question": "おむつ（おむつ）を交換（こうかん）するとき、おむつを何枚（なんまい）も重ねて（かさねて）使う「二重あて（にじゅうあて）」を原則（げんそく）としてやってはいけない理由（りゆう）はどれですか。", "options": ["利用者の身体が重く（おもく）なり、ベッドが壊れて（こわれて）しまうため", "おむつがもったいなくて、施設の経済（けいざい）がエンストするため", "おむつの中が激しく蒸れて（むれて）皮膚（ひひ）が傷つき、床ずれ（とこづれ）やオムツかぶれの原因になるため"], "answer": 2, "tip_tl": "Dito, ang diin ay sa tamang paraan ng pagtulong sa resident habang pinapanatili ang kanilang natitirang kakayahan (remaining ability). Ang bedsore (褥瘡) ay maiiwasan sa pamamagitan ng regular na pagbabago ng posisyon. Sa paggamit ng diaper, tamang fitting ang nag-iiwas sa pangangati at bedsore. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-193", "part": "A", "category": "生活支援技術", "level": "medium", "question": "入浴（にゅうよく・お風呂）の介助（かいじょ）において、利用者がお湯（おゆ）の入った湯船（ゆぶね）に出入り（でいり）する際、介護職が最初（さいしょ）に声をかけるべき最も重要な確認はどれですか。", "options": ["「今日の体重（たいじゅう）は何キログラムでしたか」と質問する", "「お風呂（ふろ）の後は何のご飯（ごはん）を食べたいですか」と聞く", "「お湯（おゆ）の温度（おんど）は熱すぎ（あつすぎ）ませんか、大丈夫ですか」と確認する"], "answer": 2, "tip_tl": "Ito ay tungkol sa aktwal na kilos-kamay sa pag-aalaga — ligtas, tama, at magalang sa bawat hakbang. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-194", "part": "A", "category": "生活支援技術", "level": "medium", "question": "お風呂（おふろ）に入るとき、急激（きゅうげき）な温度（おんど）の変化（へんか）によって血圧（けつあつ）が上下（じょうげ）し、心臓（しんぞう）や脳（のう）に大きな負担がかかって倒れる（たおれる）現象を何といいますか。", "options": ["ヒートショック（ひーとしょっく）", "ボディメカニクス（ぼでぃめかにくす）", "アセスメント（あせすめんと）"], "answer": 0, "tip_tl": "Ito ay tungkol sa praktikal na kasanayan sa pag-aalaga sa araw-araw na pangangailangan ng resident — mula sa paglilinis hanggang sa paglipat (transfer). Ang pagsukat ng blood pressure ay bahagi ng regular na pagsubaybay sa kalusugan ng resident. Ang heat shock ay panganib sa biglaang pagbabago ng temperatura, lalo na habang naliligo. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-195", "part": "A", "category": "生活支援技術", "level": "medium", "question": "お風呂（おふろ）の現場でヒートショック（ひーとしょっく）を防ぐ（ふせぐ）ための、環境（かんきょう）の配管（準備）として最も適切なものはどれですか。", "options": ["お湯の温度を45度（ど）以上の非常に熱い（あつい）設定（せってい）にする", "脱衣室（だついしつ・服を脱ぐ部屋）と浴室（よくしつ・お風呂場）をあらかじめ暖めて（あたためて）おき、温度の差を引き算する", "浴室の窓（まど）を全開（ぜんかい）にして冷たい（つめたい）風（かぜ）を入れ続ける"], "answer": 1, "tip_tl": "Dito, ang diin ay sa tamang paraan ng pagtulong sa resident habang pinapanatili ang kanilang natitirang kakayahan (remaining ability). Ang heat shock ay panganib sa biglaang pagbabago ng temperatura, lalo na habang naliligo. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-196", "part": "A", "category": "生活支援技術", "level": "medium", "question": "入浴介助（にゅうよくかいじょ）において、利用者の身体（からだ）にシャワー（しゃわー）のお湯をかけるとき、最初（さいしょ）にかけるべき正しい場所（部位）はどこですか。", "options": ["心臓（しんぞう）から遠い（とおい）足の先（あしのさき）や手の先（てさき）", "顔（かお）の正面（しょうめん）", "頭（あたま）のてっぺん"], "answer": 0, "tip_tl": "Ito ay tungkol sa aktwal na kilos-kamay sa pag-aalaga — ligtas, tama, at magalang sa bawat hakbang. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-197", "part": "A", "category": "介護課程", "level": "medium", "question": "介護課程（かいごかてい）における「アセスメント（あせすめんと）」の目的（もくてき）として、最も適切なものはどれですか。", "options": ["利用者の悪い（わるい）部分（ぶぶん）を見つけて、厳しく怒る（おこる）ための材料（ざいりょう）を集めること", "介護職（かいごしょく）が楽（らく）をするためのスケジュール（すけじゅーる）を組み立てる（くみたてる）こと", "利用者のこれまでの生活（せいかつ）や現在の状態（じょうたい）、本人の望み（のぞみ・ニーズ）を総合的に分析（ぶんせき）して課題（かだい）を見つけること"], "answer": 2, "tip_tl": "Ito ay bahagi ng 'care process' — ang sistematikong paraan ng pagpaplano ng pangangalaga base sa aktwal na pangangailangan ng resident. Ang assessment ay ang unang hakbang — kalapin ang tamang impormasyon bago magplano. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-198", "part": "A", "category": "介護課程", "level": "medium", "question": "介護計画（かいごけいかく）を立（た）てる際（さい）、最も優先（ゆうせん）して組み込む（くみこむ）べき要素（ようそ）はどれですか。", "options": ["利用者（りようしゃ）の生活（せいかつ）に対する意向（いこう・望みやニーズ）", "介護職（かいごしょく）の勤務（きんむ）スケジュール", "施設（しせつ）の効率的（こうりつてき）な管理（かんり）ルール"], "answer": 0, "tip_tl": "Dito tinuturo kung paano suriin, magplano, at i-evaluate ang pangangalaga para sa bawat indibidwal na resident. Ang care plan ay dapat base sa aktwal na pangangailangan ng resident, hindi sa kaginhawaan ng staff. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-199", "part": "A", "category": "介護課程", "level": "medium", "question": "ケアプラン（けあぷらん）に基づ（もと）づいて作成（さくせい）される、個々（ここ）の介護サービスの具体的な手順（てじゅん）や方法（ほうほう）をまとめた計画を何といいますか。", "options": ["個別介護計画（こべつかいごけいかく）", "業務命令書（ぎょうむめいれいしょ）", "施設管理計画（しせつかんりけいかく）"], "answer": 0, "tip_tl": "Ang paksang ito ay tungkol sa buong siklo ng care planning — mula assessment hanggang review. Ang care plan ay dapat base sa aktwal na pangangailangan ng resident, hindi sa kaginhawaan ng staff. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-200", "part": "A", "category": "介護課程", "level": "medium", "question": "介護記録（かいごきろく）において、「本人が『頭が痛い（あたまがいたい）』と言った」という情報は、どの種類の情報に分類されますか。", "options": ["主観的情報（しゅかんてきじょうほう・本人の訴え）", "客観的情報（きゃっかんてきじょうほう・事実）", "介護職の感想（かんそう）"], "answer": 0, "tip_tl": "Ito ay bahagi ng 'care process' — ang sistematikong paraan ng pagpaplano ng pangangalaga base sa aktwal na pangangailangan ng resident. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-201", "part": "A", "category": "介護課程", "level": "medium", "question": "介護記録（かいごきろく）に客観的情報（きゃっかんてきじょうほう）を書くとき、最も適切な表現（ひょうげん）はどれですか。", "options": ["「体温（たいおん）を測ったら（はかったら）37.5度（ど）であった」という事実", "「利用者がなんだか元気がなさそうに見えた」という感想", "「家族がいつも文句（もんく）を言っている」という主観"], "answer": 0, "tip_tl": "Dito tinuturo kung paano suriin, magplano, at i-evaluate ang pangangalaga para sa bawat indibidwal na resident. Ang record o dokumentasyon ay dapat batay sa aktwal na katotohanan, hindi opinyon. Ang pag-uulat sa ibang propesyonal ay dapat malinaw, maikli, at tumpak. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-202", "part": "A", "category": "介護課程", "level": "medium", "question": "介護計画（かいごけいかく）の目標（もくひょう）を設定（せってい）するとき、守る（まもる）べき正しいルールはどれですか。", "options": ["介護職の仕事（しごと）をゼロにする目標にすること", "達成（たっせい）できたかどうかが、後で具体的に評価（ひょうか）できる内容にすること", "家族だけが満足（まんぞく）する目標にすること"], "answer": 1, "tip_tl": "Ang paksang ito ay tungkol sa buong siklo ng care planning — mula assessment hanggang review. Ang goal setting ay dapat batay sa aktwal na kakayahan at pangarap ng resident, hindi biglaang target. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-203", "part": "A", "category": "介護課程", "level": "medium", "question": "介護計画（かいごけいかく）に書かれたサービスを実際に実施（じっし）する際、介護職が常に意識（いしき）すべき基本（きほん）の行動はどれですか。", "options": ["時間がもったいないので、計画を無視して手早く終わらせる", "計画（けいかく）の目的（もくてき）を理解し、利用者の安全（あんぜん）と自立（じりつ）を支えるように介助する", "利用者の嫌がる（いやがる）ことを無理やりやらせる"], "answer": 1, "tip_tl": "Ito ay bahagi ng 'care process' — ang sistematikong paraan ng pagpaplano ng pangangalaga base sa aktwal na pangangailangan ng resident. Ang layunin ay laging suportahan ang kalayaan (independence) ng resident, hindi gawin lahat para sa kanya. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-204", "part": "A", "category": "介護課程", "level": "medium", "question": "行った介護サービスについて、チームで話し合い、計画（けいかく）の効果（こうか）を確かめる会議（かいぎ）を何といいますか。", "options": ["カンファレンス（かんふぁれんす・事例検討会）", "予算会議（よさんかいぎ）", "反省会（はんせいかい）"], "answer": 0, "tip_tl": "Dito tinuturo kung paano suriin, magplano, at i-evaluate ang pangangalaga para sa bawat indibidwal na resident. Ang case conference ay pagkakataon para pag-usapan ng buong team ang plano ng pangangalaga. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-205", "part": "A", "category": "介護課程", "level": "medium", "question": "利用者の状態（じょうたい）が急激（きゅうげき）に変化（へんか）したため、現在の介護計画（かいごけいかく）では対応できなくなった場合の正しい行動はどれですか。", "options": ["現在の計画のまま、無理やりサービスを続ける", "計画（けいかく）を勝手に破り捨てて（やぶりすてて）自分の判断で動く", "すぐにアセスメント（課題分析）をやり直し、計画の見直し（みなおし）を提案する"], "answer": 2, "tip_tl": "Ang paksang ito ay tungkol sa buong siklo ng care planning — mula assessment hanggang review. Ang care plan ay dapat base sa aktwal na pangangailangan ng resident, hindi sa kaginhawaan ng staff. Ang assessment ay ang unang hakbang — kalapin ang tamang impormasyon bago magplano. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-206", "part": "A", "category": "介護課程", "level": "medium", "question": "介護記録（かいごきろく）を法律（ほうりつ）に基づいて一定（いってい）の期間（きかん）保存（ほぞん）しなければならない最も重要な目的はどれですか。", "options": ["ソネットくんのメモリを消費（しょうひ）させるため", "部屋（へや）のスペース（すぺーす）を圧迫（あっぱく）して嫌がらせ（いやがらせ）をするため", "サービス提供（ていきょう）の証明（しょうめい）とし、チーム間の継続的（けいぞくてき）なケアに活かすため"], "answer": 2, "tip_tl": "Ito ay bahagi ng 'care process' — ang sistematikong paraan ng pagpaplano ng pangangalaga base sa aktwal na pangangailangan ng resident. Ang record o dokumentasyon ay dapat batay sa aktwal na katotohanan, hindi opinyon. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-207", "part": "A", "category": "介護課程", "level": "medium", "question": "介護課程（かいごかてい）の展開（てんかい）において、利用者の情報を集める「情報収集（じょうほうしゅうしゅう）」の手段（しゅだん）として含まれないものはどれですか。", "options": ["近所の住民（じゅうみん）の噂話（うわさばなし）を鵜呑み（うのみ）にすること", "本人（ほんにん）や家族（かぞく）との面接（めんせつ）", "医療機関（いりょうきかん）からの診断書（しんだんしょ）の確認"], "answer": 0, "tip_tl": "Dito tinuturo kung paano suriin, magplano, at i-evaluate ang pangangalaga para sa bawat indibidwal na resident. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-208", "part": "A", "category": "介護課程", "level": "medium", "question": "介護計画（かいごけいかく）の実施（じっし）において、利用者が「今日はやりたくない」と拒絶（きょぜつ）した場合の介護職の対応として最も適切なものはどれですか。", "options": ["「計画（けいかく）だから絶対にやりなさい」と無理やり命令（めいれい）する", "本人の気持ち（きもち）や体調（たいちょう）を確認し、理由（りゆう）に寄り添って対応を考える", "何も言わずに家族（かぞく）に言いつける（いいつける）"], "answer": 1, "tip_tl": "Ang paksang ito ay tungkol sa buong siklo ng care planning — mula assessment hanggang review. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-209", "part": "A", "category": "介護課程", "level": "medium", "question": "介護福祉士（かいごふくしし）が記録（きろく）を書くとき、専門用語（せんもんようご）を正しく使うべき理由として最も適切なものはどれですか。", "options": ["多職種（たしょくしゅ・医師や看護師）との連携（れんけい）を正確かつスムーズに行うため", "文章を難しく（むずかしく）見せるため", "自分の知識（ちしき）をひけらかして自慢（じまん）するため"], "answer": 0, "tip_tl": "Ito ay bahagi ng 'care process' — ang sistematikong paraan ng pagpaplano ng pangangalaga base sa aktwal na pangangailangan ng resident. Ang team work sa pagitan ng iba't ibang propesyonal ay mahalaga para sa kabuuang kalidad ng pangangalaga. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-210", "part": "B", "category": "発達と老化の理解", "level": "medium", "question": "高齢者（こうれいしゃ）の骨（ほね）や筋肉（きんにく）の変化（へんか・老化）において、骨がもろくなり、転倒（てんとう）したときに骨折（こっせつ）しやすくなる病気を何といいますか。", "options": ["骨粗鬆症（こつそしょうしょう）", "高血圧症（こうけつあつしょう）", "変形性膝関節症（へんけいせいひざかんせつしょう）"], "answer": 0, "tip_tl": "Dito ipinapaliwanag kung anong mga pagbabago sa aging process ang dapat asahan at unawain ng care worker. Ang osteoporosis ay nagpapadali sa pagkabali ng buto kaya't dapat maingat sa paggalaw ng matanda. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-211", "part": "B", "category": "発達と老化の理解", "level": "medium", "question": "高齢（こうれい）になると、目（め）のレンズ（水晶体・すいしょうたい）が白く（しろく）濁って（にごって）見えにくくなる病気（びょうき）を何といいますか。", "options": ["白内障（はくないしょう）", "緑内障（りょくないしょう）", "結膜炎（けつまくえん）"], "answer": 0, "tip_tl": "Ang paksang ito ay tumatalakay sa physical at mental na pagbabago na dulot ng edad. Sa paggabay sa taong may visual impairment, gamitin ang malinaw na verbal cues at 'clock position'. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-212", "part": "B", "category": "発達と老化の理解", "level": "medium", "question": "高齢者（こうれいしゃ）が食事（しょくじ）をするとき、唾液（だえき・よだれ）の量が減る（へる）ことによって起こりやすい口の中のトラブルはどれですか。", "options": ["虫歯（むしば）の自然治癒", "口腔乾燥（こうくうかんそう・口が渇くこと）", "歯の数が自然に増えること"], "answer": 1, "tip_tl": "Ito ay tungkol sa normal na pagbabago sa katawan at isip habang tumatanda ang isang tao. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-213", "part": "B", "category": "発達と老化の理解", "level": "medium", "question": "高齢（こうれい）に伴う（ともなう）呼吸機能（こきゅうきのう・肺の力）の変化（へんか）として、正しいものはどれですか。", "options": ["酸素（さんそ）を取り入れる力が若者より高くなる", "肺活量（はいかつりょう）が低下（ていか）し、息切れ（いきぎれ）がしやすくなる", "咳（せき）を出して痰（たん）を出す力が強くなる"], "answer": 1, "tip_tl": "Dito ipinapaliwanag kung anong mga pagbabago sa aging process ang dapat asahan at unawain ng care worker. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-214", "part": "B", "category": "発達と老化の理解", "level": "medium", "question": "高齢（こうれい）になると、血管（けっかん）の壁（かべ）が硬く（かたく）なるため、どのようなバイタルサイン（体の状態）の変化が起こりやすいですか。", "options": ["脈拍（みゃくはく）が完全に止まる", "血圧（けつあつ）が高くなりやすい（高血圧・こうけつあつ）", "体温（たいおん）が急激に上がる"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa physical at mental na pagbabago na dulot ng edad. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-215", "part": "B", "category": "発達と老化の理解", "level": "medium", "question": "高齢者（こうれいしゃ）の体温（たいおん）の特徴（とくちょう）として、介護職（かいごしょく）が知っておくべき正しい知識（ちしき）はどれですか。", "options": ["若者よりも平熱が非常に高い", "気温（きおん）の変化に影響（えいきょう）をまったく受けない", "若者よりも平熱（へいねつ）が低め（ひくめ）で、熱（ねつ）があっても気づきにくい"], "answer": 2, "tip_tl": "Ito ay tungkol sa normal na pagbabago sa katawan at isip habang tumatanda ang isang tao. Ang katawan ng matatanda ay mas mahirap magregulate ng temperatura, kaya dapat maingat. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-216", "part": "B", "category": "発達と老化の理解", "level": "medium", "question": "高齢（こうれい）になると、腸（ちょう）の動き（ぜん動運動・ぜんどううんどう）が弱くなることや、筋力（きんりょく）の低下が原因で起こりやすい排泄（はいせつ）のトラブルはどれですか。", "options": ["下痢（げり）の完全な消失", "便秘（べんぴ・うんちが出ないこと）", "尿閉（にょうへい）"], "answer": 1, "tip_tl": "Dito ipinapaliwanag kung anong mga pagbabago sa aging process ang dapat asahan at unawain ng care worker. Ang paninigas ng dumi (constipation) ay karaniwang problema dahil sa paghina ng bituka habang tumatanda. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-217", "part": "B", "category": "発達と老化の理解", "level": "medium", "question": "人間の発達（はたつ）において、成人期（せいじんき）以降（いこう）に少しずつ起こる、身体（からだ）の機能（きのう）が衰えて（おとろえて）いくプロセスのことを何といいますか。", "options": ["成長（せいちょう）", "老化（ろうか・加齢・かれい）", "発達（はたつ）"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa physical at mental na pagbabago na dulot ng edad. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-218", "part": "B", "category": "発達と老化の理解", "level": "medium", "question": "高齢（こうれい）になっても低下（ていか）しにくく、これまでの人生（じんせい）の経験（けいけん）や知識（ちしき）をもとに問題を解決（かいけつ）する能力（のうりょく）を何といいますか。", "options": ["短期記憶（たんききおく）", "計算能力（けいさんのうりょく）", "結晶性知能（けっしょうせいちのう）"], "answer": 2, "tip_tl": "Ito ay tungkol sa normal na pagbabago sa katawan at isip habang tumatanda ang isang tao. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-219", "part": "B", "category": "発達と老化の理解", "level": "medium", "question": "高齢（こうれい）になると低下（ていか）しやすく、新しい（あたらしい）環境（かんきょう）に適応（てきおう）することや、素早い（すばやい）計算（けいさん）を行う能力を何といいますか。", "options": ["流動性知能（りゅうどうせいちのう）", "言語能力（げんごのうりょく）", "結晶性知能（けっしょうせいちのう）"], "answer": 0, "tip_tl": "Dito ipinapaliwanag kung anong mga pagbabago sa aging process ang dapat asahan at unawain ng care worker. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-220", "part": "B", "category": "発達と老化の理解", "level": "medium", "question": "高齢者（こうれいしゃ）の記憶（きおく）の特徴（とくちょう）として、最も正しいものはどれですか。", "options": ["すべての記憶が完全に消える", "昔（むかし）の思い出（長期記憶）は覚えているが、さっきの出来事（短期記憶）は忘れやすい", "記憶の能力は若者とまったく同じである"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa physical at mental na pagbabago na dulot ng edad. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-221", "part": "B", "category": "発達と老化の理解", "level": "medium", "question": "高齢（こうれい）になると、関節（かんせつ）のクッション（軟骨・なんこつ）がすり減る（すりへる）ことで、膝（ひざ）などに痛み（いたみ）が出る病気を何といいますか。", "options": ["変形性膝関節症（へんけいせいひざかんせつしょう）", "脳梗塞（のうこうそく）", "骨粗鬆症（こつそしょうしょう）"], "answer": 0, "tip_tl": "Ito ay tungkol sa normal na pagbabago sa katawan at isip habang tumatanda ang isang tao. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-222", "part": "B", "category": "発達と老化の理解", "level": "medium", "question": "高齢者（こうれいしゃ）が食事（しょくじ）のときに、むせたり喉（のど）に食べ物を詰まらせたり（つまらせたり）しやすくなる原因（げんいん）として正しいものはどれですか。", "options": ["胃（い）の容量（ようりょう）の拡大", "噛む（かむ）力や、飲み込む（のむ）力（嚥下機能・えんげきのう）の低下", "唾液（だえき）の分泌量（ぶんぴつりょう）の増加"], "answer": 1, "tip_tl": "Dito ipinapaliwanag kung anong mga pagbabago sa aging process ang dapat asahan at unawain ng care worker. Ang dysphagia (hirap sa paglunok) ay nangangailangan ng espesyal na pag-iingat habang nagpapakain. Bantayan ang paglunok ng resident lalo na sa mga taong may panganib ng pagkabulunan. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-223", "part": "B", "category": "認知症の理解", "level": "medium", "question": "認知症（にんちしょう）の原因（げんいん）となる病気（びょうき）の中で、脳（のう）に異常（いじょう）なたんぱく質が溜まり（たまり）、脳の細胞（さいぼう）が少しずつ縮んで（ちぢんで）いく最も多いタイプは何ですか。", "options": ["レビー小体型認知症（れびーしょうたいがたにんちしょう）", "前頭側頭型認知症（ぜんとうそくとうがたにんちしょう）", "アルツハイマー型認知症（あるつはいまーがたにんちしょう）"], "answer": 2, "tip_tl": "Ang paksang ito ay tumatalakay sa iba't ibang uri ng dementia at ang epekto nito sa pang-araw-araw na buhay ng resident. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-224", "part": "B", "category": "認知症の理解", "level": "medium", "question": "認知症（にんちしょう）の症状（しょうじょう）において、自分が今どこにいるか、今が何年何月何日か、目の前の人が誰かが分からなくなる症状を何といいますか。", "options": ["実行機能障害（じっこうきのうしょうがい）", "失認（しつにん）", "見当識障害（けんとうしきしょうがい）"], "answer": 2, "tip_tl": "Ito ay tungkol sa dementia — kung paano ito nagbabago sa isip at asal ng resident, at kung paano dapat tumugon ang care worker. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-225", "part": "B", "category": "認知症の理解", "level": "medium", "question": "認知症（にんちしょう）の人が、ご飯（ごはん）を食べた（たべた）直後（ちょくご）に「まだご飯を食べていない」と言う（いう）とき、この原因となっている中核症状（ちゅうかく症状）はどれですか。", "options": ["徘徊（はいかい）", "記憶障害（きおくしょうがい・新しいことを忘れやすい）", "見当識障害（けんとうしきしょうがい）"], "answer": 1, "tip_tl": "Dito, mahalagang maunawaan ang sintomas ng dementia at ang tamang paraan ng pakikitungo dito nang may pasensya at empatiya. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-226", "part": "B", "category": "認知症の理解", "level": "medium", "question": "脳梗塞（のうこうそく）や脳出血（のうしゅっけつ）が原因（げんいん）で、脳の血流（けつりゅう）が悪くなり、できることとできないことがハッキリと分かれる認知症のタイプを何といいますか。", "options": ["レビー小体型認知症", "脳血管性認知症（のうけっかんせいにんちしょう）", "前頭側頭型認知症"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa iba't ibang uri ng dementia at ang epekto nito sa pang-araw-araw na buhay ng resident. Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-227", "part": "B", "category": "認知症の理解", "level": "medium", "question": "認知症の症状（しょうじょう）のうち、計画（けいかく）を立てて物事を進めることや、家電（かでん）の正しい使い方が分からなくなる障害（しょうがい）を何といいますか。", "options": ["失認（しつにん）", "見当識障害（けんとうしきしょうがい）", "実行機能障害（じっこうきのうしょうがい）"], "answer": 2, "tip_tl": "Ito ay tungkol sa dementia — kung paano ito nagbabago sa isip at asal ng resident, at kung paano dapat tumugon ang care worker. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-228", "part": "B", "category": "認知症の理解", "level": "medium", "question": "レビー小体型認知症（れびーしょうたいがたにんちしょう）において、手足が震えたり（ふるえたり）、身体が硬くなったり（かたくなったり）して転びやすくなる症状を何といいますか。", "options": ["幻視（げんし）", "パーキンソン症状（ぱーきんそんしょうじょう）", "物取られ妄想（ものとられもうそう）"], "answer": 1, "tip_tl": "Dito, mahalagang maunawaan ang sintomas ng dementia at ang tamang paraan ng pakikitungo dito nang may pasensya at empatiya. Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-229", "part": "B", "category": "認知症の理解", "level": "medium", "question": "認知症の利用者が、自分の財布（さいふ）をどこに置いたか忘れてしまい、「誰かに盗まれた（ぬすまれた）」と思い込んで怒る症状を何といいますか。", "options": ["見当識障害（けんとうしきしょうがい）", "物取られ妄想（ものとられもうそう）", "徘徊（はいかい）"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa iba't ibang uri ng dementia at ang epekto nito sa pang-araw-araw na buhay ng resident. Ang BPSD (behavioral at psychological symptoms) ng dementia ay dapat unawain bago husgahan. Ang delusyon o maling paniniwala ng resident ay hindi dapat depensahan agad, kundi unawain kung saan galing. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-230", "part": "B", "category": "認知症の理解", "level": "medium", "question": "認知症の人が、目的（もくてき）が無く歩き回っている（あるきまわっている）ように見えて、実は本人なりの理由や不安があって歩く行動を何といいますか。", "options": ["抑うつ（よくうつ）", "失行（しっこう）", "徘徊（はいかい）"], "answer": 2, "tip_tl": "Ito ay tungkol sa dementia — kung paano ito nagbabago sa isip at asal ng resident, at kung paano dapat tumugon ang care worker. Ang wandering (paggala) ay karaniwang tanda ng pangangailangan o pagkalito, hindi dapat pigilan agad kundi unawain. Ang BPSD (behavioral at psychological symptoms) ng dementia ay dapat unawain bago husgahan. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-231", "part": "B", "category": "認知症の理解", "level": "medium", "question": "認知症の利用者が、夕方（ゆうがた）になると不安（ふあん）や焦り（あせり）が強くなり、落ち着きがなくなって外に出ようとする現象を何といいますか。", "options": ["認知機能低下", "夕暮れ症候群（ゆうぐれしょうこうぐん・サンダウニング）", "記憶障害"], "answer": 1, "tip_tl": "Dito, mahalagang maunawaan ang sintomas ng dementia at ang tamang paraan ng pakikitungo dito nang may pasensya at empatiya. Ang sundowning ay ang pagiging balisa ng resident na may dementia sa gabi o dapithapon. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-232", "part": "B", "category": "認知症の理解", "level": "medium", "question": "認知症の利用者への関わり方（ケア）において、本人の世界（せかい）や感情（かんじょう）を否定（ひてい）せず、共感（きょうかん）して受け入れるアプローチを何といいますか。", "options": ["リアリティオリエンテーション", "行動療法", "バリデーション（ばりでーしょん）"], "answer": 2, "tip_tl": "Ang paksang ito ay tumatalakay sa iba't ibang uri ng dementia at ang epekto nito sa pang-araw-araw na buhay ng resident. Ang empatiya ay ang pagsubok unawain ang nararamdaman ng kabilang tao. Ang validation therapy ay ang pagkilala sa damdamin ng resident kahit hindi tugma sa realidad. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-233", "part": "B", "category": "認知症の理解", "level": "medium", "question": "認知症の症状を悪化（あっか）させる原因（げんいん）となる、急激な環境の変化（かんきょうのへんか・引っ越しや入院など）による心理的ショックを何といいますか。", "options": ["リロケーションダメージ（りろけーしょんだめーじ）", "ノーマライゼーション", "ヒートショック"], "answer": 0, "tip_tl": "Ito ay tungkol sa dementia — kung paano ito nagbabago sa isip at asal ng resident, at kung paano dapat tumugon ang care worker. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-234", "part": "B", "category": "認知症の理解", "level": "medium", "question": "アルツハイマー型認知症の人が、着替え（きがえ）の際に服の上下（じょうげ）や前後（ぜんご）が分からなくなり、正しく着られなくなる中核症状を何といいますか。", "options": ["失認（しつにん）", "失行（しっこう）", "見当識障害"], "answer": 1, "tip_tl": "Dito, mahalagang maunawaan ang sintomas ng dementia at ang tamang paraan ng pakikitungo dito nang may pasensya at empatiya. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-235", "part": "B", "category": "認知症の理解", "level": "medium", "question": "前頭側頭型認知症（ぜんとうそくとうがたにんちしょう・ピック病）の利用者に多く見られる、社会のルールを無視（むし）して万引き（まんびき）などを平気でしてしまう症状（しょうじょう）は何ですか。", "options": ["脱抑制（だつよくせい・理性がきかなくなる）", "幻視", "物忘れ"], "answer": 0, "tip_tl": "Ang paksang ito ay tumatalakay sa iba't ibang uri ng dementia at ang epekto nito sa pang-araw-araw na buhay ng resident. Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-236", "part": "B", "category": "障害の理解", "level": "medium", "question": "障害者（しょうがいしゃ）が自立（じりつ）した生活を送り、社会に参加（さんか）することを妨げている（さまたげている）物理的（ぶつりてき）・心理的な壁を取り除くことを何といいますか。", "options": ["アドボカシー", "バリアフリー（ばりあふりー）", "ノーマライゼーション"], "answer": 1, "tip_tl": "Ito ay tungkol sa iba't ibang uri ng kapansanan at kung paano suportahan ang kalayaan ng taong may kapansanan. Ang barrier-free na kapaligiran ay tumutulong sa taong may kapansanan na kumilos nang mag-isa. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-237", "part": "B", "category": "障害の理解", "level": "medium", "question": "障害者総合支援法（しょうがいしゃそうごうしえんほう）において、障害者が自宅（じたく）で入浴（にゅうよく）や食事（しょくじ）の介助を受けることができるサービスを何といいますか。", "options": ["就労移行支援", "同行援護（どうこうえんご）", "居宅介護（きょたくかいご・ホームヘルプ）"], "answer": 2, "tip_tl": "Dito, ang diin ay unawain ang pangangailangan ng bawat tao ayon sa kanyang partikular na kapansanan — pisikal, sensory, o developmental. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-238", "part": "B", "category": "障害の理解", "level": "medium", "question": "視覚障害（しかくしょうがい）のある人が、外出（がいしゅつ）するときに安全（あんぜん）に移動（いどう）できるよう、専門のスタッフが付き添って（つきそって）移動を支えるサービスは何ですか。", "options": ["訪問介護", "同行援護（どうこうえんご）", "行動援護（こうどうえんご）"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa disability support — hindi puro limitasyon, kundi pagpapalawak ng kakayahan ng tao. Sa paggabay sa taong may visual impairment, gamitin ang malinaw na verbal cues at 'clock position'. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-239", "part": "B", "category": "障害の理解", "level": "medium", "question": "障害（しょうがい）がある人が、一般（いっぱん）の企業（きぎょう）に就職（しゅうしょく）できるように、働くためのトレーニングや面接の練習を行う福祉サービスは何ですか。", "options": ["就労継続支援A型", "生活介護", "就労移行支援（しゅうろういこうしえん）"], "answer": 2, "tip_tl": "Ito ay tungkol sa iba't ibang uri ng kapansanan at kung paano suportahan ang kalayaan ng taong may kapansanan. May mga batas na sumusuporta sa employment ng mga taong may kapansanan sa Japan. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-240", "part": "B", "category": "障害の理解", "level": "medium", "question": "障害者総合支援法（しょうがいしゃそうごうしえんほう）のサービスを利用（りよう）するとき、サービスの計画（けいかく）を作成（さくせい）する専門の職種（しょくしゅ）は誰ですか。", "options": ["相談支援専門員（そうだんしえんせんもんいん）", "介護福祉士", "社会福祉士"], "answer": 0, "tip_tl": "Dito, ang diin ay unawain ang pangangailangan ng bawat tao ayon sa kanyang partikular na kapansanan — pisikal, sensory, o developmental. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-241", "part": "B", "category": "障害の理解", "level": "medium", "question": "リハビリテーション（りはびりてーしょん）の考え方（かんがえかた）において、障害（しょうがい）がある人の身体（からだ）の機能（きのう）を直す（なおす）だけでなく、人間（にんげん）としての権利（けんり）や尊厳（そんげん）を取り戻す（とりもどす）ことを表す言葉（ことば）はどれですか。", "options": ["身体機能訓練（しんたいきのうくんれん）", "全人間的復権（ぜんにんげんてきふっけん）", "経済的自立（けいざいてきじりつ）"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa disability support — hindi puro limitasyon, kundi pagpapalawak ng kakayahan ng tao. Ang dignidad ng resident ang dapat unahin sa bawat desisyon. Ang rehabilitation ay naglalayong pahusayin at panatilihin ang natitirang kakayahan ng resident. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-242", "part": "B", "category": "障害の理解", "level": "medium", "question": "生まれつき（うまれつき）脳（のう）の発達（はたつ）のバランス（ばらんす）がゆっくりで、コミュニケーション（こみゅにけーしょん）や他人（たにん）との関わり（かかわり）に独特（どくとく）の特徴（とくちょう）がある障害を何といいますか。", "options": ["身体障害（しんたいしょうがい）", "精神障害（せいしんしょうがい）", "発達障害（はったつしょうがい）"], "answer": 2, "tip_tl": "Ito ay tungkol sa iba't ibang uri ng kapansanan at kung paano suportahan ang kalayaan ng taong may kapansanan. Mahalaga ang malinaw at magalang na komunikasyon sa bawat interaksyon. Ang developmental disorder ay nagdudulot ng hamon sa komunikasyon at interaksyon sa lipunan. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-243", "part": "B", "category": "障害の理解", "level": "medium", "question": "発達障害（はったつしょうがい）の一種（いっしゅ）で、相手（あいて）の気持ち（きもち）を読み取る（よみとる）ことや、場の空気（くうき）を合わせる（あわせる）ことが難しく（むずかしく）、特定の物事に強いこだわりを持つ特徴を何といいますか。", "options": ["注意欠陥多動性障害（ADHD）", "自閉症スペクトラム障害（ASD・じへいしょうすぺくとらむしょうがい）", "肢体不自由（したいふじゆう）"], "answer": 1, "tip_tl": "Dito, ang diin ay unawain ang pangangailangan ng bawat tao ayon sa kanyang partikular na kapansanan — pisikal, sensory, o developmental. Ang Autism Spectrum ay isang uri ng developmental disorder na may kaugnayan sa social interaction at partikular na interes. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-244", "part": "B", "category": "障害の理解", "level": "medium", "question": "学校（がっこう）の勉強（べんきょう）において、聞く・話す・読む・書く・計算（けいさん）するなどの特定の能力（のうりょく）だけが極端（きょくたん）に苦手（にがて）である発達障害のタイプは何ですか。", "options": ["知的障害（ちてきしょうがい）", "精神分裂病（せいしんぶんれつびょう）", "学習障害（LD・がくしゅうしょうがい）"], "answer": 2, "tip_tl": "Ang paksang ito ay tumatalakay sa disability support — hindi puro limitasyon, kundi pagpapalawak ng kakayahan ng tao. Ang pagtingin sa kapansanan ay dapat nakabatay sa kakayahan ng tao, hindi sa limitasyon lamang. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-245", "part": "B", "category": "障害の理解", "level": "medium", "question": "障害者虐待防止法（しょうがいしゃぎゃくたいぼうしほう）において、障害者への虐待を発見したすべての国民（こくみん）に義務（ぎむ）づけられている正しい対応はどれですか。", "options": ["何も見なかったことにして部屋（へや）に帰ること", "自分で虐待の犯人（はんにん）を捕まえること", "市町村（しちょうそん）の窓口（まどぐち）などへ速やかに通報（つうほう）すること"], "answer": 2, "tip_tl": "Ito ay tungkol sa iba't ibang uri ng kapansanan at kung paano suportahan ang kalayaan ng taong may kapansanan. Mahigpit na ipinagbabawal ang anumang uri ng abuso sa pag-aalaga. Ang pag-uulat sa ibang propesyonal ay dapat malinaw, maikli, at tumpak. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-246", "part": "B", "category": "障害の理解", "level": "medium", "question": "目（め）が見えない人（視覚障害）が、身の回り（みのまわり）の文字（もじ）の情報を指先（ゆびさき）の感覚（かんかく）で読み取る（よみとる）ために使う、小さな凸凹（でこぼこ）の点を組み合わせた文字を何といいますか。", "options": ["点字（てんじ）", "漢字（かんじ）", "手話（しゅわ）"], "answer": 0, "tip_tl": "Dito, ang diin ay unawain ang pangangailangan ng bawat tao ayon sa kanyang partikular na kapansanan — pisikal, sensory, o developmental. Sa paggabay sa taong may visual impairment, gamitin ang malinaw na verbal cues at 'clock position'. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-247", "part": "B", "category": "障害の理解", "level": "medium", "question": "耳（みみ）が聞こえない人（聴覚障害）が、相手（あいて）の手（て）や指（ゆび）の動き、そして口（くち）の形（かたち）を見て、言葉を読み取る（よみとる）コミュニケーション方法を何といいますか。", "options": ["手話と口話（しゅわとこうわ）", "クロックポジション", "筆談（ひつだん）"], "answer": 0, "tip_tl": "Ang paksang ito ay tumatalakay sa disability support — hindi puro limitasyon, kundi pagpapalawak ng kakayahan ng tao. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-248", "part": "B", "category": "障害の理解", "level": "medium", "question": "事故（じこ）や病気（びょうき）が原因（げんいん）で、脳（のう）に傷（きず）がつき、記憶（きおく）がなくなったり、感情（かんじょう）のコントロール（こんとろーる）ができなくなったりする障害を何といいますか。", "options": ["発達障害（はったつしょうがい）", "知的障害（ちてきしょうがい）", "高次脳機能障害（こうじのうきのうしょうがい）"], "answer": 2, "tip_tl": "Ito ay tungkol sa iba't ibang uri ng kapansanan at kung paano suportahan ang kalayaan ng taong may kapansanan. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-249", "part": "B", "category": "こころとからだのしくみ", "level": "medium", "question": "人間の体（からだ）を流れる（ながれる）血液（けつえき）の役割（やくわり）として、最も適切なものはどれですか。", "options": ["ソネットくんのプログラム（ぷろぐらむ）を動かすこと", "筋肉（きんにく）の数を2倍（ばい）に増やす（ふやす）こと", "酸素（さんそ）や栄養（えいよう）を全身（ぜんしん）に運び（はこび）、二酸化炭素（にさんかたんそ）などのゴミを回収（かいしゅう）すること"], "answer": 2, "tip_tl": "Dito ipinapaliwanag ang mekanismo ng katawan (anatomy, physiology) na dapat maintindihan ng bawat care worker. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-250", "part": "B", "category": "こころとからだのしくみ", "level": "medium", "question": "食事（しょくじ）を摂った（とった）後（あと）に、血液（けつえき）の中の糖分（とうぶん・エネルギー）の量（りょう）を示す数値を何といいますか。", "options": ["血圧（けつあつ）", "血糖値（けっとうち）", "脈拍（みゃくはく）"], "answer": 1, "tip_tl": "Ang paksang ito ay batayan ng medikal na kaalaman sa likod ng bawat desisyon sa pangangalaga. Ang pagsubaybay sa blood sugar ay mahalaga lalo na sa mga resident na may diabetes. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-251", "part": "B", "category": "こころとからだのしくみ", "level": "medium", "question": "膵臓（すいぞう）から分泌（ぶんぴつ）され、血糖値（けっとうち）を下げる（さげる）ために働く（はたらく）唯一（ゆいいつ）のホルモン（ほるもん）の名前（なまえ）は何ですか。", "options": ["アドレナリン（あどれなりん）", "成長ホルモン（せいちょうほるもん）", "インスリン（いんすりん）"], "answer": 2, "tip_tl": "Ito ay tungkol sa siyentipikong pag-unawa sa katawan at isip ng tao — mahalaga ito para malaman kung bakit nangyayari ang isang kondisyon. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-252", "part": "B", "category": "こころとからだのしくみ", "level": "medium", "question": "インスリン（いんすりん）の働きが弱く（よわく）なることや、分泌（ぶんぴつ）されなくなることで、血糖値がずっと高くなってしまう高齢者（こうれいしゃ）に多い病気は何ですか。", "options": ["糖尿病（とうにょうびょう）", "胃潰瘍（いかいよう）", "高血圧症（こうけつあつしょう）"], "answer": 0, "tip_tl": "Dito ipinapaliwanag ang mekanismo ng katawan (anatomy, physiology) na dapat maintindihan ng bawat care worker. Sa diabetes, mahalagang bantayan ang antas ng asukal sa dugo at ang pagkain ng resident. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-253", "part": "B", "category": "こころとからだのしくみ", "level": "medium", "question": "人間の心臓（しんぞう）には、血液（けつえき）が逆流（ぎゃくりゅう・反対に流れる）するのを防ぐ（ふせぐ）ための「弁（べん）」があります。心臓にある部屋（へや）の数は全部（ぜんぶ）でいくつですか。", "options": ["2つ（上と下）", "8つ（細かく分かれている）", "4つ（右心房・右心室・左心房・左心室）"], "answer": 2, "tip_tl": "Ang paksang ito ay batayan ng medikal na kaalaman sa likod ng bawat desisyon sa pangangalaga. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},

{"id": "care-255", "part": "B", "category": "こころとからだのしくみ", "level": "medium", "question": "高齢（こうれい）になると、膀胱（ぼうこう・おしっこを溜める袋）の容量（ようりょう）が小さく（ちいさく）なるため、どのような排泄（はいせつ）のトラブルが起こりやすいですか。", "options": ["頻尿（ひんにょう・おしっこの回数（かいすう）が多くなること）", "尿閉（にょうへい・おしっこが全く出ないこと）", "排泄の回数がゼロになること"], "answer": 0, "tip_tl": "Dito ipinapaliwanag ang mekanismo ng katawan (anatomy, physiology) na dapat maintindihan ng bawat care worker. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},

{"id": "care-257", "part": "B", "category": "こころとからだのしくみ", "level": "medium", "question": "自律神経（じりつしんけい）のうち、昼間（ひるま）の活動（かつどう）しているときや、運動（うんどう）しているとき、ストレス（すとれす）を感じて（かんじて）いるときに活発（かっぱつ）になる神経はどれですか。", "options": ["知覚神経（ちかくしんけい）", "運動神経（うんどうしんけい）", "交感神経（こうかんしんけい）"], "answer": 2, "tip_tl": "Ito ay tungkol sa siyentipikong pag-unawa sa katawan at isip ng tao — mahalaga ito para malaman kung bakit nangyayari ang isang kondisyon. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
