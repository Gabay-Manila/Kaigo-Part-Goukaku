{"id": "care-260", "part": "B", "category": "こころとからだのしくみ", "level": "medium", "question": "人間の体（からだ）の骨（ほね）と骨がつながる「関節（かんせつ）」において、長期間（ちょうきかん）動かさない（うごかさない）ままでいると、周りの筋肉や組織が硬くなって関節が動かなくなる現象を何といいますか。", "options": ["関節拘縮（かんせつこうしゅく）", "筋萎縮（きんいしゅく）", "骨粗鬆症（こつそしょうしょう）"], "answer": 0, "tip_tl": "Ito ay tungkol sa siyentipikong pag-unawa sa katawan at isip ng tao — mahalaga ito para malaman kung bakit nangyayari ang isang kondisyon. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-261", "part": "B", "category": "こころとからだのしくみ", "level": "medium", "question": "病気（びょうき）や怪我（けが）でベッドの上で寝たきり（ねたきり）の生活を続けることにより、身体（からだ）の機能（きのう）や筋肉（きんにく）が全体的に衰えて（おとろえて）しまう状態を何といいますか。", "options": ["廃用症候群（はいようしょうこうぐん・生活不活発病）", "ヒートショック（ひーとしょっく）", "認知症（にんちしょう）"], "answer": 0, "tip_tl": "Dito ipinapaliwanag ang mekanismo ng katawan (anatomy, physiology) na dapat maintindihan ng bawat care worker. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-262", "part": "B", "category": "医療的ケア", "level": "medium", "question": "法律（ほうりつ）に基づいて、特定の研修（けんしゅう）を修了（しゅうりょう）した介護職員（かいごしょくいん）が実施（じっし）できる、鼻（はな）や口（くち）、気管カニューレ（きかんかにゅーれ）の内側（うちがわ）から溜まった（たまった）分泌物を吸い取る行為を何といいますか。", "options": ["たんの吸引（きゅういん）", "傷口（きずぐち）の縫合（ほうごう）", "点滴の開始（てんてきのかいし）"], "answer": 0, "tip_tl": "Ang paksang ito ay tumatalakay sa mga limitasyon at responsibilidad ng care worker sa medikal na gawain. Ang pagsuction ng plema ay dapat gawin nang mahinahon, walang labis na presyon. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-263", "part": "B", "category": "医療的ケア", "level": "medium", "question": "「たんの吸引（きゅういん）」や「経管栄養（けいかんえいよう）」を介護職員が実施（じっし）する際、必ず毎回（まいかい）受けなければ（うけねば）ならない、医療（いりょう）の専門家からの指示（しじ）は誰のものですか。", "options": ["施設長の指示", "ケアマネジャーの指示", "医師（いし）の指示（しじ）"], "answer": 2, "tip_tl": "Ito ay tungkol sa medikal na pangangalagang maaaring gawin ng care worker, kasama ang mahigpit na patakaran sa kaligtasan. Ang physician's order ay kinakailangan bago gawin ang ilang medikal na gawain. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-264", "part": "B", "category": "医療的ケア", "level": "medium", "question": "たんの吸引（きゅういん）を行うとき、衛生面（えいせいめん）において最も注意すべき行動（感染対策）として、正しいものはどれですか。", "options": ["吸引（きゅういん）チューブ（カテーテル）の、利用者の体内に入る部分には絶対に手で触れない（ふれない）", "チューブを洗わずに（あらわずに）何度も使い回す（つかいまわす）", "吸引の機械を床（ゆか）に直接置いて使う"], "answer": 0, "tip_tl": "Dito, mahalaga ang tamang pamamaraan at kaligtasan dahil direktang nakaka-apekto ito sa buhay ng resident. Ang infection control (paghuhugas ng kamay, disinfection) ay pangunahing depensa laban sa sakit. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-265", "part": "B", "category": "医療的ケア", "level": "medium", "question": "経管栄養（けいかんえいよう）において、鼻（はな）から胃（い）に向かってチューブ（ちゅーぶ）を通し（とおし）、そこから栄養剤（えいようざい）を注入（ちゅうにゅう）する方法を何といいますか。", "options": ["腸ろう（ちょうろう）", "中心静脈栄養（ちゅうしんじょうみゃくえいよう）", "経鼻経管栄養（けいびけいかんえいよう）"], "answer": 2, "tip_tl": "Ang paksang ito ay tumatalakay sa mga limitasyon at responsibilidad ng care worker sa medikal na gawain. Sa tube feeding, laging suriin ang posisyon ng tubo bago magbigay ng gatas o pagkain. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-266", "part": "B", "category": "医療的ケア", "level": "medium", "question": "経管栄養（けいかんえいよう）の栄養剤（えいようざい）を注入（ちゅうにゅう）する速度（そくど）について、正しいルールはどれですか。", "options": ["滴下（てきか）の様子を見ないで、部屋の鍵を閉めて外に出る", "時間がもったいないので、クランプ（つまみ）を全開にして一気に流し込む", "医師（いし）や看護師（かんごし）から指示された、正しい滴下速度（てきかすくど・ペース）を厳守（げんしゅ）する"], "answer": 2, "tip_tl": "Ito ay tungkol sa medikal na pangangalagang maaaring gawin ng care worker, kasama ang mahigpit na patakaran sa kaligtasan. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-267", "part": "B", "category": "医療的ケア", "level": "medium", "question": "経管栄養（けいかんえいよう）の栄養剤（えいようざい）が胃（い）の中に注入されている間（あいだ）、または注入が終わった後（あと）の30分〜1時間（じかん）程度、利用者の姿勢（しせい）をそのまま保つ（たもつ）最も重要な目的は何ですか。", "options": ["注入（ちゅうにゅう）した栄養剤（えいようざい）が胃から逆流（ぎゃくりゅう）して、喉（のど）に詰まったり誤嚥（ごえん）したりするのを防ぐため", "利用者の体重（たいじゅう）をベッドの上で均等（きんとう）にするため", "衣服（いふく）がシワ（しわ）になるのを引き算して防ぐため"], "answer": 0, "tip_tl": "Dito, mahalaga ang tamang pamamaraan at kaligtasan dahil direktang nakaka-apekto ito sa buhay ng resident. Ang aspiration pneumonia ay maiiwasan sa pamamagitan ng tamang postura habang kumakain. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-268", "part": "B", "category": "医療的ケア", "level": "medium", "question": "たんの吸引（きゅういん）において、吸引をかける（圧力をかける）タイミング（たいみんぐ）として、正しい手順（てじゅん）はどれですか。", "options": ["吸引チューブを利用者の喉（のど）の奥の目的の位置（いち）まで挿入（そうにゅう）した後に、圧力をかけて引き抜きながら吸引する", "チューブを口に入れる（くちにいれる）前から、ずっと最大（さいだい）の圧力をかけ続ける", "チューブを引き抜き終わった（ひきぬきおわった）後に、圧力をかける"], "answer": 0, "tip_tl": "Ang paksang ito ay tumatalakay sa mga limitasyon at responsibilidad ng care worker sa medikal na gawain. Ang pagsuction ng plema ay dapat gawin nang mahinahon, walang labis na presyon. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-269", "part": "B", "category": "医療的ケア", "level": "medium", "question": "医療的（いりょうてき）ケアを実施（じっし）した際、介護職員（かいごしょくいん）が記録（きろく）に書くべき内容として、含まれない（ふくまれない）ものはどれですか。", "options": ["その日の天気（てんき）や介護職の個人的な気分の感想", "栄養剤（えいようざい）の注入量（ちゅうにゅうりょう）と、トラブルの有無（うむ）", "実施中（じっしちゅう）の利用者のバイタルサイン（顔色や呼吸状態）"], "answer": 0, "tip_tl": "Ito ay tungkol sa medikal na pangangalagang maaaring gawin ng care worker, kasama ang mahigpit na patakaran sa kaligtasan. Ang record o dokumentasyon ay dapat batay sa aktwal na katotohanan, hindi opinyon. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-270", "part": "B", "category": "医療的ケア", "level": "medium", "question": "経管栄養（けいかんえいよう）に使用するチューブやボトル（ぼとる）などの器具（きぐ）の片付け（かたづけ）において、衛生的に保つ（たもつ）ための正しい方法はどれですか。", "options": ["使用（しよう）した後はすぐに水洗い（みずあらい）し、指定された消毒液（しょうどくえき）で洗浄した後に乾燥させる", "洗わずに、そのまま次の（つぎの）注入（ちゅうにゅう）まで部屋の机の上に置いておく", "熱湯（ねっとう）の中に丸一日（まるいちにち）浸した（ひたした）ままにして放置する"], "answer": 0, "tip_tl": "Dito, mahalaga ang tamang pamamaraan at kaligtasan dahil direktang nakaka-apekto ito sa buhay ng resident. Ang infection control (paghuhugas ng kamay, disinfection) ay pangunahing depensa laban sa sakit. Ang tamang paglilinis at disinfection ng kagamitan ay proteksyon laban sa impeksyon. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-271", "part": "B", "category": "医療的ケア", "level": "medium", "question": "医療的（いりょうてき）ケアの実施前（じっしまえ）に、介護職員（かいごしょくいん）が利用者の体調（たいちょう）を確認（かくにん）する際、最も注意（ちゅうい）して測定（そくてい）すべきものはどれですか。", "options": ["利用者の部屋（へや）の明るさ（あかるさ）", "体温（たいおん）・血圧（けつあつ）・脈拍（みゃくはく）などのバイタルサイン", "その日の体重（たいじゅう）の増減（ぞうげん）"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa mga limitasyon at responsibilidad ng care worker sa medikal na gawain. Ang assessment ay ang unang hakbang — kalapin ang tamang impormasyon bago magplano. Ang vital signs (temperatura, pulso, presyon) ay unang senyales ng pagbabago sa kalusugan. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-272", "part": "B", "category": "医療的ケア", "level": "medium", "question": "たんの吸引（きゅういん）の機械（きかい）のスイッチ（すいっち）を入れる前に、介護職（かいごしょく）が確認すべき「吸引圧（きゅういんあつ・吸い込む強さ）」のルールはどれですか。", "options": ["医師（いし）や看護師（かんごし）から指示（しじ）された、指定（してい）の圧力（あつりょく）の範囲内（はんいない）になっているかを確認する", "機械（きかい）が壊れる（こわれる）まで最大の圧力に設定（せってい）する", "吸い込む力がゼロ（ぜろ）の状態で使う"], "answer": 0, "tip_tl": "Ito ay tungkol sa medikal na pangangalagang maaaring gawin ng care worker, kasama ang mahigpit na patakaran sa kaligtasan. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-273", "part": "B", "category": "医療的ケア", "level": "medium", "question": "経管栄養（けいかんえいよう）の栄養剤（えいようざい）を準備（じゅんび）するとき、利用者の健康（けんこう）を守るために、介護職が最初（さいしょ）に確認（かくにん）すべき最も重要な項目（こうもく）はどれですか。", "options": ["栄養剤のデザイン（でざいん）が格好良い（かっこいい）か", "栄養剤のパッケージ（ぱっけーじ）に書かれた、利用者の名前（なまえ）と消費期限（しょうひきげん）", "栄養剤の缶（かん）の重さ（おもさ）"], "answer": 1, "tip_tl": "Dito, mahalaga ang tamang pamamaraan at kaligtasan dahil direktang nakaka-apekto ito sa buhay ng resident. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-274", "part": "B", "category": "医療的ケア", "level": "medium", "question": "たんの吸引（きゅういん）チューブを口（くち）や鼻（はな）に挿入（そうにゅう）するとき、利用者の粘膜（ねんまく・体の中）を傷つけないための介護職の正しい操作（そうさ）はどれですか。", "options": ["利用者が嫌がって（いやがって）暴れている（あばれている）ときに無理やり行う", "圧力をかけない（吸い込ませない）状態で、優しく（やさしく）スムーズに挿入する", "チューブを激しく（はげしく）回転（かいてん）させながら押し込む"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa mga limitasyon at responsibilidad ng care worker sa medikal na gawain. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-275", "part": "C", "category": "総合問題", "level": "medium", "question": "【事例（じれい）】Aさん（80歳、女性、要介護3）は、アルツハイマー型認知症（あるつはいまーがたにんちしょう）があり、グループホーム（ぐるーぷほーむ）で暮らしています。最近、夕方（ゆうがた）になると「子供（こども）が待っているから家に帰る」と言って、玄関（げんかん）に向かうことが増えました。このときの介護職（かいごしょく）の対応として、最も適切なものはどれですか。", "options": ["「お子さんはもう大人ですよ」と否定（ひてい）せず、「心配（しんぱい）ですね」と気持ちに共感（きょうかん）してお茶（ちゃ）に誘う", "何も言わずに、Aさんが外（そと）に出ていくのを黙って（だまって）見ている", "玄関の鍵（かぎ）を閉めて、Aさんを部屋（へや）に閉じ込める（とじこめる）"], "answer": 0, "tip_tl": "Ito ay isang case study na pinagsasama ang iba't ibang kaalaman — dapat basahin nang mabuti ang buong sitwasyon bago sumagot. Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Ang sundowning ay ang pagiging balisa ng resident na may dementia sa gabi o dapithapon. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-276", "part": "C", "category": "総合問題", "level": "medium", "question": "【事例（じれい）】Bさん（75歳、男性、要介護2）は、脳卒中（のうそっちゅう）の後遺症（こういしょう）で左片麻痺（ひだりかたまひ）があります。自分でトイレに行きたいという強い希望（きぼう）がありますが、立ち上がる（たちあがる）ときにバランス（ばらんす）を崩しやすい（くずしやすい）状態です。Bさんの自立（じりつ）を支援（しえん）するための介護職の関わりとして、最も適切なものはどれですか。", "options": ["Bさんの右側（健側・けんそく）に手すり（てすり）を配置し、本人が動ける部分を見守り（みまもり）ながら必要なときだけ介助する", "手早く（てばやく）終わらせるために、介護職がBさんを抱き抱えて（だきかかえて）すべてを代わりにやる", "安全（あんぜん）のために、Bさんの希望を無視（むし）して常におむつ（おむつ）の中に排泄してもらう"], "answer": 0, "tip_tl": "Dito, kailangan mong isipin ang buong larawan ng buhay ng resident, hindi lamang isang bahagi ng problema. Ang layunin ay laging suportahan ang kalayaan (independence) ng resident, hindi gawin lahat para sa kanya. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-277", "part": "C", "category": "総合問題", "level": "medium", "question": "【事例（じれい）】Cさん（85歳、女性、要介護4）は、ベッドの上での寝たきり（ねたきり）の生活が長く、自分で寝返り（ねがえり）をうつことができません。皮膚（ひふ）が乾燥（かんそう）しており、お尻（おしり）の骨（ほね）が出っ張っている（でっぱっている）部分が赤くなっています。このとき、床ずれ（とこづれ・褥瘡）の悪化（あっか）を防ぐための介護職の対応として、最も適切なものはどれですか。", "options": ["体圧分散（たいあつぶんさん）マットレスを使い、2時間（じかん）に1回程度の規則的な体位変換（たいいへんかん）を行う", "シーツ（しーつ）を引っ張って（ひっぱって）、Cさんの身体をベッドの上で引きずりながら移動させる", "体位変換の時間の間隔（かんかく）を24時間に1回に引き算して減らす"], "answer": 0, "tip_tl": "Ang tanong na ito ay sumusubok kung paano mo pagsasama-samahin ang iyong kaalaman sa aktwal na sitwasyon. Ang regular na pagpapalit ng posisyon (positioning) ay pumipigil sa bedsore. Ang bedsore (褥瘡) ay maiiwasan sa pamamagitan ng regular na pagbabago ng posisyon. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-278", "part": "C", "category": "総合問題", "level": "medium", "question": "【事例（じれい）】Dさん（78歳、男性、要介護1）は、最近（さいきん）物忘れ（ものわすれ）が気になり始め、「自分は認知症（にんちしょう）になってしまったのではないか」と強い不安（ふあん）を抱えています。おしゃべりが好きだったDさんですが、最近は無口（むくち）になり、部屋（へや）に閉じこもりがちです。このときの介護職のコミュニケーションとして、最も適切なものはどれですか。", "options": ["「気にしすぎですよ」と笑って（わらって）話を終わらせる", "Dさんが話しかけてくるまで、介護職からは一切（いっさい）声をかけない", "Dさんの不安（ふあん）な気持ちを丁寧に聴き（傾聴・けいちょう）、「いつでもお話を聴きますよ」と安心感を伝える"], "answer": 2, "tip_tl": "Ito ay isang case study na pinagsasama ang iba't ibang kaalaman — dapat basahin nang mabuti ang buong sitwasyon bago sumagot. Ang active listening ay ang tunay na pakikinig bago mag-alok ng solusyon. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-279", "part": "C", "category": "総合問題", "level": "medium", "question": "【事例（じれい）】Eさん（82歳、女性、要介護3）は、食べ物を飲み込む（のむ）力が弱くなっており（嚥下障害・えんげしょうがい）、食事（しょくじ）のときに時々（ときどき）激しくむせることがあります。今日の昼食（ちゅうしょく）でお粥（おかゆ）とおかずを食べているときに、急にむせ込み（むせこみ）始めました。このときの介護職の最初の対応として、最も適切なものはどれですか。", "options": ["一度（いちど）食事を止めて、Eさんがあごを引いた（ひいた）前かがみの姿勢（しせい）になっているかを確認し、落ち着くまで見守る", "Eさんのあごを上に強く引き上げて、上を向かせる（うえをむかせる）姿勢にする", "「むせてはダメです」とEさんの背中（せなか）を拳（こぶし）で強く叩く（たたく）"], "answer": 0, "tip_tl": "Dito, kailangan mong isipin ang buong larawan ng buhay ng resident, hindi lamang isang bahagi ng problema. Ang aspiration pneumonia ay maiiwasan sa pamamagitan ng tamang postura habang kumakain. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-280", "part": "C", "category": "総合問題", "level": "medium", "question": "介護の現場（げんば）において、ヒヤリハット（ひやりはっと・大きな事故になりそうになって驚いた出来事）の報告書（ほうこくしょ）を作成（さくせい）する最も重要な目的（もくてき）はどれですか。", "options": ["施設の書類（しょるい）の数を増やして（ふやして）、仕事をしているアピールをするため", "事故（じこ）の原因（げんいん）を分析（ぶんせき）し、チーム（ちーむ）全体で対策（たいさく）を共有（きょうゆう）して、大きな事故を未然（みぜん）に防ぐため", "ミス（みす）をした介護職（かいごしょく）を見つけて、みんなの前で厳しく（きびしく）怒るため"], "answer": 1, "tip_tl": "Ang tanong na ito ay sumusubok kung paano mo pagsasama-samahin ang iyong kaalaman sa aktwal na sitwasyon. Ang pag-uulat sa ibang propesyonal ay dapat malinaw, maikli, at tumpak. Ang risk management ay ang pagiging maagap sa pagsuri ng panganib bago pa ito mangyari. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-281", "part": "C", "category": "総合問題", "level": "medium", "question": "車椅子（くるまいす）の利用者をエレベーター（えれべーたー）に乗せる（のせる）際（さい）の、最も安全（あんぜん）な順番（じゅんばん）と向き（むき）はどれですか。", "options": ["利用者を前向き（まえむき）に乗せて、介護職は外（そと）で待つ", "向きはどちらでもよく、エレベーターのドアにぶつけながら乗せる", "介護職が先（さき）に後ろ向き（うしろむき）で入り、車椅子を後ろ向きに引っ張って（ひっぱって）乗せる"], "answer": 2, "tip_tl": "Ito ay isang case study na pinagsasama ang iba't ibang kaalaman — dapat basahin nang mabuti ang buong sitwasyon bago sumagot. Laging suriin ang brake at posisyon ng wheelchair bago at pagkatapos gamitin. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-282", "part": "C", "category": "総合問題", "level": "medium", "question": "高齢者の転倒（てんとう・ころぶこと）を防ぐ（ふせぐ）ための、施設（しせつ）の環境整え（かんきょうととのえ）として、最も適切なものはどれですか。", "options": ["床にワックス（わっくす）を大量（たいりょう）に塗って（ぬって）ツルツルにする", "廊下（ろうか）や部屋（へや）の床（ゆか）にある段差（だんさ）をなくし、コード（こーど）などの障害物（しょうがいぶつ）を引き算（整理）する", "部屋の電気（でんき）をすべて消して（けして）暗くしておく"], "answer": 1, "tip_tl": "Dito, kailangan mong isipin ang buong larawan ng buhay ng resident, hindi lamang isang bahagi ng problema. Ang pag-iwas sa pagkahulog (fall prevention) ay isa sa pangunahing priyoridad sa ligtas na kapaligiran. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-283", "part": "C", "category": "総合問題", "level": "medium", "question": "視覚障害（しかくしょうがい）のある利用者が、初めて（はじめて）入る食堂（しょくどう）のテーブル（てーぶる）に座った（すわった）とき、介護職が行う環境（かんきょう）の言葉掛け（ことばかけ）として、最も適切なものはどれですか。", "options": ["「あそこに色々（いろいろ）置いて（おいて）ありますから、勝手に使ってください」と言う", "「正面（しょうめん）にお茶（ちゃ）、右側にスプーン（すぷーん）があります」と、クロックポジションなどを使い具体的に伝える", "何も言わずに利用者の手を無理やり引っ張って、お茶のコップを触らせる"], "answer": 1, "tip_tl": "Ang tanong na ito ay sumusubok kung paano mo pagsasama-samahin ang iyong kaalaman sa aktwal na sitwasyon. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-284", "part": "C", "category": "総合問題", "level": "medium", "question": "感染症（かんせんしょう・インフルエンザなど）の拡大（かくだい）を防ぐ（ふせぐ）ために、介護職が施設（しせつ）で行う基本（きほん）の行動として、正しいものはどれですか。", "options": ["感染症にかかった利用者を、食堂（しょくどう）の真ん中（まんなか）の席（せき）に座らせる", "手洗いの時間を引き算して、洗わずに（あらわずに）次の人の部屋へ行く", "一人のケア（けあ）が終わる（おわる）たびに、必ず（かならず）丁寧（ていねい）な手洗い（てあらい）や手指消毒（しゅししょうどく）を行う"], "answer": 2, "tip_tl": "Ito ay isang case study na pinagsasama ang iba't ibang kaalaman — dapat basahin nang mabuti ang buong sitwasyon bago sumagot. Ang infection control (paghuhugas ng kamay, disinfection) ay pangunahing depensa laban sa sakit. Ang paghuhugas ng kamay ay simple pero pinakamabisang paraan para maiwasan ang impeksyon. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-285", "part": "C", "category": "総合問題", "level": "medium", "question": "認知症（にんちしょう）の利用者が、夜間（やかん）に何度も（なんども）起きて（おきて）廊下（ろうか）を歩き回る（あるきまわる）ときの介護職の対応として、最も適切なものはどれですか。", "options": ["歩けないように、ベッド（べっど）に紐（ひも）で強く縛り付ける（しばりつける）", "「夜（よる）だから寝なさい（ねなさい）」と大声（おおごえ）で怒って部屋に連れ戻す", "体調（たいちょう）や排泄（はいせつ）の気持ちを確認し、不安（ふあん）に寄り添って（よりそって）優しく声をかける"], "answer": 2, "tip_tl": "Dito, kailangan mong isipin ang buong larawan ng buhay ng resident, hindi lamang isang bahagi ng problema. Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Ang wandering (paggala) ay karaniwang tanda ng pangangailangan o pagkalito, hindi dapat pigilan agad kundi unawain. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-286", "part": "C", "category": "総合問題", "level": "medium", "question": "【事例（じれい）】Fさん（88歳、男性、要介護2）は、一人暮らし（ひとりぐらし）をしていますが、最近（さいきん）ご飯（ごはん）を作る（つくる）のが難しく（むずかしく）なり、栄養（えいよう）のバランス（ばらんす）が偏って（かたよって）います。Fさんが自宅（じたく）での生活（せいかつ）を続けるために、ケアマネジャーが提案（ていあん）する介護保険（かいごほけん）サービスとして、最も適切なものはどれですか。", "options": ["ご飯を食べない（たべない）で我慢（がまん）するように言う", "訪問介護（ほうもんかいご・ホームヘルプ）による調理（ちょうり）の支援（しえん）や、配食（はいしょく）サービスを利用する", "Fさんの親戚（しんせき）を無理やり家に住まわせてご飯を作らせる"], "answer": 1, "tip_tl": "Ang tanong na ito ay sumusubok kung paano mo pagsasama-samahin ang iyong kaalaman sa aktwal na sitwasyon. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-287", "part": "C", "category": "総合問題", "level": "medium", "question": "介護の仕事（しごと）において、利用者（りようしゃ）の個人情報（こじんじょうほう）が乗った（のった）書類（しょるい）を、施設（しせつ）の外（そと）に持ち出す（もちだす）ときの正しいルールはどれですか。", "options": ["原則（げんそく）として持ち出しは禁止（きんし）であり、必要（ひつよう）な場合は必ず管理者の許可（きょか）を得る（える）", "自分のカバン（かばん）に入れて、勝手に持って帰ってよい", "近所（きんじょ）の人に見せるために持ち出す"], "answer": 0, "tip_tl": "Ito ay isang case study na pinagsasama ang iba't ibang kaalaman — dapat basahin nang mabuti ang buong sitwasyon bago sumagot. Ang confidentiality o pagiging kompidensyal ng impormasyon ay tungkulin ng bawat propesyonal. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-288", "part": "A", "category": "人間の尊厳と自立", "level": "medium", "question": "利用者が自分（じぶん）の部屋（へや）で好きな音楽（おんがく）を聴いたり（きいたり）、趣味（しゅみ）の時間を過ごしたり（すごしたり）する空間（くうかん）の尊厳を守るために、最も大切な考え方はどれですか。", "options": ["24時間の監視（かんし・みまもり）", "集団（しゅうだん）の一律管理（いちりつかんり）", "プライベート空間（ぷらいべーとくうかん・私的空間）の確保（かくほ）"], "answer": 2, "tip_tl": "Dito, ang pinakamahalaga ay tratuhin ang resident bilang tao na may sariling boses at karapatan, hindi bilang isang gawain lamang. Ang dignidad ng resident ang dapat unahin sa bawat desisyon. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-289", "part": "A", "category": "社会の理解", "level": "medium", "question": "介護保険（かいごほけん）のサービスを受ける（うける）ための「要介護認定（ようかいごにんてい）」において、認定（にんてい）の有効期限（ゆうこうきげん）が切れる（きれる）前に、続けてサービスを使うために行う申請（しんせい）を何といいますか。", "options": ["更新申請（こうしんしんせい）", "新規申請（しんきしんせい）", "不服申し立て（ふふくもうしたて）"], "answer": 0, "tip_tl": "Ito ay tungkol sa mga institusyon at batas na bumubuo sa social safety net ng Japan para sa mga nangangailangan ng pangangalaga. Ang long-term care insurance ay ang public na seguro na sumasagot sa gastos ng pangangalaga sa Japan. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-290", "part": "A", "category": "介護の基本", "level": "medium", "question": "介護福祉士（かいごふくしし）が仕事（しごと）をするとき、自分の体（からだ）の安全（あんぜん）だけでなく、利用者の安全を同時に守る（まもる）ためのリスク管理（りすくかんり）の基本はどれですか。", "options": ["自分の勘（かん）だけで動くこと", "事故が起きて（おきて）から考えること", "事故（じこ）の予測（よそく・未然防止・みぜんぼうし）と環境（かんきょう）の整備（せいび）"], "answer": 2, "tip_tl": "Isa itong pangunahing prinsipyo ng propesyonal na caregiving — ang batayan bago pa man matutunan ang teknikal na kasanayan. Ang risk management ay ang pagiging maagap sa pagsuri ng panganib bago pa ito mangyari. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-291", "part": "A", "category": "コミュニケーション技術", "level": "medium", "question": "認知症（にんちしょう）の利用者が、話の途中で（とちゅうで）言葉（ことば）に詰まったり（つまったり）、沈黙（ちんもく・だまりこむ）したりしたときの介護職（かいごしょく）の態度として、最も適切なものはどれですか。", "options": ["介護職が勝手に話を遮って（さえぎって）別の話題（わだい）に変える", "「早く話してください」と急かす（せかす）", "本人が話し出す（はなしだす）まで、急かさず（せかさず）に優しく（やさしく）待つ（まつ）"], "answer": 2, "tip_tl": "Ito ay tungkol sa 'keicho' o active listening — kung paano makinig at tumugon nang may empatiya sa resident. Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Mahalaga ang malinaw at magalang na komunikasyon sa bawat interaksyon. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-292", "part": "A", "category": "生活支援技術", "level": "medium", "question": "車椅子（くるまいす）の利用者をベッドから移乗（いじょ）させ、食堂（しょくどう）まで案内（あんない）した後の、車椅子の正しい状態（じょうたい）はどれですか。", "options": ["ブレーキをかけずに、いつでも動く状態にしておく", "フットサポート（足台）を下げた（さげた）まま、足を地面に引きずらせる", "目的の席（せき）についたら、必ず（かならず）車椅子のブレーキ（ぶれーき）をしっかりとかける"], "answer": 2, "tip_tl": "Ito ay tungkol sa aktwal na kilos-kamay sa pag-aalaga — ligtas, tama, at magalang sa bawat hakbang. Laging suriin ang brake at posisyon ng wheelchair bago at pagkatapos gamitin. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-293", "part": "A", "category": "介護課程", "level": "medium", "question": "介護計画（かいごけいかく）の実施（じっし）において、計画の内容（ないよう）をチーム（ちーむ）の全員（ぜんいん）が同じ（おなじ）手順（てじゅん）で行う（おこなう）ために作成（さくせい）する、具体的な手順書を何といいますか。", "options": ["介護手順書（かいごてじゅんしょ・マニュアル）", "勤務表（きんむひょう）", "業務命令書（ぎょうむめいれいしょ）"], "answer": 0, "tip_tl": "Ito ay bahagi ng 'care process' — ang sistematikong paraan ng pagpaplano ng pangangalaga base sa aktwal na pangangailangan ng resident. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-294", "part": "B", "category": "発達と老化の理解", "level": "medium", "question": "高齢（こうれい）になると、感染症（かんせんしょう・肺炎や尿路感染など）にかかったときでも、若者のように熱（ねつ）が激しく（はげしく）上がらないことがあります。この原因（げんいん）となる身体の変化はどれですか。", "options": ["骨（ほね）の強度の向上", "基礎代謝（きそたいしゃ）の急激な向上", "免疫機能（めんえききのう・抵抗力・ていこうりょく）や体温調節（たいおんちょうせつ）の低下"], "answer": 2, "tip_tl": "Dito ipinapaliwanag kung anong mga pagbabago sa aging process ang dapat asahan at unawain ng care worker. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-295", "part": "B", "category": "認知症の理解", "level": "medium", "question": "アルツハイマー型認知症（あるつはいまーがたにんちしょう）の利用者が、自分の洋服（ようふく）のボタン（ぼたん）を正しく（ただしく）留める（とめる）ことができなくなる中核症状（ちゅうかくしょうじょう）を何といいますか。", "options": ["失行（しっこう・運動機能はあるのに動作ができない）", "失認（しつにん）", "失語（しつご）"], "answer": 0, "tip_tl": "Ang paksang ito ay tumatalakay sa iba't ibang uri ng dementia at ang epekto nito sa pang-araw-araw na buhay ng resident. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-296", "part": "B", "category": "障害の理解", "level": "medium", "question": "脳性麻痺（のうせいまひ）や脳卒中（のうそっちゅう）の後遺症（こういしょう）などにより、手（て）や足（あし）の自由（じゆう）な動き（うごき）が難しく（むずかしく）なる身体障害（しんたいしょうがい）の区分（くぶん）を何といいますか。", "options": ["肢体不自由（したいふじゆう）", "内部障害（ないぶしょうがい）", "視覚障害（しかくしょうがい）"], "answer": 0, "tip_tl": "Ito ay tungkol sa iba't ibang uri ng kapansanan at kung paano suportahan ang kalayaan ng taong may kapansanan. Ang pagtingin sa kapansanan ay dapat nakabatay sa kakayahan ng tao, hindi sa limitasyon lamang. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-297", "part": "B", "category": "こころとからだのしくみ", "level": "medium", "question": "人間（にんげん）が食べ物（たべもの）の味（あじ）を感じる（かんじる）ための舌（した）にある小さな組織（そしき）を何といいますか。高齢（こうれい）になると、これが減ることで味が薄く（うすく）感じられるようになります。", "options": ["筋肉（きんにく）", "細胞膜（さいぼうまく）", "味蕾（みらい）"], "answer": 2, "tip_tl": "Dito ipinapaliwanag ang mekanismo ng katawan (anatomy, physiology) na dapat maintindihan ng bawat care worker. Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-298", "part": "B", "category": "医療的ケア", "level": "medium", "question": "介護職員（かいごしょくいん）が実施（じっし）する経管栄養（けいかんえいよう）の準備（じゅんび）において、栄養剤（えいようざい）が冷た（つめた）すぎるまま注入（ちゅうにゅう）すると利用者に起こりやすい体調のトラブルはどれですか。", "options": ["血圧（けつあつ）の急激な上昇", "下痢（げり）や腹痛（ふくつう）", "頭痛（ずつう）"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa mga limitasyon at responsibilidad ng care worker sa medikal na gawain. Sa tube feeding, laging suriin ang posisyon ng tubo bago magbigay ng gatas o pagkain. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Katamtaman ang hirap nito — magiging kumpiyansa ka pag naulit-ulit mong nabasa."},
{"id": "care-299", "part": "C", "category": "総合問題", "level": "medium", "question": "介護の現場（げんば）で、事故（じこ）や体調の変化（へんか）が発生（はっせい）した際、看護師（かんごし）や医師（いし）などの他職種（たしょくしゅ）に状況（じょうきょう）を伝える（つたえる）報告（ほうこく）の基本（きほん）として、最も適切なものはどれですか。", "options": ["自分の主観（しゅかん・感想）を長々と話す", "5W1H（いつ・どこで・だれが・なにを・なぜ・どのように）を意識して、事実を正確に伝える", "時間が経って（たって）から適当に報告する"], "answer": 1, "tip_tl": "Ito ay isang case study na pinagsasama ang iba't ibang kaalaman — dapat basahin nang mabuti ang buong sitwasyon bago sumagot. Mahalaga ang malinaw at magalang na komunikasyon sa bawat interaksyon. Ang pag-uulat sa ibang propesyonal ay dapat malinaw, maikli, at tumpak. Karaniwang lumalabas ang ganitong tanong sa exam, kaya sulit balikan ito."},
{"id": "care-300", "part": "A", "category": "生活支援技術", "level": "medium", "question": "ベッドの上で寝たきり（ねたきり）の利用者の衣服（いふく）を着替える（きがえる）際、介護職（かいごしょく）が身体の摩擦（まさつ）を減らし（へらし）、スムーズ（すみーず）に脱ぎ着（ぬぎき）させるための正しい手順はどれですか。", "options": ["ハサミ（はさみ）を使って服を毎回（まいかい）切り刻む（きりきざむ）", "衣服（いふく）を力任せ（ちからまかせ）に上へ引っ張り（ひっぱり）引きずる", "利用者の身体を横向き（よこむき）にしながら、シーツと擦れないように優しく服をたぐり寄せて着脱する"], "answer": 2, "tip_tl": "Dito, ang diin ay sa tamang paraan ng pagtulong sa resident habang pinapanatili ang kanilang natitirang kakayahan (remaining ability). Bagay itong dapat paulit-ulit na balikan habang nag-aaral."},
{"id": "care-301", "part": "A", "category": "人間の尊厳と自立", "level": "hard", "question": "日常生活自立支援事業（にちじょうせいかつじりつしえんじぎょう）において、判断能力（はんだんのうりょく）が不十分（ふじゅうぶん）な高齢者（こうれいしゃ）の権利擁護（けんりようご）のため、福祉（ふくし）サービスの利用手続き（てつづき）や日常的な金銭管理（きんせんかんり）を代行（だいこう）する専門職（せんもんしょく）は誰ですか。", "options": ["専門員（せんもんいん）および生活支援員（せいかつしえんいん）", "介護福祉士", "社会福祉主事（しゃかいふくししゅじ）"], "answer": 0, "tip_tl": "Ang pangunahing prinsipyo rito ay 'jiritsu shien' — suportahan ang kalayaan at pagpapasya ng resident sa kanyang sariling buhay. Ang rights protection ay ang proteksyon ng karapatan ng mahihinang miyembro ng lipunan. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-302", "part": "A", "category": "人間の尊厳と自立", "level": "hard", "question": "利用者の意思（いし）決定（けってい）を支援（しえん）するパターナリズム（ぱたーなりずむ）の否定（ひてい）と自立（じりつ）の尊重（そんちょう）において、介護職（かいごしょく）が最も戒める（いましめる）べき態度はどれですか。", "options": ["選択肢（せんたくし）を多く提示（ていじ）して選んでもらうこと", "専門職（せんもんか）の価値観（かちかん）で「これが本人のためになる」と決めつける（きめつける）こと", "本人の小さな意向（いこう）を丁寧に傾聴（けいちょう）すること"], "answer": 1, "tip_tl": "Ang tema dito ay ang paggalang sa dignidad ng resident at ang kanyang karapatang magpasya para sa sarili. Igalang ang karapatan ng resident na magpasya para sa sarili niya. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-303", "part": "A", "category": "人間の尊厳と自立", "level": "hard", "question": "終末期（しゅうまつき・看取り）の介護において、本人の意識（いしき）が混濁（こんだく）する前に、望む医療（いりょう）やケアについてあらかじめ書面（しょめん）で示す意思表明（いしひょうめい）を何といいますか。", "options": ["リビングウィル（りびんぐうぃる・生前の意思表明）", "成年後見契約", "ケアプラン"], "answer": 0, "tip_tl": "Dito, ang pinakamahalaga ay tratuhin ang resident bilang tao na may sariling boses at karapatan, hindi bilang isang gawain lamang. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-304", "part": "A", "category": "人間の尊厳と自立", "level": "hard", "question": "精神的（せいしんてき）な虐待（ぎゃくたい）や、介護・世話（せわ）を放棄（ほうき）するネグレクト（ねぐれくと）が利用者に与える（あたえる）心理的（しんりてき）な影響（えいきょう）として、最も正しいものはどれですか。", "options": ["自己に体する無価値観（むかちかん・諦め）や激しい不安（ふあん）を引き起こす", "筋力（きんりょく）が一瞬（いっしゅん）で向上する", "言語（げんご）の能力が若者と同じレベルになる"], "answer": 0, "tip_tl": "Ang pangunahing prinsipyo rito ay 'jiritsu shien' — suportahan ang kalayaan at pagpapasya ng resident sa kanyang sariling buhay. Mahigpit na ipinagbabawal ang anumang uri ng abuso sa pag-aalaga. Ang elder abuse ay may obligasyong ireport kaagad ayon sa batas. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-305", "part": "A", "category": "人間の尊厳と自立", "level": "hard", "question": "施設（しせつ）の都合（つごう）による集団管理（しゅうだんかんり）介護を引き算（排除）し、利用者がこれまでの地域（ちいき）での暮らしを継続（けいづく）できるよう、10人程度のグループ（ぐるーぷ）で生活を支える手法は何ですか。", "options": ["ユニットケア（ゆにっとけあ・個別ケア）", "措置制度（そちせいど）", "完全隔離（かんぜんかくり）介護"], "answer": 0, "tip_tl": "Ang tema dito ay ang paggalang sa dignidad ng resident at ang kanyang karapatang magpasya para sa sarili. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-306", "part": "A", "category": "人間の尊厳と自立", "level": "hard", "question": "障害者（しょうがいしゃ）差別（さべつ）解消法（かいしょうほう）において、障害がある人から「バリア（壁）をなくしてほしい」と意思表明があった際、会社（かいしゃ）や施設に義務（ぎむ）づけられている対応は何ですか。", "options": ["合理的配慮（ごうりてきはいょ）の提供（ていきょう）", "施設の（しせつの）ルールの厳格化", "一律の（いちりつの）サービスの拒否"], "answer": 0, "tip_tl": "Dito, ang pinakamahalaga ay tratuhin ang resident bilang tao na may sariling boses at karapatan, hindi bilang isang gawain lamang. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-307", "part": "A", "category": "社会の理解", "level": "hard", "question": "介護保険法（かいごほけんほう）第1条（じょう）において、この法律（ほうりつ）の目的（もくてき）として規定（きてい）されている最も根本（こんぽん）の理念（りねん）はどれですか。", "options": ["要介護状態（ようかいごじょうたい）になっても、国民（こくみん）が尊厳（そんげん）を保持（ほじ）し、自立した日常生活を営む（いとなむ）こと", "すべての高齢者を大きな施設（しせつ）に集めて管理すること", "医療（いりょう）の権限（けんげん）を介護職にすべて移すこと"], "answer": 0, "tip_tl": "Ito ay tungkol sa mga institusyon at batas na bumubuo sa social safety net ng Japan para sa mga nangangailangan ng pangangalaga. Ang dignidad ng resident ang dapat unahin sa bawat desisyon. Ang long-term care insurance ay ang public na seguro na sumasagot sa gastos ng pangangalaga sa Japan. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-308", "part": "A", "category": "社会の理解", "level": "hard", "question": "介護保険制度（かいごほけんせいど）の「苦情（くじょう）処理（しょり）業務（ぎょうむ）」を行い、サービス事業者（じぎょうしゃ）への調査（ちょうさ）や指導（しどう）の権限を持つ機関（きかん）はどこですか。", "options": ["近くの保健所（ほけんじょ）", "厚生労働省（こうせいろうどうしょう）の出先機関", "国民健康保険団体連合会（国保連・こくほれん）"], "answer": 2, "tip_tl": "Ang paksang ito ay tungkol sa mga batas at sistema ng lipunan (long-term care insurance, welfare programs) na sumusuporta sa pangangalaga sa Japan. Ang long-term care insurance ay ang public na seguro na sumasagot sa gastos ng pangangalaga sa Japan. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-309", "part": "A", "category": "社会の理解", "level": "hard", "question": "介護保険（かいごほけん）の財政（ざいげん・お金）がピンチ（赤字）になったときのために、国（くに）や都道府県（とどうふけん）がお金を出し合って（だしあって）財政を安定させるための基金（ききん）を何といいますか。", "options": ["財政安定化基金（ざいせいあんていかききん）", "社会福祉協議会（しゃかいふくしきょうぎかい）", "国民年金基金（こくみんねんきんききん）"], "answer": 0, "tip_tl": "Kailangang maintindihan dito kung paano gumagana ang sistema ng lipunan at seguro na sumusuklob sa mga matatanda at PWD. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-310", "part": "A", "category": "社会の理解", "level": "hard", "question": "認知症（にんちしょう）の高齢者（こうれいしゃ）が、一人で外出（がいしゅつ）して線路（せんろ）に入り、電車（でんしゃ）を止めてしまった事例（じれい）において、家族や本人の法的（ほうてき）な損害賠償（そんがいばいしょう）の負担を減らす（へらす）ために地域で導入（どうにゅう）が進んでいる制度は何ですか。", "options": ["成年後見制度（せいねんこうけんせいど）", "自立支援医療制度（じりつしえんいりょうせいど）", "個人賠償責任保険（こじんばいしょうせきにんほけん・地域補償制度）"], "answer": 2, "tip_tl": "Ito ay tungkol sa mga institusyon at batas na bumubuo sa social safety net ng Japan para sa mga nangangailangan ng pangangalaga. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-311", "part": "A", "category": "社会の理解", "level": "hard", "question": "障害者（しょうがいしゃ）総合（そうごう）支援法（しえんほう）において、サービスの必要性（ひつようせい）を明確（めいかく）にするために、障害の度合い（どあい）を80以上の項目で調べる判定（はんてい）を何といいますか。", "options": ["障害支援区分（しょうがいしえんくぶん・1〜6の段階）", "要介護度（ようかいごど・1〜5の段階）", "知能指数（ちのうしすう・IQ）"], "answer": 0, "tip_tl": "Ang paksang ito ay tungkol sa mga batas at sistema ng lipunan (long-term care insurance, welfare programs) na sumusuporta sa pangangalaga sa Japan. Ang assessment ay ang unang hakbang — kalapin ang tamang impormasyon bago magplano. Ang pagtingin sa kapansanan ay dapat nakabatay sa kakayahan ng tao, hindi sa limitasyon lamang. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-312", "part": "A", "category": "社会の理解", "level": "hard", "question": "労働（ろうどう）基準法（きじゅんほう）において、介護職（かいごしょく）が夜勤（やきん・夜の仕事）を行った際（さい）に、会社が支払う義務（ぎむ）がある給料（きゅうりょう）の上乗せ（うわのせ）の手当（てあて）を何といいますか。", "options": ["ボランティア手当", "深夜手当（しんやてあて・深夜業の割増賃金）", "役職手当（やくしょくてあて）"], "answer": 1, "tip_tl": "Kailangang maintindihan dito kung paano gumagana ang sistema ng lipunan at seguro na sumusuklob sa mga matatanda at PWD. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-313", "part": "A", "category": "介護の基本", "level": "hard", "question": "介護福祉士（かいごふくしし）が、他の医療（いりょう）や福祉の専門職と連携（れんけい）する際、お互い（おたがい）の専門性を認め合い（みとめあい）、対等（たいとう）な立場で議論（ぎろん）を行うチームのあり方を何といいますか。", "options": ["水平的連携（すいへいてきれんけい・トランスディシプリナリー）", "多職種（たしょくしゅ）孤立主義", "専門職（せんもんか）独裁（どくさい）主義"], "answer": 0, "tip_tl": "Dito nakabatay ang pundasyon ng propesyon — kung paano dapat kumilos ang isang responsableng care worker. Ang team work sa pagitan ng iba't ibang propesyonal ay mahalaga para sa kabuuang kalidad ng pangangalaga. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-314", "part": "A", "category": "介護の基本", "level": "hard", "question": "利用者が「自分（じぶん）の力で最期（さいご）まで自宅（じたく）で過ごしたい」という強いニーズ（にーず）を持つとき、介護福祉士が「安全（あんぜん）」と「本人の自己決定（じこけってい）」のどちらを優先（ゆうせん）すべきか悩む（なやむ）倫理的なジレンマを何といいますか。", "options": ["倫理的ジレンマ（りんりてきじれんま・安全と自由の相克）", "管理（かんり）効率の低下", "自己決定（じこけってい）の完全な無視"], "answer": 0, "tip_tl": "Isa itong pangunahing prinsipyo ng propesyonal na caregiving — ang batayan bago pa man matutunan ang teknikal na kasanayan. Bigyang-diin ang kalayaan (autonomy) ng resident sa sarili niyang pagpapasya. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-315", "part": "A", "category": "介護の基本", "level": "hard", "question": "介護（かいご）の現場（げんば）で、事故（じこ）が起きた（おきた）ときに、個人のミス（ミス）を責める（せめる）のではなく、システム（配管）の欠陥（けっかん）を分析して対策を立てる安全管理（あんぜんかんり）の考え方はどれですか。", "options": ["エラーマネジメント（えらーまねじめんと・システムアプローチ）", "個人（こじん）責任の徹底追及", "事故（じこ）の完全放置（ほうち）"], "answer": 0, "tip_tl": "Ito ay tungkol sa saligang tuntunin ng trabaho ng isang care worker, mula sa etika hanggang sa saklaw ng gawain. Ang risk management ay ang pagiging maagap sa pagsuri ng panganib bago pa ito mangyari. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-316", "part": "A", "category": "介護の基本", "level": "hard", "question": "身体拘束（しんたいこうそく）が例（れい）外（がい）として認（みと）められる「緊（きん）急（きゅう）やむを得（え）ない場（ば）合（ごう）」において、手（て）続き（つづき）として必ずスプレッドシート（記録）に残さなければ（のこさねば）ならない法的な義務（ぎむ）項目に含まれないものはどれですか。", "options": ["介（かい）護（ご）職（しょく）の個（こ）人（じん）的な感（かん）想（そう）や文（もん）句（く）の記録（きろく）", "本（ほん）人（にん）や家（か）族（ぞく）への「説（せつ）明（めい）」の内容", "身体拘束をしなければならなかった具体的な「理（り）由（ゆう）」"], "answer": 0, "tip_tl": "Dito nakabatay ang pundasyon ng propesyon — kung paano dapat kumilos ang isang responsableng care worker. Ang record o dokumentasyon ay dapat batay sa aktwal na katotohanan, hindi opinyon. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-317", "part": "A", "category": "介護の基本", "level": "hard", "question": "利用者の自尊心（じそんしん）や自己効力感（じここうりょくかん）を高めるため、介護職が指示（しじ）を出す側（がわ）に立つパターナリズムを引き算（排除）し、本人の潜在的な力を引き出すアプローチを何といいますか。", "options": ["パターナリズム（支配的介護）", "エンパワメントアプローチ（えんぱわめんとあぷろーち）", "医療（いりょう）優先アプローチ"], "answer": 1, "tip_tl": "Isa itong pangunahing prinsipyo ng propesyonal na caregiving — ang batayan bago pa man matutunan ang teknikal na kasanayan. Ang empowerment ay ibigay sa resident ang tamang tool para magawa niya ang gusto niyang gawin. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-318", "part": "A", "category": "介護の基本", "level": "hard", "question": "ICF（国際生活機能分類）において、病気（びょうき）や高齢（こうれい）による身体の変化（へんか）といった客観的事実ではなく、本人のこれまでの「人生の歴史（ライフヒストリー）」や「価値観（かちかん）」が分類される要素はどれですか。", "options": ["個人因子（こじんいんし）", "心身機能（しんしんきのう）", "参加（さんか）"], "answer": 0, "tip_tl": "Ito ay tungkol sa saligang tuntunin ng trabaho ng isang care worker, mula sa etika hanggang sa saklaw ng gawain. Ang ICF ay isang paraan ng pagtingin sa buhay ng tao nang holistiko — hindi lamang ang sakit, kundi buong buhay. Ang personal factors ay ang mga bagay na personal sa resident mismo, tulad ng edad, kasarian, o pananaw sa buhay. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-319", "part": "A", "category": "コミュニケーション技術", "level": "hard", "question": "認知症（にんちしょう）の利用者が激しい妄想（もうそう・物取られ妄想など）を語る（かたる）とき、介護職が「嘘（うそ）の同意（どうい）」をするのではなく、本人が感じている「不安（ふあん）」や「焦り」の感情（かんじょう）そのものに焦点を当てて共感する高度な技法を何といいますか。", "options": ["行動分析（こうどうぶんせき）", "説得（せっとく）技術", "バリデーション（ばりてーしょん・感情の受容）"], "answer": 2, "tip_tl": "Dito tinuturo kung paano magpahayag ng suporta sa pamamagitan ng salita, ekspresyon, at galaw ng katawan. Ang validation therapy ay ang pagkilala sa damdamin ng resident kahit hindi tugma sa realidad. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-320", "part": "A", "category": "コミュニケーション技術", "level": "hard", "question": "コミュニケーションにおいて、自分の表情（ひじょう）や態度（たいど）が相手にどのような影響（えいきょう）を与えているかを客観的に分析し、専門職として適切なコントロールを行う自己知覚のプロセスを何といいますか。", "options": ["主観（しゅかん）の押し付け", "他者否定（たしゃひてい）", "自己覚知（じこかくち）"], "answer": 2, "tip_tl": "Mahalaga rito ang paraan ng pakikipag-usap sa resident, lalo na sa pagpapakita ng tunay na pagmamalasakit at pang-unawa. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-321", "part": "A", "category": "コミュニケーション技術", "level": "hard", "question": "重度（じゅうど）の認知症や、言葉（ことば）を失った（うしなった）終末期（しゅうまつき）の利用者に対して、呼吸（こきゅう）のペースを合わせたり、優しく触れたり（ふれたり）することで、言葉を超えて安心感を伝える非言語コミュニケーションの技術を何といいますか。", "options": ["環境（かんきょう）管理", "ユマニチュード（ゆまにちゅーど・絆のケア）", "行動（こうどう）修正"], "answer": 1, "tip_tl": "Ito ay tungkol sa 'keicho' o active listening — kung paano makinig at tumugon nang may empatiya sa resident. Ang di-berbal na senyales — ekspresyon ng mukha, galaw — ay kadalasang mas nagsasabi kaysa salita. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-322", "part": "A", "category": "コミュニケーション技術", "level": "hard", "question": "会議（かいぎ・カンファレンス）の場（ば）において、チームのメンバー全員が役職（やくしょく）の上下に関わらず、利用者の生活ニーズについて自由に意見を発言（はつげん）できる、心理的な安全の環境を何といいますか。", "options": ["心理的安全性（しんりてきあんぜんせい）", "命令系統（めいれいけいとう）の絶対化", "縦割り（たてわり）関係"], "answer": 0, "tip_tl": "Dito tinuturo kung paano magpahayag ng suporta sa pamamagitan ng salita, ekspresyon, at galaw ng katawan. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-323", "part": "A", "category": "コミュニケーション技術", "level": "hard", "question": "家族（かぞく）が利用者の介護負担（かいごふたん）によって精神的に追い詰められ（おいつめられ）、介護職に対して激しいクレーム（文句）を言うとき、介護職が感情的に反論（はんろん）せず、家族の背後（はいご）にあるレスパイト（休息）のニーズを分析する技術を何といいますか。", "options": ["家族（かぞく）アセスメント（課題分析）", "主観（しゅかん）のぶつかり合い", "法的（ほうてき）措置の検討"], "answer": 0, "tip_tl": "Mahalaga rito ang paraan ng pakikipag-usap sa resident, lalo na sa pagpapakita ng tunay na pagmamalasakit at pang-unawa. Ang assessment ay ang unang hakbang — kalapin ang tamang impormasyon bago magplano. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-324", "part": "A", "category": "コミュニケーション技術", "level": "hard", "question": "脳の特定の傷（きず）により、目の前の空間（くうかん）の左側（ひだりがわ）にある食べ物や障害物に全く気づくことができなくなる、高次脳機能障害（こうじのうきのうしょうがい）特有の症状を何といいますか。", "options": ["失語症（しつごしょう）", "失行（しっこう）", "半側空間無視（はんそくくうかんむし）"], "answer": 2, "tip_tl": "Ito ay tungkol sa 'keicho' o active listening — kung paano makinig at tumugon nang may empatiya sa resident. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-325", "part": "A", "category": "生活支援技術", "level": "hard", "question": "ベッドから車椅子（くるまいす）へ移乗（いじょ）する際、利用者の足が床（ゆか）にしっかりと接地（せっち）していない状態で立ち上がらせようとしたときに発生する、最も危険なリスクはどれですか。", "options": ["車椅子の重量（じゅうりょう）が一瞬で2倍になるリスク", "ソネットくんの溶接（ようせつ）プログラムがフリーズするリスク", "利用者が前方（ぜんぽう）や足元（あしもと）に滑り落ちて（すべりおちて）大怪我（おおけが・転倒）をするリスク"], "answer": 2, "tip_tl": "Ito ay tungkol sa aktwal na kilos-kamay sa pag-aalaga — ligtas, tama, at magalang sa bawat hakbang. Ang pag-iwas sa pagkahulog (fall prevention) ay isa sa pangunahing priyoridad sa ligtas na kapaligiran. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-326", "part": "A", "category": "生活支援技術", "level": "hard", "question": "ベッドの端（はし）に座った姿勢（端座位・たんざい）において、利用者が骨盤（こつばん）を後ろに倒した（たおした）姿勢（仙骨座り・せんこつずわり）のまま車椅子（くるまいす）に移乗（いじょ）しようとすると、どのような危険が起こりやすいですか。", "options": ["お尻（おしり）が前に滑り落ちて（すべりおちて）転倒（てんとう）するか、立ち上がれなくなる", "衣服（いふく）が摩擦（まさつ）で一瞬で破れてしまう", "車椅子のブレーキが自動的に解除（かいじょ）されてしまう"], "answer": 0, "tip_tl": "Ito ay tungkol sa praktikal na kasanayan sa pag-aalaga sa araw-araw na pangangailangan ng resident — mula sa paglilinis hanggang sa paglipat (transfer). Sa pag-transfer o paglipat ng resident, laging unahin ang kaligtasan at tamang postura. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-327", "part": "A", "category": "生活支援技術", "level": "hard", "question": "ボディメカニクスにおいて、介護職が利用者をベッドの上で手前に引き寄せるとき、自分の足の配置（はいち）と体重（たいじゅう）の移動（いどう）として最も正しいものはどれですか。", "options": ["つま先立ち（つまさきだち）になって、ジャンプ（じゃんぷ）しながら引く", "足を前後に広げ、支持基底面（しじきていめん）を広くして、後ろの足に体重を移動させながら引く", "足を完全に閉じて一本の棒のようになり、上半身の力だけで一気に引く"], "answer": 1, "tip_tl": "Dito, ang diin ay sa tamang paraan ng pagtulong sa resident habang pinapanatili ang kanilang natitirang kakayahan (remaining ability). Gamitin ang tamang body mechanics para maiwasan ang sakit ng likod habang tumutulong. Sa pag-transfer o paglipat ng resident, laging unahin ang kaligtasan at tamang postura. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-328", "part": "A", "category": "生活支援技術", "level": "hard", "question": "拘縮（こうしゅく・関節が硬くなって曲がっている）が激しい利用者をお風呂（ふろ・入浴）に入れる際、皮膚（ひふ）の擦れ（すれ）や怪我（けが）を防ぐために最も注意すべき点はどれですか。", "options": ["お湯の中に1時間以上（いじょう）沈めて、関節が柔らかくなるまで放置する", "関節を力任せ（ちからまかせ）に引っ張ってまっすぐに伸ばしてから洗う", "無理に関節を伸ばそうとせず、曲がった隙間（すきま・脇や股など）を優しく丁寧に洗う"], "answer": 2, "tip_tl": "Ito ay tungkol sa aktwal na kilos-kamay sa pag-aalaga — ligtas, tama, at magalang sa bawat hakbang. Sa pagpapaligo, laging suriin muna ang temperatura ng tubig bago hipuin ang resident. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-329", "part": "A", "category": "生活支援技術", "level": "hard", "question": "全盲（ぜんもう）の利用者が、スプーン（すぷーん）を使って自分で食事（しょくじ）をする際、お皿（さら）の中の食べ物の配置を本人が頭の中でイメージ（いめーじ）しやすくするための高度な言葉掛けはどれですか。", "options": ["「こぼしたら片付け（かたづけ）が大変（たいへん）ですよ」と何度も脅かす", "「右のほうに適当（てきとう）にオカズが置いてあります」と曖昧に伝える", "「時計（とけい）の針（はり）の12時の位置に白いご飯、3時の位置にお魚があります」と伝える"], "answer": 2, "tip_tl": "Ito ay tungkol sa praktikal na kasanayan sa pag-aalaga sa araw-araw na pangangailangan ng resident — mula sa paglilinis hanggang sa paglipat (transfer). Sa paggabay sa taong may visual impairment, gamitin ang malinaw na verbal cues at 'clock position'. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-330", "part": "A", "category": "生活支援技術", "level": "hard", "question": "嚥下（えんげ・飲み込み）のプロセス（ぷろせす）において、食べ物が口から喉（のど）を通り、気管（きかん・呼吸の道）に入らないように自動的に蓋（ふた）をする重要な組織の名前は何ですか。", "options": ["心臓（しんぞう）", "食道（しょくどう）", "喉頭蓋（こうとうがい・誤嚥を防ぐフタ）"], "answer": 2, "tip_tl": "Dito, ang diin ay sa tamang paraan ng pagtulong sa resident habang pinapanatili ang kanilang natitirang kakayahan (remaining ability). Bantayan ang paglunok ng resident lalo na sa mga taong may panganib ng pagkabulunan. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-331", "part": "A", "category": "生活支援技術", "level": "hard", "question": "脳卒中（のうそっちゅう）による重度（じゅうど）の片麻痺（かたまひ・右側が麻痺）と感覚障害（かんかくしょうがい）がある利用者の、衣服（いふく）の着脱（ちゃくだつ）の介助（かいじょ）において、介護職が最も観察（かんさつ）すべきリスクはどれですか。", "options": ["麻痺している（まひしている）側の腕（うで）や指（ゆび）が服の袖（そで）に引っかかり、本人が気づかないうちに脱臼（だっきゅう）や骨折をするリスク", "服のボタン（ぼたん）の色が利用者の好みに合わずに怒り出すリスク", "健側（けんそく・左側）の筋肉が一瞬で消えてしまうリスク"], "answer": 0, "tip_tl": "Ito ay tungkol sa aktwal na kilos-kamay sa pag-aalaga — ligtas, tama, at magalang sa bawat hakbang. Kapag may hemiplegia (paralisis sa isang bahagi), simulan ang paggalaw mula sa malakas na bahagi ng katawan. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-332", "part": "A", "category": "生活支援技術", "level": "hard", "question": "排泄（はいせつ・おしっこ）の介助において、尿意（にょうい・尿が出たい気持ち）があるにも関わらず、膀胱（ぼうこう）からおしっこを外に出すことができなくなり、お腹がパンパンに張って（はって）激しい痛みを伴う緊急の状態を何といいますか。", "options": ["頻尿（ひんにょう）", "便秘（べんぴ）", "尿閉（にょうへい・おしっこが詰まること）"], "answer": 2, "tip_tl": "Ito ay tungkol sa praktikal na kasanayan sa pag-aalaga sa araw-araw na pangangailangan ng resident — mula sa paglilinis hanggang sa paglipat (transfer). Sa emergency na sitwasyon, kailangan ng mabilis pero mahinahong pagkilos. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-333", "part": "A", "category": "生活支援技術", "level": "hard", "question": "寝たきり（ねたきり）の利用者のオムツ（おむつ）交換（こうかん）において、テープ（てーぷ）を止める位置（いち）が強すぎ（つよすぎ）たり、左右（さゆう）でズレて（ずれて）いたりしたときに発生する、皮膚（ひふ）のトラブルの原因はどれですか。", "options": ["ソネットくんのデータベース（でーたべーす）に水漏れ（えらー）が発生する", "利用者の足の長さ（ながさ）が左右で変わってしまう", "おむつの縁（ふち）が皮膚に強く擦れて（すれて）、足の付け根（鼠径部・そけいぶ）に床ずれ（とこづれ）や傷ができる"], "answer": 2, "tip_tl": "Dito, ang diin ay sa tamang paraan ng pagtulong sa resident habang pinapanatili ang kanilang natitirang kakayahan (remaining ability). Sa paggamit ng diaper, tamang fitting ang nag-iiwas sa pangangati at bedsore. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-334", "part": "A", "category": "生活支援技術", "level": "hard", "question": "お風呂（おふろ・入浴）の現場において、心臓（しんぞう）の病気（高血圧や心不全など）がある利用者を湯船（ゆぶね）に浸からせる（つからせる）際、心臓への圧迫（あつりょく）を減らすための最も適切な入浴の方法はどれですか。", "options": ["みぞおちから下（した）だけをお湯に浸ける「半身浴（はんしんよく）」にする", "湯船の中で激しく身体を動かして運動（うんどう）させる", "首（くび）まで完全（かんぜん）にお湯に深く沈める「全身浴（ぜんしんよく）」にする"], "answer": 0, "tip_tl": "Ito ay tungkol sa aktwal na kilos-kamay sa pag-aalaga — ligtas, tama, at magalang sa bawat hakbang. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-335", "part": "A", "category": "生活支援技術", "level": "hard", "question": "利用者が食べ物を口に入れた（くちにいれた）後、何度も（なんども）むせたり、食後に声（こえ）がガラガラ（がらがら）と枯れたり（かれたり）する状態（湿性声音・しっせいせいおん）が続くときに、最も疑う（うたがう）べき危険な現象はどれですか。", "options": ["お腹（おなか）がいっぱいになって満足（まんぞく）している状態", "部屋（へや）の空気（くうき）が乾燥（かんそう）しているだけの状態", "食べ物（たべもの）や水分（すいぶん）が気管（きかん）に入り込んでいる「誤嚥（ごえん）」の状態"], "answer": 2, "tip_tl": "Ito ay tungkol sa praktikal na kasanayan sa pag-aalaga sa araw-araw na pangangailangan ng resident — mula sa paglilinis hanggang sa paglipat (transfer). Ang aspiration pneumonia ay maiiwasan sa pamamagitan ng tamang postura habang kumakain. Ang dysphagia (hirap sa paglunok) ay nangangailangan ng espesyal na pag-iingat habang nagpapakain. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-336", "part": "A", "category": "生活支援技術", "level": "hard", "question": "認知症（にんちしょう）の利用者（りようしゃ）が、食事（しょくじ）を口（くち）に入れた（いれた）まま動かさ（うごかさ）なくなり、食べることを止めて（とめめて）しまう「失認（しつにん）」や「失行（しっこう）」の症状への対応として、最も適切なものはどれですか。", "options": ["介護職がスプーンで食べ物を少し動かしたり、お皿を見せたりして「美味しいオカズですよ」と視覚や聴覚を刺激する", "口の中に残っている食べ物を、介護職の指で無理やり奥へ押し込む", "食べる気が無いと判断し、すぐにお皿をすべて片付ける"], "answer": 0, "tip_tl": "Dito, ang diin ay sa tamang paraan ng pagtulong sa resident habang pinapanatili ang kanilang natitirang kakayahan (remaining ability). Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-337", "part": "A", "category": "生活支援技術", "level": "hard", "question": "全介助（ぜんかいじょ・寝たきり）の利用者の口腔ケア（こうくうけあ）において、歯ブラシ（はぶらし）だけでなく、頬（ほお）の内側（うちがわ）や上あご、舌（した）の汚れ（よごれ）を安全（あんぜん）に拭き取る（ふきとる）ために使う専用の福祉用具は何ですか。", "options": ["金属製の硬いスプーン（すぷーん）", "乾いたティッシュペーパー（てぃっしゅ）", "口腔ケア用スポンジブラシ（すぽんじぶらし）"], "answer": 2, "tip_tl": "Ito ay tungkol sa aktwal na kilos-kamay sa pag-aalaga — ligtas, tama, at magalang sa bawat hakbang. Ang oral care ay hindi lamang para sa amoy — ito rin ay proteksyon laban sa impeksyon sa baga. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-338", "part": "A", "category": "生活支援技術", "level": "hard", "question": "人工肛門（じんこうこうもん・ストーマ）や人工膀胱（じんこうぼうこう）を造設（ぞうせつ）している利用者の排泄介助において、お腹（おなか）に貼り付け（はりつけ）られている、便（べん）や尿（にょう）を溜める（ためる）袋のパーツ（用具）を何といいますか。", "options": ["ポータブルトイレ（ぽーたぶるといれ）", "パウチ（ぱうち・ストーマ装具）", "カテーテル（かてーてる）"], "answer": 1, "tip_tl": "Ito ay tungkol sa praktikal na kasanayan sa pag-aalaga sa araw-araw na pangangailangan ng resident — mula sa paglilinis hanggang sa paglipat (transfer). Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-339", "part": "A", "category": "生活支援技術", "level": "hard", "question": "尿道留置カテーテル（にょうどうりゅうちかてーてる・おしっこの管）を使用している利用者のベッド上（じょう）の排泄管理において、尿を溜めるバッグ（ウロバッグ）を配置（はいち）する正しい高さ（位置）はどれですか。", "options": ["利用者の顔（かお）の正面（しょうめん）の壁に貼り付ける", "尿の逆流による尿路感染症（にょうろかんせんしょう）を防ぐため、必ず膀胱（ぼうこう・ベッドの面）よりも低い位置に吊り下げる", "どのような高さに置いても、感染（かんせん）のリスクは同じである"], "answer": 1, "tip_tl": "Dito, ang diin ay sa tamang paraan ng pagtulong sa resident habang pinapanatili ang kanilang natitirang kakayahan (remaining ability). Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-340", "part": "A", "category": "生活支援技術", "level": "hard", "question": "入浴（にゅうよく）の介助において、お風呂（おふろ）から上がった（あがった）後に、利用者が急激（きゅうげき）に汗（あせ）をかいて水分（すいぶん）が失われ（うしなわれ）、血圧（けつあつ）が下がって（さがって）倒れる（たおれる）のを防ぐための介護職の最も重要な行動はどれですか。", "options": ["水分（すいぶん）を一切（いっさい）飲ませない（のませない）ようにして我慢させる", "身体を暖める（あたためる）ために、すぐにサウナ（さうな）に入れる", "速やかに（すみやかに）身体の水分を拭き取り（ふきとり）、十分な水分補給（しゅいぶんほきゅう）を行う"], "answer": 2, "tip_tl": "Ito ay tungkol sa aktwal na kilos-kamay sa pag-aalaga — ligtas, tama, at magalang sa bawat hakbang. Ang matatanda ay mas madaling ma-dehydrate kaya dapat regular na alalahanin na uminom ng tubig. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-341", "part": "A", "category": "介護課程", "level": "hard", "question": "介護課程（かいごかてい）の「アセスメント（あせすめんと）」において、利用者が「できない（障壁・しょうへき）」部分（情報）だけでなく、本人が「できる（可能性・強み）」部分（情報）を分析する視点を何といいますか。", "options": ["経済（けいざい）管理の視点", "リスク（危険・りすく）の視点", "ストレングス（強み・すとれんぐす）の視点"], "answer": 2, "tip_tl": "Ito ay bahagi ng 'care process' — ang sistematikong paraan ng pagpaplano ng pangangalaga base sa aktwal na pangangailangan ng resident. Ang care plan ay dapat base sa aktwal na pangangailangan ng resident, hindi sa kaginhawaan ng staff. Ang assessment ay ang unang hakbang — kalapin ang tamang impormasyon bago magplano. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-342", "part": "A", "category": "介護課程", "level": "hard", "question": "個別介護計画（こべつかいごけいかく）に記載（きさい）する「長期目標（ちょうきもくひょう）」と「短期目標（たんきもくひょう）」の関係性（かんけいせい）として、最も正しいルールはどれですか。", "options": ["短期目標は、長期目標を達成（たっせい）するための具体的なステップ（階段）となるように連動（れんどう）させる", "長期目標と短期目標の内容は、全く関係（かんけい）のない別のものにする", "短期目標の期限（きげん）を、長期目標よりも長い時間（10年以上）に設定する"], "answer": 0, "tip_tl": "Dito tinuturo kung paano suriin, magplano, at i-evaluate ang pangangalaga para sa bawat indibidwal na resident. Ang care plan ay dapat base sa aktwal na pangangailangan ng resident, hindi sa kaginhawaan ng staff. Ang goal setting ay dapat batay sa aktwal na kakayahan at pangarap ng resident, hindi biglaang target. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-343", "part": "A", "category": "介護課程", "level": "hard", "question": "介護計画の目標設定において、「本人が自立（じりつ）した生活を送る」ための表現として、最も不適切（ふてきせつ・ダメな例）なものはどれですか。", "options": ["「毎日、食堂（しょくどう）まで車椅子を自分で漕いで移動する」という評価可能な目標", "「介護職（かいごしょく）が毎日（まいにち）丁寧に（ていねいに）おむつを交換（こうかん）する」という介護職側の行動目標", "「本人が3ヶ月後（かげつご）に、手すりを使ってトイレで排泄ができる」という本人側の行動目標"], "answer": 1, "tip_tl": "Ang paksang ito ay tungkol sa buong siklo ng care planning — mula assessment hanggang review. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-344", "part": "A", "category": "介護課程", "level": "hard", "question": "介護記録（かいごきろく）の書き方（記述方法）において、多職種（たしょくしゅ・医師や看護師）との情報共有を客観的かつ効率的に行うための世界的な記録のフレームワーク（手法）を何といいますか。", "options": ["JSON（じぇいそん）構造データ", "ハンダ付け（はんだづけ）フォーマット", "SOAP（ソープ・S情報、O情報、A評価、P計画）"], "answer": 2, "tip_tl": "Ito ay bahagi ng 'care process' — ang sistematikong paraan ng pagpaplano ng pangangalaga base sa aktwal na pangangailangan ng resident. Ang record o dokumentasyon ay dapat batay sa aktwal na katotohanan, hindi opinyon. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-345", "part": "A", "category": "介護課程", "level": "hard", "question": "実施（じっし）した介護サービスの効果（こうか）を評価（ひょうか・モニタリング）した結果、設定した目標（もくひょう）が達成（たっせい）できなかった場合の、介護課程の正しい展開（手順）はどれですか。", "options": ["「本人の努力（どりょく）が足りない（たりない）」と判断し、計画をそのまま変えずに続ける", "目標が達成できなかった「原因（げんいん）」を再アセスメントし、計画（けいかく）の内容（ないよう）を修正（しゅうせい）する", "現在の計画（けいかく）を勝手に破り捨てて（やぶりすてて）、サービスを完全に中止する"], "answer": 1, "tip_tl": "Dito tinuturo kung paano suriin, magplano, at i-evaluate ang pangangalaga para sa bawat indibidwal na resident. Ang care plan ay dapat base sa aktwal na pangangailangan ng resident, hindi sa kaginhawaan ng staff. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-346", "part": "B", "category": "発達と老化の理解", "level": "hard", "question": "高齢者（こうれいしゃ）の睡眠（すいみん）の特徴（とくちょう）として、介護職がバイタルサインや生活リズムをアセスメントする際、最も正しい知識（ちしき）はどれですか。", "options": ["高齢者の睡眠のサイクルは、赤ちゃんと完全に同じになる", "深い睡眠（ノンレム睡眠）の時間が減り（へり）、夜中に何度も目が覚める（中途覚醒・ちゅうとかくせい）が起こりやすい", "若者よりも眠りが非常に深く（ふかく）、12時間以上（いじょう）一度も起きずに眠り続ける"], "answer": 1, "tip_tl": "Ang paksang ito ay tumatalakay sa physical at mental na pagbabago na dulot ng edad. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-347", "part": "B", "category": "発達と老化の理解", "level": "hard", "question": "高齢（こうれい）になると、のどの粘膜（ねんまく）の感覚（かんかく）や反射（はんしゃ）が鈍る（にぶる）ため、異物（いぶつ）が気管（きかん）に入っても咳（せき）が出ず、本人が気づかないうちに誤嚥性肺炎（ごえんせいはいえん）を起こす危険な現象を何といいますか。", "options": ["急性気管支炎（きゅうせいきかんしえん）", "失語症（しつごしょう）", "不顕性誤嚥（ふけんせいごえん・静かなる誤嚥）"], "answer": 2, "tip_tl": "Ito ay tungkol sa normal na pagbabago sa katawan at isip habang tumatanda ang isang tao. Ang aspiration pneumonia ay maiiwasan sa pamamagitan ng tamang postura habang kumakain. Ang dysphagia (hirap sa paglunok) ay nangangailangan ng espesyal na pag-iingat habang nagpapakain. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-348", "part": "B", "category": "発達と老化の理解", "level": "hard", "question": "高齢者（こうれいしゃ）の病気（びょうき）の現れ（あらわれ）方の特徴（とくちょう）として、若者（わかもの）と大きく異なる（ことなる）点（非典型症状）として、最も適切な内容はどれですか。", "options": ["症状がハッキリと出にくく（非典型的・ひてんけいてき）、脱水や意識混濁などの精神症状が先に出ることがある", "どんなに重い病気でも、1日（にち）で完全に自然（しぜん）に治る（なおる）", "症状が必ず全身（ぜんしん）の激しい（はげしい）出血（しゅっけつ）として現れる"], "answer": 0, "tip_tl": "Dito ipinapaliwanag kung anong mga pagbabago sa aging process ang dapat asahan at unawain ng care worker. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-349", "part": "B", "category": "発達と老化の理解", "level": "hard", "question": "高齢（こうれい）に伴う（ともなう）感覚機能（かんかくきのう）の低下において、高い（たかい）音（おと）から順番（じゅんばん）に聞こえにくくなり、特に騒がしい（さわがしい）場所での言葉（ことば）の聞き取り（ききとり）が難しくなる難聴の種類は何ですか。", "options": ["感音性難聴（かんおんせいなんちょう・加齢性難聴・かれいせいなんちょう）", "伝音性難聴（でんおんせいなんちょう）", "中耳炎（ちゅうじえん）"], "answer": 0, "tip_tl": "Ang paksang ito ay tumatalakay sa physical at mental na pagbabago na dulot ng edad. Sa pakikipag-usap sa taong may hearing loss, magsalita nang malinaw at harapin sila. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-350", "part": "B", "category": "発達と老化の理解", "level": "hard", "question": "高齢（こうれい）になると、皮膚（ひふ）のバリア機能（ばりあきのう）が低下（ていか）し、乾燥（かんそう）が激しくなることで、全身に激しい「痒み（かゆみ）」を伴う（ともなう）高齢者特有の皮膚の病気は何ですか。", "options": ["蕁麻疹（じんましん）", "皮脂欠乏性皮膚炎（ひしけつぼうせいひふえん・老人性乾皮症）", "疥癬（かいせん）"], "answer": 1, "tip_tl": "Ito ay tungkol sa normal na pagbabago sa katawan at isip habang tumatanda ang isang tao. Ang balat ng matanda ay manipis at tuyo, kaya't dapat maingat sa paghawak at paglilinis. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-351", "part": "B", "category": "認知症の理解", "level": "hard", "question": "レビー小体型認知症（れびーしょうたいがたにんちしょう）の利用者が、「部屋の隅に知らない子供が座っている」と生々しく訴える症状（中核・行動心理症状）を何といいますか。", "options": ["幻視（げんし・実際にはないものが見えること）", "失語（しつご）", "物取られ妄想（ものとられもうそう）"], "answer": 0, "tip_tl": "Dito, mahalagang maunawaan ang sintomas ng dementia at ang tamang paraan ng pakikitungo dito nang may pasensya at empatiya. Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-352", "part": "B", "category": "認知症の理解", "level": "hard", "question": "アルツハイマー型認知症の初期（しょき）から見られ、約束（やくそく）の時間（じかん）を忘れる（わすれる）だけでなく、エピソード（出来事）そのものを丸ごと忘れてしまう記憶障害の種類は何ですか。", "options": ["近時記憶障害（きんじきおくしょうがい・最近の記憶の低下）", "遠隔記憶障害（えんかくきおくしょうがい）", "意味記憶障害（いみきおくしょうがい）"], "answer": 0, "tip_tl": "Ang paksang ito ay tumatalakay sa iba't ibang uri ng dementia at ang epekto nito sa pang-araw-araw na buhay ng resident. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-353", "part": "B", "category": "認知症の理解", "level": "hard", "question": "認知症（にんちしょう）の人が、周囲（しゅうい）の環境（かんきょう）のストレスや不適切な関わり（排斥）によって引き起こす、うつ状態、生命力の低下、あるいは引きこもりなどの状態を何といいますか。", "options": ["アパシー（あぱしー・自発性の低下）", "せん妄（せんもう）", "脱抑制（だつよくせい）"], "answer": 0, "tip_tl": "Ito ay tungkol sa dementia — kung paano ito nagbabago sa isip at asal ng resident, at kung paano dapat tumugon ang care worker. Ang BPSD (behavioral at psychological symptoms) ng dementia ay dapat unawain bago husgahan. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-354", "part": "B", "category": "認知症の理解", "level": "hard", "question": "夜間（やかん）に突然（とつぜん）意識（いしき）が混濁（こんだく）し、激しい（はげしい）興奮（こうふん）や幻覚（げんかく）を伴って（ともなって）暴れだす（あばれだす）状態（認知症と区別が必要な急性の精神症状）を何といいますか。", "options": ["うつ病（うつびょう）", "せん妄（せんもう・意識障害の一種）", "認知症（にんちしょう）の進行"], "answer": 1, "tip_tl": "Dito, mahalagang maunawaan ang sintomas ng dementia at ang tamang paraan ng pakikitungo dito nang may pasensya at empatiya. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-355", "part": "B", "category": "認知症の理解", "level": "hard", "question": "慢性硬膜下血腫（まんせいこうまくかけっしゅ）や正常圧水頭症（せいじょうあつすいとうしょう）など、病院（びょういん）で手術（しゅじゅつ）を行う（おこなう）ことで症状が改善（かいぜん）する「治る認知症」の原因疾患はどれですか。", "options": ["脳外科的治療で改善する疾患（可逆性認知症・かぎゃくせいにんちしょう）", "アルツハイマー病", "ピック病"], "answer": 0, "tip_tl": "Ang paksang ito ay tumatalakay sa iba't ibang uri ng dementia at ang epekto nito sa pang-araw-araw na buhay ng resident. Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-356", "part": "B", "category": "障害の理解", "level": "hard", "question": "脊髄損傷（せきずいそんしょう）の利用者が、車椅子（くるまいす）に長時間（ちょうじかん）座っている（すわっている）際、汗（あせ）を大量（たいりょう）にかき、激しい頭痛（ずつう）と急激（きゅうげき）な高血圧（こうけつあつ）を起こす緊急の自律神経のトラブルを何といいますか。", "options": ["起立性低血圧（きりつせいていけつあつ）", "ヒートショック（ひーとしょっく）", "自律神経過反射（じりつしんけいかはんしゃ・過緊張）"], "answer": 2, "tip_tl": "Ito ay tungkol sa iba't ibang uri ng kapansanan at kung paano suportahan ang kalayaan ng taong may kapansanan. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-357", "part": "B", "category": "障害の理解", "level": "hard", "question": "高次脳機能障害（こうじのうきのうしょうがい）の症状（しょうじょう）において、目の前（めのまえ）にたくさんの情報（じょうほう）や仕事（しごと）があるとパニック（ぱにっく）になり、一つの物事に集中（しゅうちゅう）できなくなる障害を何といいますか。", "options": ["注意障害（ちゅういしょうがい）", "記憶障害（きおくしょうがい）", "社会的行動障害（しゃかいてきこうどうしょうがい）"], "answer": 0, "tip_tl": "Dito, ang diin ay unawain ang pangangailangan ng bawat tao ayon sa kanyang partikular na kapansanan — pisikal, sensory, o developmental. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-358", "part": "B", "category": "障害の理解", "level": "hard", "question": "筋萎縮性側索硬化症（ALS・きんいしゅくせいそくさくこうかしょう）において、病気が進行（しんこう）しても最後まで保たれ（たもたれ）やすい、利用者の身体の能力（残存能力）はどれですか。", "options": ["眼球運動（がんきゅううんどう・目の動き）や感覚、知能", "自力（じりき）での呼吸の能力", "手足（てあし）の自由な筋肉の動き"], "answer": 0, "tip_tl": "Ang paksang ito ay tumatalakay sa disability support — hindi puro limitasyon, kundi pagpapalawak ng kakayahan ng tao. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-359", "part": "B", "category": "障害の理解", "level": "hard", "question": "障害者の「意思（いし）疎通（そつう）」を支援（しえん）するための制度（せいど）において、聴覚（ちょうかく）や言語の障害（しょうがい）がある人のために、手話通訳者（しゅわつうやくしゃ）や要約筆記者が付き添う（つきそう）サービス（市町村事業）は何ですか。", "options": ["行動援護（こうどうえんご）", "意思疎通支援事業（いしそつうしえんじぎょう）", "同行援護（どうこうえんご）"], "answer": 1, "tip_tl": "Ito ay tungkol sa iba't ibang uri ng kapansanan at kung paano suportahan ang kalayaan ng taong may kapansanan. Mahalaga ang malinaw at magalang na komunikasyon sa bawat interaksyon. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-360", "part": "B", "category": "障害の理解", "level": "hard", "question": "自閉症（じへいしょう）や知的障害（ちてきしょうがい）のある人が、急な予定（よてい）の変化（へんか）でパニックを起こした際、介護職が言葉で説得（せっとく）するのではなく、本人が落ち着く（おちつく）空間（静かな部屋）を確保する支援の手法を何といいますか。", "options": ["行動修正（こうどうしゅうせい・命令）", "クールダウン（くーるだうん・タイムアウト・構造化の活用）", "身体拘束（しんたいこうそく・隔離）"], "answer": 1, "tip_tl": "Dito, ang diin ay unawain ang pangangailangan ng bawat tao ayon sa kanyang partikular na kapansanan — pisikal, sensory, o developmental. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-361", "part": "B", "category": "こころとからだのしくみ", "level": "hard", "question": "脳の血管（けっかん）が詰まる（つまる）「脳梗塞（のうこうそく）」において、脳の左側（ひだりがわ・左半球）の細胞（さいぼう）がダメージ（だめーじ）を受けたとき、人間の身体に現れる麻痺（まひ）の左右（さゆう）の場所はどこですか。", "options": ["左片麻痺（ひだりかたまひ）", "右片麻痺（みぎかたまひ・右側の手足の麻痺）", "麻痺はどこにも現れない"], "answer": 1, "tip_tl": "Ang paksang ito ay batayan ng medikal na kaalaman sa likod ng bawat desisyon sa pangangalaga. Kapag may hemiplegia (paralisis sa isang bahagi), simulan ang paggalaw mula sa malakas na bahagi ng katawan. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-362", "part": "B", "category": "こころとからだのしくみ", "level": "hard", "question": "心臓（しんぞう）の筋肉（しんきん）に酸素（さんそ）や栄養（えいよう）を送る（おくる）ための、心臓の表面（ひょうめん）を走る（はしる）最も重要な血管の名前は何ですか。ここが詰まると心筋梗塞を起こします。", "options": ["大動脈（だいどうみゃく）", "肺静脈（はいじょうみゃく）", "冠動脈（かんどうみゃく・冠状動脈）"], "answer": 2, "tip_tl": "Ito ay tungkol sa siyentipikong pag-unawa sa katawan at isip ng tao — mahalaga ito para malaman kung bakit nangyayari ang isang kondisyon. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-363", "part": "B", "category": "こころとからだのしくみ", "level": "hard", "question": "高齢者（こうれいしゃ）が食事（しょくじ）の水分（すいぶん）などで喉（のど）を詰まらせた（つまらせた）とき、食べ物が気管（きかん）に入り、肺（はい）の中で細菌（さいきん）が増えて（ふえて）強い炎症（えんしょう）を起こす病気を何といいますか。", "options": ["肺結核（はいけっかく）", "肺気腫（はいきしゅ）", "誤嚥性肺炎（ごえんせいはいえん）"], "answer": 2, "tip_tl": "Dito ipinapaliwanag ang mekanismo ng katawan (anatomy, physiology) na dapat maintindihan ng bawat care worker. Ang aspiration pneumonia ay maiiwasan sa pamamagitan ng tamang postura habang kumakain. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-364", "part": "B", "category": "こころとからだのしくみ", "level": "hard", "question": "人間の体（からだ）の骨（ほね）について、高齢（こうれい）になると骨粗鬆症（こつそしょうしょう）が原因で、尻もち（しりもち）をついたときに最も骨折（こっせつ）しやすく、寝たきりの原因となる脚（あし）の骨の部分（部位）はどこですか。", "options": ["大腿骨頸部（だいたいこつけいぶ・太ももの付け根の骨）", "脊椎（せきつい・背骨の圧迫骨折）", "上腕骨頸部（じょうわんこつけいぶ・肩の骨）"], "answer": 0, "tip_tl": "Ang paksang ito ay batayan ng medikal na kaalaman sa likod ng bawat desisyon sa pangangalaga. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-365", "part": "B", "category": "こころとからだのしくみ", "level": "hard", "question": "人間の体（からだ）の免疫（めんえき）の仕組みにおいて、過去（かこ）に水ぼうそう（水痘・すいとう）にかかったウイルス（ういるす）が、高齢になって免疫が落ちた（おちた）ときに神経（しんけい）に沿って（そって）赤い（あかい）ブツブツと激しい痛みを起こす病気は何ですか。", "options": ["疥癬（かいせん）", "アトピー性皮膚炎", "帯状疱疹（たいじょうほうしん）"], "answer": 2, "tip_tl": "Ito ay tungkol sa siyentipikong pag-unawa sa katawan at isip ng tao — mahalaga ito para malaman kung bakit nangyayari ang isang kondisyon. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-366", "part": "B", "category": "医療的ケア", "level": "hard", "question": "たんの吸引（きゅういん）の実施中（じっしちゅう）に、利用者の顔色（かおいろ）が急激（きゅうげき）に青白く（あおじろく）なり（チアノーゼ・ちあのーぜ）、酸素飽和度（さんそほうわど・SpO2）が急に低下（ていか）した場合の介護職の正しい最優先の行動はどれですか。", "options": ["直ちに（ただちに）吸引を中止（ちゅうし）してチューブを引き抜き、すぐに看護師（かんごし）や医師（いし）へ緊急報告（ほうこく）する", "利用者が落ち着く（おちつく）まで、機械のスイッチを入れたまま5分間様子を見る", "「深呼吸をしてください」と大声で利用者に命令し、部屋の鍵を閉めて外に出る"], "answer": 0, "tip_tl": "Dito, mahalaga ang tamang pamamaraan at kaligtasan dahil direktang nakaka-apekto ito sa buhay ng resident. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Sa emergency na sitwasyon, kailangan ng mabilis pero mahinahong pagkilos. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-367", "part": "B", "category": "医療的ケア", "level": "hard", "question": "胃ろう（いろう・PEG）の周辺（しゅうへん）の皮膚（ひふ・お腹の肌）において、栄養剤（えいようざい）の漏れ（もれ）や胃酸（いさん）の刺激（しげき）が原因で、じくじくと赤く腫れたり（はれたり）痛み（いたみ）が出たりする皮膚のトラブル（肉芽など）を防ぐための正しいケアはどれですか。", "options": ["アルコール（あるこーる）消毒液を傷口に大量に直接ぶっかける", "何もせずに放置し、皮膚が自然に硬くなるのを待つ", "こまめに周囲の皮膚の汚れをぬるま湯で洗い流して乾燥させ、常に清潔（せいけつ）を保つ"], "answer": 2, "tip_tl": "Ang paksang ito ay tumatalakay sa mga limitasyon at responsibilidad ng care worker sa medikal na gawain. Ang balat ng matanda ay manipis at tuyo, kaya't dapat maingat sa paghawak at paglilinis. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-368", "part": "B", "category": "医療的ケア", "level": "hard", "question": "経管栄養（けいかんえいよう）の実施中（じっしちゅう）に、利用者が「お腹（おなか）が痛い（いたい）」と強く訴え（うったえ）たり、突然（とつぜん）激しく（はげしく）嘔吐（おうと・吐くこと）したりした場合の介護職の正しい緊急対応はどれですか。", "options": ["直ちに（ただちに）栄養剤の注入（ちゅうにゅう）を停止（クランプを閉じる）し、すぐに看護師（かんごし）に報告する", "利用者を完全に仰向け（あおむけ）に寝かせたまま、背中を強く叩く", "吐いたものが口の中に残らないように、注入の速度を2倍にして一気に流し込む"], "answer": 0, "tip_tl": "Ito ay tungkol sa medikal na pangangalagang maaaring gawin ng care worker, kasama ang mahigpit na patakaran sa kaligtasan. Sa tube feeding, laging suriin ang posisyon ng tubo bago magbigay ng gatas o pagkain. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-369", "part": "B", "category": "医療的ケア", "level": "hard", "question": "たんの吸引において、1回の吸引にかける時間（チューブを体内に入れてから引き抜くまでの時間）の安全な限界（目安）として、最も適切なものはどれですか。", "options": ["1時間（じかん）かけて、少しずつゆっくりと吸い上げる", "長くても10秒〜15秒以内（いない）とし、利用者の呼吸（こきゅう・息）を止めさせないようにする", "時間は特に気にせず、介護職の個人的な好みの長さでよい"], "answer": 1, "tip_tl": "Dito, mahalaga ang tamang pamamaraan at kaligtasan dahil direktang nakaka-apekto ito sa buhay ng resident. Ang pagsuction ng plema ay dapat gawin nang mahinahon, walang labis na presyon. Ang kaligtasan ng resident ang laging dapat unahin sa bawat hakbang ng pangangalaga. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-370", "part": "B", "category": "医療的ケア", "level": "hard", "question": "経管栄養（けいかんえいよう）の栄養剤（えいようざい）の温度（おんど）について、利用者の胃腸（いちょう・お腹）への負担を減らし（へらし）、下痢（げり）などの体調不良を防ぐための正しい準備はどれですか。", "options": ["冷蔵庫（れいぞうこ）からあらかじめ出しておき、室温（しつおん・人間の体温に近い程度）に戻しておく", "電子レンジ（でんじれんじ）で沸騰（ふっとう）させて、100度以上の熱い状態にする", "どのような温度（おんど）であっても、人間の胃の中に入れば同じである"], "answer": 0, "tip_tl": "Ang paksang ito ay tumatalakay sa mga limitasyon at responsibilidad ng care worker sa medikal na gawain. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-371", "part": "C", "category": "総合問題", "level": "hard", "question": "【事例（じれい）】Gさん（85歳、男性、要介護4）は、脳梗塞（のうこうそく）の再発（さいはつ）により右片麻痺（みぎかたまひ）と重度の嚥下障害（えんげしょうがい）があり、現在、胃ろう（いろう・経管栄養）を使用しています。日中はベッドの上で過ごす（すごす）時間が長く、自発的な動きが少ないため、お尻（おしり）の仙骨部（せんこつぶ）の皮膚にポケット状の床ずれ（とこづれ・褥瘡）が発生（はっせい）するリスクが非常に高い状態です。Gさんの床ずれを予防（よぼう）し、安全に経管栄養を実施するための介護福祉士の対応として、最も適切なものはどれですか。", "options": ["皮膚のバリア機能を高めるために、赤くなっているお尻の骨の出っ張りを、乾いた硬いタオルで毎日激しくこすってマッサージする", "経管栄養（けいかんえいよう）の注入（ちゅうにゅう）中は上半身を30度〜45度起こして（セミファーラー位）逆流を防ぎ、注入終了後1時間はその姿勢を保った後、規則的な体位変換を行う", "床ずれ（とこづれ）の痛みを減らすために、Gさんを完全にうつ伏せ（うつぶせ）の姿勢（腹臥位）にしたまま栄養剤を一気に流し込む"], "answer": 1, "tip_tl": "Ito ay isang case study na pinagsasama ang iba't ibang kaalaman — dapat basahin nang mabuti ang buong sitwasyon bago sumagot. Ang bedsore (褥瘡) ay maiiwasan sa pamamagitan ng regular na pagbabago ng posisyon. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},
{"id": "care-372", "part": "C", "category": "総合問題", "level": "hard", "question": "【事例（じれい）】Hさん（78歳、女性、要介護3）は、レビー小体型認知症（れびーしょうたいがたにんちしょう）があり、小刻み（こきざみ）に歩く（歩行障害）ため転倒（てんとう）のリスクが高まっています。また、夕方（ゆうがた）になると「知らない男の人が私の部屋のクローゼット（くろーぜっと）に隠れて（かくれて）私を睨んで（にらんで）いる」と怯える（おびえる）症状（幻視・げんし）が頻繁（ひんぱん）に見られます。このときの介護福祉士の最初の関わり（言葉掛け）として、最も適切なものはどれですか。", "options": ["「男の人が隠れている（かくれている）ように見えて、とても恐い（こわい）のですね、私が一緒に確認（かくにん）しますね」と不安な感情に共感（きょうかん）する", "Hさんを落ち着かせる（おちつかせる）ために、クローゼットの扉（とびら）を外（そと）から紐（ひも）で強く縛り、Hさんを部屋のベッドに拘束（こうそく）する", "「部屋には誰も（だれも）いませんよ、あなたの頭の病気（びょうき）のせいで幻覚（げんかく）が見えているだけです」とハッキリ否定する"], "answer": 0, "tip_tl": "Dito, kailangan mong isipin ang buong larawan ng buhay ng resident, hindi lamang isang bahagi ng problema. Sa pangangalaga ng dementia, kailangan ng pasensya at pag-unawa sa nararamdaman ng resident. Kailangan ng konting extra na pag-aaral dito, pero importante itong matutunan para sa totoong trabaho."},
{"id": "care-373", "part": "C", "category": "総合問題", "level": "hard", "question": "【事例（じれい）】Iさん（65歳、男性、障害支援区分5）は、頸髄損傷（けいずいそんしょう）による四肢麻痺（ししまひ・手足が動かない）があり、自宅で居宅介護（きょたくかいご）サービスを利用しながら車椅子での生活を送っています。Iさんは「自分の力でパソコン（ぱそこん）を操作し、インターネット（いんたーねっと）を使って社会（しゃかい）とつながる仕事（しごと）を始めたい」という強い自己決定（じこけってい）の意向を持っていますが、指（ゆび）を自由に動かすことができません。Iさんのエンパワメント（自立支援）を支えるための福祉用具（テクノロジー）の活用として、最も適切なものはどれですか。", "options": ["顎（あご）の動き（マウス・まうす）や視線（しせん）入力、音声（おんせい）認識システムなどの補足（環境制御装置）を提案（ていあん）し、本人の可能性を広げる支援を行う", "安全（あんぜん）を優先するために、Iさんの部屋からすべての家電（かでん）やパソコンを強制的に引き算（撤去）して管理する", "「手足が動かない（うごかない）のだからパソコンなんて無理（むり）です、諦めて静かに寝て（ねて）いなさい」と説得する"], "answer": 0, "tip_tl": "Ang tanong na ito ay sumusubok kung paano mo pagsasama-samahin ang iyong kaalaman sa aktwal na sitwasyon. Ang empowerment ay ibigay sa resident ang tamang tool para magawa niya ang gusto niyang gawin. Hirap ito sa unang basa, kaya huwag mag-alala kung kailangan mong balikan nang ilang beses."},
{"id": "care-374", "part": "C", "category": "総合問題", "level": "hard", "question": "介護の現場において、サービスの質（しつ）を高める（たかめる）ためのPDCAサイクル（ぷらす・ぷろせす）の展開の中で、「A（Action・改善・かいぜん）」に該当する介護福祉士の具体的な行動として、最も適切なものはどれですか。", "options": ["利用者のアセスメント（課題分析）を行い、本人の生活の歴史（ライフヒストリー）やニーズをスプレッドシートに書き出すこと", "ケアプラン（けあぷらん）に基づいた個別介護計画の書類を、机（つくえ）の中に丸一年間（まるいちねんかん）隠した（かくした）ままにしておくこと", "カンファレンス（会議）での評価（ひょうか）をもとに、現在の介護計画（かいごけいかく）の目標や手順の不備（ふび）を修正（しゅうせい）し、新しいケアの方法（ほうほう）を現場に導入（どうにゅう）すること"], "answer": 2, "tip_tl": "Ito ay isang case study na pinagsasama ang iba't ibang kaalaman — dapat basahin nang mabuti ang buong sitwasyon bago sumagot. Medyo mahirap ito, pero kayang-kaya mo 'pag pinag-aralan nang mabuti at binasa nang dahan-dahan."},

const SESSION_SIZE = 10;

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
