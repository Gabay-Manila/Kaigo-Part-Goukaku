/* ================= RUBY (furigana) ================= */
// 既存データの「漢字（かな）」表記を <ruby>漢字<rt>かな</rt></ruby> に自動変換する。
// 対象データの多くが元々この括弧書きふりがな形式で作られているため、
// kuromoji等の形態素解析なしで、正規表現の一括変換だけで安全にルビ化できる。
const RUBY_PATTERN = /([\u4E00-\u9FFF]+[\u3040-\u309F]*)（([\u3040-\u30FF\u30FCー]+)）/g;

function escapeHtml(str){
  return str
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function toRubyHtml(text){
  const escaped = escapeHtml(text);
  return escaped.replace(RUBY_PATTERN, (match, base, reading)=>{
    return `<ruby>${base}<rt>${reading}</rt></ruby>`;
  });
}

const RUBY_STATE_KEY = "kaigoPartRubyOn";
let rubyOn = true;
try{
  const saved = localStorage.getItem(RUBY_STATE_KEY);
  if(saved !== null) rubyOn = saved === "1";
}catch(e){}

function applyRubyState(){
  document.body.classList.toggle("hide-ruby", !rubyOn);
  const btn = document.getElementById("rubyToggle");
  if(btn){
    btn.classList.toggle("on", rubyOn);
    btn.textContent = rubyOn ? "ふ ふりがな" : "ふ ふりがな OFF";
  }
}

/* ================= STATE ================= */
const STORAGE_KEY = "kaigoPartExemptions";
let exemptions = loadExemptions();
let currentPart = null;
let currentIndex = 0;
let currentSet = [];
let selectedOption = null;
let answered = false;
let correctCount = 0;

function loadExemptions(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {A:false,B:false,C:false};
}
function saveExemptions(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(exemptions)); }catch(e){}
}

/* ================= AUDIO: 437Hz brand tone ================= */
let audioCtx = null;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(pattern){
  // pattern: array of {t: startOffsetSec, d: durationSec}
  const ctx = getCtx();
  pattern.forEach(p=>{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 437;
    const start = ctx.currentTime + p.t;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.22, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + p.d);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start);
    osc.stop(start + p.d + 0.02);
  });
}
function playCorrectTone(){ playTone([{t:0, d:0.32}]); }
function playWrongTone(){ playTone([{t:0, d:0.12},{t:0.16, d:0.12}]); }

/* ================= TTS ================= */
function speakJa(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/【事例】/g,"事例。"));
  u.lang = "ja-JP";
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

/* ================= TOP SCREEN ================= */
const partListEl = document.getElementById("partList");

function renderTop(){
  partListEl.innerHTML = "";
  ["A","B","C"].forEach(part=>{
    const count = QUESTIONS.filter(q=>q.part===part).length;
    const isExempt = exemptions[part];

    const card = document.createElement("div");
    card.className = "part-card" + (isExempt ? " exempt" : "");

    card.innerHTML = `
      <div class="part-card-top">
        <div class="part-tag mincho">${part}</div>
        <div class="part-info">
          <div class="part-name">${part}パート</div>
          <div class="part-fields">${PART_META[part].fields}</div>
          <div class="part-count">全${count}問のプールから毎回${Math.min(SESSION_SIZE, count)}問をランダム出題</div>
        </div>
        <label class="exempt-toggle">
          <span class="checkbox ${isExempt ? "checked":""}" data-part="${part}"></span>
          免除する
        </label>
      </div>
      <button class="start-btn" data-start="${part}" ${isExempt ? "disabled":""}>
        ${isExempt ? "免除済みのパートです" : part + "パートを開始する"}
      </button>
    `;
    partListEl.appendChild(card);
  });

  partListEl.querySelectorAll(".checkbox").forEach(box=>{
    box.addEventListener("click", (e)=>{
      const part = e.currentTarget.dataset.part;
      exemptions[part] = !exemptions[part];
      saveExemptions();
      renderTop();
    });
  });
  partListEl.querySelectorAll("[data-start]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      const part = e.currentTarget.dataset.start;
      startPart(part);
    });
  });
}

/* ================= QUIZ SCREEN ================= */
const screenTop = document.getElementById("screen-top");
const screenQuiz = document.getElementById("screen-quiz");
const screenResult = document.getElementById("screen-result");

const quizPartLabel = document.getElementById("quizPartLabel");
const quizProgressText = document.getElementById("quizProgressText");
const progressFill = document.getElementById("progressFill");
const questionLevel = document.getElementById("questionLevel");
const questionText = document.getElementById("questionText");
const optionsList = document.getElementById("optionsList");
const answerBtn = document.getElementById("answerBtn");
const tipCard = document.getElementById("tipCard");
const tipText = document.getElementById("tipText");
const nextBtn = document.getElementById("nextBtn");
const ttsBtn = document.getElementById("ttsBtn");

function showScreen(name){
  [screenTop, screenQuiz, screenResult].forEach(s=>s.classList.remove("active"));
  name.classList.add("active");
  window.scrollTo(0,0);
}

function startPart(part){
  currentPart = part;
  const pool = QUESTIONS.filter(q=>q.part===part);
  currentSet = shuffleArray(pool).slice(0, Math.min(SESSION_SIZE, pool.length));
  currentIndex = 0;
  correctCount = 0;
  showScreen(screenQuiz);
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  selectedOption = null;
  const q = currentSet[currentIndex];

  quizPartLabel.textContent = currentPart + "パート";
  quizProgressText.textContent = (currentIndex+1) + " / " + currentSet.length + "問";
  progressFill.style.width = Math.round((currentIndex / currentSet.length) * 100) + "%";

  questionLevel.textContent = LEVEL_LABEL[q.level] || q.level;
  questionText.innerHTML = toRubyHtml(q.question);

  optionsList.innerHTML = "";
  q.options.forEach((opt, idx)=>{
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = toRubyHtml(opt);
    b.dataset.idx = idx;
    b.addEventListener("click", ()=> selectOption(idx));
    optionsList.appendChild(b);
  });

  answerBtn.textContent = "解答する";
  answerBtn.className = "answer-btn";
  answerBtn.disabled = true;

  tipCard.classList.remove("show");
  nextBtn.classList.remove("show");
}

function selectOption(idx){
  if(answered) return;
  selectedOption = idx;
  [...optionsList.children].forEach((el,i)=>{
    el.classList.toggle("picked", i===idx);
  });
  answerBtn.disabled = false;
  answerBtn.classList.add("ready");
}

answerBtn.addEventListener("click", ()=>{
  if(answered || selectedOption===null) return;
  answered = true;
  const q = currentSet[currentIndex];
  const isCorrect = selectedOption === q.answer;
  if(isCorrect) correctCount++;

  [...optionsList.children].forEach((el,i)=>{
    el.disabled = true;
    if(i===q.answer) el.classList.add("correct");
    else if(i===selectedOption) el.classList.add("wrong");
  });

  answerBtn.textContent = "解答済み";
  answerBtn.classList.remove("ready");
  answerBtn.classList.add("done");
  answerBtn.disabled = true;

  tipText.textContent = q.tip_tl;
  tipCard.classList.add("show");
  nextBtn.classList.add("show");
  nextBtn.textContent = (currentIndex === currentSet.length-1) ? "結果を見る" : "次の問題へ";

  if(isCorrect) playCorrectTone(); else playWrongTone();
});

nextBtn.addEventListener("click", ()=>{
  if(currentIndex < currentSet.length - 1){
    currentIndex++;
    renderQuestion();
  }else{
    progressFill.style.width = "100%";
    showResult();
  }
});

ttsBtn.addEventListener("click", ()=>{
  speakJa(currentSet[currentIndex].question);
});

document.getElementById("backToTop").addEventListener("click", ()=>{
  window.speechSynthesis && window.speechSynthesis.cancel();
  showScreen(screenTop);
});

/* ================= RESULT SCREEN ================= */
function showResult(){
  document.getElementById("resultPart").textContent = currentPart;
  document.getElementById("resultScore").textContent = correctCount + " / " + currentSet.length;
  showScreen(screenResult);
}
document.getElementById("resultRetry").addEventListener("click", ()=> startPart(currentPart));
document.getElementById("resultBackTop").addEventListener("click", ()=>{
  renderTop();
  showScreen(screenTop);
});

/* ================= INIT ================= */
applyRubyState();
document.getElementById("rubyToggle").addEventListener("click", ()=>{
  rubyOn = !rubyOn;
  try{ localStorage.setItem(RUBY_STATE_KEY, rubyOn ? "1" : "0"); }catch(e){}
  applyRubyState();
});
renderTop();
</script>
